<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A membrana basal glomerular (MBG) — três lâminas, carga negativa</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">colágeno IV + heparan-sulfato (aniônico): a peneira de tamanho E de carga</text>

  <!-- corte em camadas (de cima = sangue, para baixo = urina) -->
  <text x="60" y="80" font-size="11" fill="#e08a96">sangue (capilar)</text>
  <rect x="60" y="86" width="420" height="30" fill="#3a7bd5" fill-opacity="0.4" stroke="#3a7bd5"/>
  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#dcebff">1 · endotélio fenestrado (fenestras grandes)</text>

  <rect x="60" y="120" width="420" height="22" fill="#1a3a2a" stroke="#52c08a"/><text x="270" y="135" text-anchor="middle" font-size="10" fill="#8fe0b0">lâmina rara interna (−)</text>
  <rect x="60" y="144" width="420" height="22" fill="#225c3a" stroke="#52c08a"/><text x="270" y="159" text-anchor="middle" font-size="10" fill="#cfeede">lâmina densa (colágeno IV)</text>
  <rect x="60" y="168" width="420" height="22" fill="#1a3a2a" stroke="#52c08a"/><text x="270" y="183" text-anchor="middle" font-size="10" fill="#8fe0b0">lâmina rara externa (−)</text>
  <text x="490" y="159" font-size="11" fill="#52c08a" font-weight="bold">2 · MBG</text>

  <rect x="60" y="194" width="420" height="30" fill="#3a214a" fill-opacity="0.6" stroke="#a06ad0"/>
  <text x="270" y="214" text-anchor="middle" font-size="11" fill="#d7baf0">3 · pedicelos + diafragma de fenda</text>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#9fb1c0">urina (espaço de Bowman)</text>

  <!-- cargas negativas -->
  <g fill="#e0556b" font-size="12" font-weight="bold">
    <text x="100" y="158">−</text><text x="180" y="158">−</text><text x="260" y="158">−</text><text x="340" y="158">−</text><text x="420" y="158">−</text>
  </g>

  <rect x="510" y="190" width="150" height="100" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="585" y="212" text-anchor="middle" font-size="10" fill="#e7eef4" font-weight="bold">Síndrome de Alport</text>
  <text x="524" y="234" font-size="9" fill="#cdd9e3">mutação do colágeno IV</text>
  <text x="524" y="250" font-size="9" fill="#cdd9e3">→ MBG defeituosa</text>
  <text x="524" y="270" font-size="9" fill="#f0c078">→ hematúria + proteinúria</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Efeitos do tiazídico — "hiper-tudo, exceto o Ca; hipo no Na e no K"</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o padrão metabólico clássico para reconhecer e monitorar</text>

  <rect x="40" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">HIPER</text>
  <text x="60" y="120" font-size="11" fill="#e7eef4">• hiperCALCEMIA (retém Ca — leve)</text>
  <text x="60" y="146" font-size="11" fill="#e7eef4">• hiperURICEMIA (compete com o úrico)</text>
  <text x="60" y="172" font-size="11" fill="#e7eef4">• hiperGLICEMIA</text>
  <text x="60" y="198" font-size="11" fill="#e7eef4">• hiperLIPIDEMIA</text>
  <text x="60" y="224" font-size="10" fill="#9fb1c0">("hiper-GLUC": glicose, lipídio, úrico, cálcio)</text>

  <rect x="350" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">HIPO</text>
  <text x="370" y="120" font-size="11" fill="#e7eef4">• hipoCALEMIA (mais Na ao ducto → K↓)</text>
  <text x="370" y="146" font-size="11" fill="#e7eef4">• hipoNATREMIA (diluição distal prejudicada)</text>
  <text x="370" y="172" font-size="11" fill="#e7eef4">• hipoMAGNESEMIA</text>
  <text x="370" y="204" font-size="10" fill="#9fb1c0">a hiponatremia é típica em idosas (cuidado)</text>

  <text x="340" y="268" text-anchor="middle" font-size="11" fill="#e8a13a">Ca urinário CAI (retém Ca), mas Ca plasmático sobe um pouco — não confundir</text>
</svg>

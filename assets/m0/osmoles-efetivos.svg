<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Osmoles efetivos × inefetivos — quem move a água</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">efetivo = NÃO atravessa a membrana → cria gradiente → move a célula</text>

  <!-- coluna efetivos -->
  <rect x="40" y="64" width="290" height="232" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="185" y="88" text-anchor="middle" font-size="13" fill="#8fe0b0" font-weight="bold">EFETIVOS (movem água)</text>
  <text x="60" y="120" font-size="12" fill="#e7eef4">• Na⁺  — domina a tonicidade do ECF</text>
  <text x="60" y="150" font-size="12" fill="#e7eef4">• Glicose (sem insulina) — puxa água</text>
  <text x="60" y="180" font-size="12" fill="#e7eef4">• Manitol — fica no ECF, encolhe a célula</text>
  <text x="60" y="210" font-size="12" fill="#e7eef4">• NaCl 3% — hipertônico terapêutico</text>
  <text x="60" y="252" font-size="11" fill="#8fe0b0">→ entram na TONICIDADE</text>
  <text x="60" y="272" font-size="10" fill="#9fb1c0">Na⁺ ≈ tonicidade / 2</text>

  <!-- coluna inefetivos -->
  <rect x="350" y="64" width="290" height="232" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="495" y="88" text-anchor="middle" font-size="13" fill="#f0c078" font-weight="bold">INEFETIVOS (não movem)</text>
  <text x="370" y="120" font-size="12" fill="#e7eef4">• Ureia — atravessa e equilibra</text>
  <text x="370" y="150" font-size="12" fill="#e7eef4">• Álcoois (etanol, metanol)</text>
  <text x="370" y="252" font-size="11" fill="#f0c078">→ entram só na OSM MEDIDA</text>
  <text x="370" y="272" font-size="10" fill="#9fb1c0">o "gap" (medida − tonicidade) = inefetivos</text>
</svg>

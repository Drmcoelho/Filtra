<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#eef6f7" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a6f7a" stroke-width="2"/>
  <rect x="20" y="14" width="56" height="24" rx="4" fill="#2a6f7a"/>
  <text x="48" y="31" text-anchor="middle" font-size="12" font-weight="bold" fill="white">M23</text>
  <text x="360" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#13434a">③ A CURVA RBV × TEMPO — três sessões</text>
  <!-- eixos -->
  <line x1="70" y1="70" x2="70" y2="255" stroke="#13434a" stroke-width="1.5"/>
  <line x1="70" y1="255" x2="600" y2="255" stroke="#13434a" stroke-width="1.5"/>
  <text x="34" y="80" font-size="10" fill="#13434a">RBV</text>
  <text x="34" y="160" font-size="10" fill="#13434a">1,0</text>
  <text x="585" y="275" font-size="10" fill="#13434a">tempo</text>
  <!-- limiar de crash -->
  <line x1="70" y1="205" x2="600" y2="205" stroke="#c07a1a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="600" y="200" text-anchor="end" font-size="10" fill="#c07a1a">④ limiar de crash (≈0,85)</text>
  <!-- curva estavel (lenta) -->
  <path d="M70 95 Q250 120 600 130" fill="none" stroke="#2a7a3a" stroke-width="3"/>
  <text x="300" y="110" font-size="11" fill="#2a7a3a">① UF lenta → RBV estável</text>
  <!-- curva intermediaria -->
  <path d="M70 95 Q250 160 600 185" fill="none" stroke="#2a6f7a" stroke-width="2.5"/>
  <text x="350" y="178" font-size="10" fill="#2a6f7a">② UF média</text>
  <!-- curva que despenca -->
  <path d="M70 95 Q200 200 430 245" fill="none" stroke="#b8402f" stroke-width="3"/>
  <text x="240" y="240" font-size="11" fill="#b8402f">③ UF rápida → despenca → crash</text>
  <text x="360" y="306" text-anchor="middle" font-size="9" fill="#13434a" opacity="0.55">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

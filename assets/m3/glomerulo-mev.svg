<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O tufo glomerular — alças capilares envoltas por podócitos</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">esquema do corpúsculo: capilares (filtram) + podócitos (polvos) + mesângio</text>

  <!-- cápsula de Bowman -->
  <circle cx="250" cy="180" r="110" fill="#0c1620" stroke="#5aa0e0" stroke-width="2"/>
  <text x="250" y="305" text-anchor="middle" font-size="10" fill="#9bbef0">cápsula de Bowman (espaço urinário)</text>

  <!-- alças capilares -->
  <g fill="#e0556b" fill-opacity="0.55" stroke="#e0556b">
    <circle cx="220" cy="150" r="26"/><circle cx="280" cy="150" r="26"/>
    <circle cx="200" cy="200" r="24"/><circle cx="255" cy="205" r="26"/><circle cx="305" cy="195" r="22"/>
  </g>
  <text x="250" y="180" text-anchor="middle" font-size="10" fill="#fff">capilares</text>

  <!-- mesângio central -->
  <circle cx="250" cy="178" r="12" fill="#e8a13a" fill-opacity="0.8"/><text x="250" y="240" text-anchor="middle" font-size="9" fill="#e8a13a">mesângio (sustenta + regula a área/Kf)</text>

  <!-- podócito (polvo) abraçando -->
  <circle cx="150" cy="120" r="14" fill="#a06ad0"/>
  <g stroke="#a06ad0" stroke-width="3" fill="none"><path d="M150,134 q10,30 60,30"/><path d="M150,134 q-6,30 30,46"/><path d="M150,134 q30,20 70,6"/></g>
  <text x="120" y="108" font-size="10" fill="#c9a0e0">podócito</text>

  <!-- entrada/saída -->
  <line x1="20" y1="150" x2="140" y2="150" stroke="#e0556b" stroke-width="7" stroke-linecap="round"/><text x="40" y="140" font-size="10" fill="#e08a96">aferente</text>
  <line x1="360" y1="160" x2="480" y2="155" stroke="#3a7bd5" stroke-width="4" stroke-linecap="round"/><text x="430" y="148" font-size="10" fill="#9bbef0">eferente</text>

  <!-- legenda das 3 barreiras -->
  <rect x="500" y="70" width="160" height="170" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="580" y="92" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">3 barreiras</text>
  <text x="514" y="120" font-size="11" fill="#3a7bd5">1 endotélio fenestrado</text>
  <text x="514" y="150" font-size="11" fill="#52c08a">2 membrana basal (MBG)</text>
  <text x="514" y="180" font-size="11" fill="#c9a0e0">3 diafragma de fenda</text>
  <text x="514" y="214" font-size="10" fill="#9fb1c0">+ todas com carga</text>
  <text x="514" y="228" font-size="10" fill="#9fb1c0">aniônica (−)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0d1b16" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a7a4a" stroke-width="2"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#bfe9cf">Os dois pontos de monitorização do cálcio</text>
  <!-- circuito esquemático -->
  <line x1="80" y1="120" x2="280" y2="120" stroke="#7fb0c8" stroke-width="6"/>
  <rect x="280" y="90" width="70" height="60" rx="6" fill="#15302a" stroke="#39c08a" stroke-width="2"/>
  <text x="315" y="125" text-anchor="middle" font-size="11" fill="#9fe0c0">filtro</text>
  <line x1="350" y1="120" x2="560" y2="120" stroke="#7fb0c8" stroke-width="6"/>
  <line x1="560" y1="120" x2="560" y2="210" stroke="#7fb0c8" stroke-width="6"/>
  <line x1="560" y1="210" x2="80" y2="210" stroke="#7fb0c8" stroke-width="6"/>
  <!-- monitor 1: circuito (pós-filtro) -->
  <circle cx="400" cy="120" r="10" fill="#e8a13a"/>
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#e8a13a">① Ca²⁺ do CIRCUITO</text>
  <text x="400" y="64" text-anchor="middle" font-size="11" fill="#e8a13a">alvo 0,25–0,35 (baixo)</text>
  <!-- monitor 2: sistêmico (no paciente) -->
  <circle cx="200" cy="210" r="10" fill="#52c08a"/>
  <text x="200" y="250" text-anchor="middle" font-size="12" fill="#52c08a">② Ca²⁺ SISTÊMICO</text>
  <text x="200" y="266" text-anchor="middle" font-size="11" fill="#52c08a">alvo 1,1–1,3 (normal)</text>
  <text x="320" y="170" text-anchor="middle" font-size="11" fill="#9fc8d8">titula-se o CITRATO por ① e o CÁLCIO por ②</text>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="#6fae8a">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

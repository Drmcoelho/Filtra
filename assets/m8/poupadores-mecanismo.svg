<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc"><title id="title">Poupadores de K⁺: dois alvos</title><desc id="desc">ARM bloqueiam sinal hormonal; amilorida/triamtereno bloqueiam diretamente o ENaC.</desc><defs><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55cbd3"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e56666"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e4ae4f"/></marker><style>.t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eef5f4}.h{font-weight:800}.title{font-size:45px}.sub{font-size:20px}.m{font-size:25px}.s{font-size:18px}.xs{font-size:15px}.dim{fill:#a8bec4}.p{fill:#10212c;stroke:#355463;stroke-width:2}.p2{fill:#162b37;stroke:#355463;stroke-width:2}.fc{fill:none;stroke:#55cbd3;stroke-width:4;marker-end:url(#ac)}.fr{fill:none;stroke:#e56666;stroke-width:4;marker-end:url(#ar)}.fg{fill:none;stroke:#e4ae4f;stroke-width:4;marker-end:url(#ag)}</style></defs><rect width="1448" height="1086" fill="#071018"/><text x="42" y="64" class="t h title"><tspan fill="#55cbd3">FILTRA</tspan><tspan fill="#e4ae4f"> · Poupadores de K⁺: dois alvos</tspan></text><text x="44" y="101" class="t sub dim">ARM bloqueiam sinal hormonal; amilorida/triamtereno bloqueiam diretamente o ENaC.</text><g transform="translate(36 120)"><rect width="210" height="210" rx="20" class="p"/><path d="M95 28C48 22 32 70 42 115c9 42 41 71 76 61 21-6 20-30 8-51-10-18-6-36 8-50 20-21 1-42-39-47Z" fill="#a64148" stroke="#ef8b83" stroke-width="4"/><path d="M106 48c-24 9-32 36-27 61 5 24 20 41 37 42-9-20-8-42 6-62 10-14 5-31-16-41Z" fill="#e2a477" opacity=".72"/><circle cx="115" cy="91" r="13" fill="#55cbd3"/><path d="M128 91H178" class="fc"/><text x="105" y="198" text-anchor="middle" class="t h s">célula principal</text></g><g transform="translate(278 132)"><rect width="1134" height="830" rx="24" class="p"/>
<rect x="44" y="62" width="500" height="564" rx="22" class="p2"/><text x="294" y="112" text-anchor="middle" class="t h m" fill="#e98b4a">ARM</text><text x="294" y="146" text-anchor="middle" class="t s">espironolactona · eplerenona</text><circle cx="150" cy="238" r="42" fill="#3b1d24" stroke="#e56666" stroke-width="3"/><text x="150" y="245" text-anchor="middle" class="t h s">ALDO</text><path d="M200 238H294" class="fr"/><rect x="306" y="209" width="92" height="58" rx="16" fill="#17333d" stroke="#e98b4a" stroke-width="3"/><text x="352" y="246" text-anchor="middle" class="t h s">MR</text><line x1="284" y1="194" x2="410" y2="282" stroke="#e56666" stroke-width="10"/><text x="294" y="348" text-anchor="middle" class="t s">transcrição de SGK1/ENaC ↓</text><text x="294" y="386" text-anchor="middle" class="t s">efeito depende de aldosterona/MR</text><text x="294" y="448" text-anchor="middle" class="t h s" fill="#69c78c">Na⁺ reabsorvido ↓ · K⁺ secretado ↓</text><text x="294" y="492" text-anchor="middle" class="t xs dim">espironolactona: efeitos endócrinos possíveis</text>
<rect x="590" y="62" width="500" height="564" rx="22" class="p2"/><text x="840" y="112" text-anchor="middle" class="t h m" fill="#55cbd3">BLOQUEIO DIRETO DO ENaC</text><text x="840" y="146" text-anchor="middle" class="t s">amilorida · triamtereno</text><rect x="642" y="190" width="92" height="280" rx="26" fill="#3b2847" stroke="#b58ae0" stroke-width="2"/><text x="688" y="224" text-anchor="middle" class="t h xs">LÚMEN</text><rect x="734" y="284" width="112" height="58" rx="16" fill="#17333d" stroke="#55cbd3" stroke-width="3"/><text x="790" y="321" text-anchor="middle" class="t h s">ENaC</text><line x1="720" y1="262" x2="860" y2="350" stroke="#e56666" stroke-width="10"/><circle cx="930" cy="313" r="32" fill="#5c9fe8"/><text x="930" y="320" text-anchor="middle" class="t h s">Na⁺</text><text x="840" y="448" text-anchor="middle" class="t h s" fill="#69c78c">efeito mesmo com aldosterona baixa</text><text x="840" y="492" text-anchor="middle" class="t xs dim">Liddle responde aqui, não ao bloqueio do MR</text>
<rect x="44" y="676" width="1046" height="116" rx="20" fill="#281d1d" stroke="#e56666"/><text x="70" y="718" class="t h s">RISCO COMUM</text><text x="70" y="756" class="t s">hipercalemia, sobretudo com DRC, IECA/BRA, diabetes ou combinação de bloqueios.</text></g><rect x="32" y="1018" width="1384" height="43" rx="14" fill="#0d1821" stroke="#355463"/><text x="724" y="1046" text-anchor="middle" class="t s"><tspan fill="#55cbd3">MR bloqueado × ENaC bloqueado</tspan><tspan class="dim"> · M8 · ducto coletor</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Dose-resposta dos fármacos do ducto coletor (Emax)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o bloqueio (do receptor de aldo, do ENaC ou do V2) satura num teto — efeito = Emax·D/(EC50+D)</text>
  <line x1="70" y1="262" x2="640" y2="262" stroke="#3a4a58"/>
  <line x1="70" y1="64" x2="70" y2="262" stroke="#3a4a58"/>
  <text x="355" y="288" text-anchor="middle" font-size="11" fill="#9fb1c0">dose →</text>
  <text x="30" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 30 170)">% de bloqueio</text>
  <path d="M70,262 C150,150 260,100 400,90 C500,84 560,82 640,81" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <line x1="70" y1="81" x2="640" y2="81" stroke="#52c08a" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <text x="80" y="77" font-size="10" fill="#8fe0b0">Emax (teto)</text>
  <line x1="170" y1="172" x2="170" y2="262" stroke="#e8a13a" stroke-dasharray="3 3"/>
  <text x="170" y="278" text-anchor="middle" font-size="9" fill="#e8a13a">EC50</text>
  <text x="430" y="120" font-size="11" fill="#9fb1c0">faixa terapêutica já perto do teto</text>
  <text x="340" y="296" text-anchor="middle" font-size="9" fill="#9fb1c0">é assim que o motor calcula o efeito de cada chave no Lab</text>
</svg>

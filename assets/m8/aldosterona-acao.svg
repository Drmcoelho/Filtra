<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Aldosterona na célula principal — "Na entra, K e H saem"</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">abre o ENaC (apical) e a Na⁺/K⁺-ATPase (basal); o Na que entra deixa a luz negativa</text>

  <rect x="40" y="70" width="600" height="40" rx="6" fill="#3a214a" fill-opacity="0.4" stroke="#a06ad0"/><text x="56" y="64" font-size="10" fill="#c9a0e0">LUZ (ducto coletor)</text>
  <rect x="40" y="150" width="600" height="60" fill="#10202c" stroke="#3a4a58"/><text x="56" y="146" font-size="10" fill="#9fb1c0">CÉLULA PRINCIPAL</text>

  <!-- ENaC -->
  <rect x="160" y="100" width="70" height="60" rx="6" fill="#16202a" stroke="#39c0c8" stroke-width="2"/><text x="195" y="135" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">ENaC</text>
  <line x1="195" y1="110" x2="195" y2="150" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#a)"/><text x="195" y="96" text-anchor="middle" font-size="9" fill="#9fe3ec">Na⁺ entra</text>
  <!-- ROMK (K sai) -->
  <rect x="300" y="100" width="70" height="60" rx="6" fill="#16202a" stroke="#e8a13a" stroke-width="2"/><text x="335" y="135" text-anchor="middle" font-size="11" fill="#f0c078" font-weight="bold">ROMK</text>
  <line x1="335" y1="150" x2="335" y2="110" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#a)"/><text x="335" y="96" text-anchor="middle" font-size="9" fill="#f0c078">K⁺ sai</text>
  <!-- H+ (intercalar) -->
  <rect x="440" y="100" width="70" height="60" rx="6" fill="#16202a" stroke="#e0556b" stroke-width="2"/><text x="475" y="135" text-anchor="middle" font-size="10" fill="#e08a96" font-weight="bold">H⁺-ATPase</text>
  <line x1="475" y1="150" x2="475" y2="110" stroke="#e0556b" stroke-width="2.5" marker-end="url(#a)"/><text x="475" y="96" text-anchor="middle" font-size="9" fill="#e08a96">H⁺ sai</text>

  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#e8a13a">aldo↑ → mais Na reabsorvido + mais K/H secretados → hipocalemia + alcalose</text>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="#9fb1c0">bloquear o receptor (espironolactona) ou o ENaC (amilorida) → poupa K (hipercalemia)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="f" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Fração de filtração (FF) — quando a eferente fecha</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">FF = TFG / FPR · a eferente constrita preserva a TFG enquanto o fluxo cai → FF↑</text>

  <!-- equação -->
  <rect x="200" y="58" width="280" height="30" rx="6" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="78" text-anchor="middle" font-size="14" fill="#e7eef4">FF = TFG ÷ FPR  (normal ~0,20)</text>

  <!-- glomérulo com eferente constrita -->
  <circle cx="200" cy="170" r="44" fill="#0f3540" stroke="#39c0c8" stroke-width="2"/>
  <text x="200" y="174" text-anchor="middle" font-size="11" fill="#9fe3ec">glomérulo</text>
  <line x1="80" y1="160" x2="158" y2="168" stroke="#e0556b" stroke-width="10" stroke-linecap="round"/>
  <text x="92" y="146" font-size="10" fill="#e08a96">aferente</text>
  <line x1="244" y1="168" x2="320" y2="160" stroke="#3a7bd5" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="146" font-size="10" fill="#9bbef0">eferente ↑R (estreita)</text>

  <!-- capilar peritubular -->
  <ellipse cx="430" cy="220" rx="60" ry="22" fill="#10202c" stroke="#3a7bd5"/>
  <text x="430" y="224" text-anchor="middle" font-size="10" fill="#9bbef0">capilar peritubular</text>
  <line x1="320" y1="160" x2="400" y2="200" stroke="#3a7bd5" stroke-width="4" marker-end="url(#f)"/>

  <!-- consequências -->
  <g font-size="12" fill="#e7eef4">
    <rect x="350" y="96" width="300" height="28" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="364" y="115">TFG mantida, mas FPR (fluxo) ↓</text>
    <rect x="350" y="128" width="300" height="28" rx="6" fill="#0f3540" stroke="#39c0c8"/><text x="364" y="147" fill="#9fe3ec">⇒ FF sobe (filtra-se fração maior do plasma)</text>
    <rect x="350" y="252" width="300" height="28" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="364" y="271">⇒ π peritubular ↑ → reabsorção de Na/água ↑</text>
  </g>
  <text x="200" y="240" text-anchor="middle" font-size="10" fill="#9fb1c0">é assim que a Ang II protege a TFG na hipoperfusão</text>
</svg>

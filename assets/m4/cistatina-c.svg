<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Cistatina C — o marcador independente de massa muscular</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">produzida por TODAS as células nucleadas (não só músculo) → rastreia a TFG</text>

  <rect x="40" y="64" width="290" height="120" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="185" y="88" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">Creatinina</text>
  <text x="185" y="114" text-anchor="middle" font-size="11" fill="#e7eef4">vem do músculo</text>
  <text x="185" y="138" text-anchor="middle" font-size="10" fill="#9fb1c0">varia com massa, dieta (carne),</text>
  <text x="185" y="154" text-anchor="middle" font-size="10" fill="#9fb1c0">idade, sexo, amputação</text>
  <text x="185" y="176" text-anchor="middle" font-size="10" fill="#f0c078">→ engana nos extremos de massa</text>

  <rect x="350" y="64" width="290" height="120" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="495" y="88" text-anchor="middle" font-size="12" fill="#8fe0b0" font-weight="bold">Cistatina C</text>
  <text x="495" y="114" text-anchor="middle" font-size="11" fill="#e7eef4">todas as células nucleadas</text>
  <text x="495" y="138" text-anchor="middle" font-size="10" fill="#9fb1c0">independe de massa/dieta</text>
  <text x="495" y="154" text-anchor="middle" font-size="10" fill="#9fb1c0">(sofre com corticoide, tireoide)</text>
  <text x="495" y="176" text-anchor="middle" font-size="10" fill="#8fe0b0">→ melhor no idoso/sarcopênico</text>

  <rect x="120" y="206" width="440" height="68" rx="8" fill="#10202c" stroke="#39c0c8"/>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">A melhor estimativa combina as duas (eGFR creatinina + cistatina)</text>
  <text x="340" y="252" text-anchor="middle" font-size="10" fill="#cdd9e3">quando creatinina e cistatina discordam, suspeite da MASSA muscular</text>
  <text x="340" y="268" text-anchor="middle" font-size="9" fill="#9fb1c0">a cistatina é filtrada e metabolizada no túbulo (não tem clearance urinário útil)</text>
</svg>

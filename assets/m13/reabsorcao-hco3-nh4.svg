<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O rim faz DUAS coisas com o HCO₃⁻: reabsorve e REGENERA</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">reabsorver o filtrado não cria base; regenerar (excretando H⁺) repõe o que o tampão gastou</text>

  <rect x="40" y="64" width="290" height="200" rx="10" fill="#0c2330" stroke="#39c0c8"/>
  <text x="185" y="86" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">1) Reabsorção (TCP, ~80–90%)</text>
  <text x="56" y="112" font-size="11" fill="#e7eef4">H⁺ secretado (NHE3) + HCO₃⁻ filtrado</text>
  <text x="56" y="132" font-size="11" fill="#e7eef4">→ CO₂ + H₂O (anidrase carbônica)</text>
  <text x="56" y="152" font-size="11" fill="#e7eef4">→ entra, vira HCO₃⁻ de volta ao sangue</text>
  <text x="56" y="178" font-size="10" fill="#9fb1c0">recupera o que foi filtrado;</text>
  <text x="56" y="194" font-size="10" fill="#9fb1c0">NÃO gera base nova</text>
  <text x="56" y="222" font-size="10" fill="#e8a13a">falha aqui = ATR proximal (tipo II)</text>

  <rect x="350" y="64" width="290" height="200" rx="10" fill="#10202c" stroke="#52c08a"/>
  <text x="495" y="86" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">2) Regeneração (distal)</text>
  <text x="366" y="112" font-size="11" fill="#e7eef4">H⁺ secretado e tamponado na urina:</text>
  <text x="380" y="134" font-size="11" fill="#cdd9e3">• acidez titulável (fosfato)</text>
  <text x="380" y="154" font-size="11" fill="#cdd9e3">• NH₄⁺ (amoniogênese — ajustável)</text>
  <text x="366" y="180" font-size="10" fill="#9fb1c0">cada H⁺ excretado = 1 HCO₃⁻ NOVO</text>
  <text x="366" y="200" font-size="10" fill="#9fb1c0">repõe o HCO₃⁻ consumido pelos ácidos</text>
  <text x="366" y="226" font-size="10" fill="#e8a13a">falha aqui = ATR distal (tipo I)</text>

  <text x="340" y="284" text-anchor="middle" font-size="10" fill="#e8a13a">na acidose, o rim aumenta a amoniogênese — é o tampão urinário que ele consegue AJUSTAR</text>
</svg>

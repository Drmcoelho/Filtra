<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8a13a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Ureia × creatinina — por que a BUN:Cr sobe na pré-renal</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a ureia é reabsorvida (segue a água); a creatinina não — no baixo fluxo, a ureia "volta" mais</text>

  <rect x="40" y="70" width="290" height="150" rx="10" fill="#0c2330" stroke="#39c0c8"/>
  <text x="185" y="92" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">Ureia</text>
  <text x="56" y="116" font-size="11" fill="#e7eef4">filtrada e REABSORVIDA (passiva)</text>
  <text x="56" y="138" font-size="11" fill="#e7eef4">acompanha a reabsorção de água</text>
  <line x1="120" y1="152" x2="60" y2="152" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="156" font-size="10" fill="#f0c078">parte volta ao sangue</text>
  <text x="56" y="184" font-size="10" fill="#9fb1c0">baixo fluxo (pré-renal) → reabsorve MAIS</text>
  <text x="56" y="204" font-size="10" fill="#9fb1c0">→ BUN sobe desproporcional</text>

  <rect x="350" y="70" width="290" height="150" rx="10" fill="#10202c" stroke="#3a7bd5"/>
  <text x="495" y="92" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">Creatinina</text>
  <text x="366" y="116" font-size="11" fill="#e7eef4">filtrada e SECRETADA (não reabsorve)</text>
  <text x="366" y="138" font-size="11" fill="#e7eef4">não depende do fluxo de água</text>
  <text x="366" y="170" font-size="10" fill="#9fb1c0">o fluxo não a "traz de volta"</text>
  <text x="366" y="190" font-size="10" fill="#9fb1c0">→ sobe proporcional à queda da TFG</text>

  <text x="340" y="246" text-anchor="middle" font-size="12" fill="#e8a13a">resultado: BUN:Cr &gt; 20 sugere pré-renal (ou sangramento GI/corticoide); ~10–15 = intrínseca</text>
  <text x="340" y="272" text-anchor="middle" font-size="9" fill="#9fb1c0">recap do M4: a creatinina é imperfeita, mas a razão com a ureia carrega informação de fluxo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Quando o ENaC é o problema — genética e a escolha do fármaco</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o estado do ENaC define o quadro E o diurético que funciona</text>

  <rect x="40" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">Liddle (ENaC sempre aberto)</text>
  <text x="60" y="122" font-size="11" fill="#e7eef4">ENaC hiperfuncionante (mutação)</text>
  <text x="60" y="146" font-size="11" fill="#e7eef4">→ HAS + hipoK + alcalose</text>
  <text x="60" y="170" font-size="11" fill="#e7eef4">→ aldosterona e renina BAIXAS</text>
  <text x="60" y="198" font-size="11" fill="#f0c078">trata com AMILORIDA (não com ARM!)</text>
  <text x="60" y="220" font-size="10" fill="#9fb1c0">a espironolactona não serve: não há aldo p/ bloquear</text>

  <rect x="350" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">Pseudo-hipoaldosteronismo</text>
  <text x="370" y="122" font-size="11" fill="#e7eef4">ENaC/receptor não respondem à aldo</text>
  <text x="370" y="146" font-size="11" fill="#e7eef4">→ perde Na, retém K → hipercalemia</text>
  <text x="370" y="170" font-size="11" fill="#e7eef4">→ aldosterona ALTA (resistência)</text>
  <text x="370" y="200" font-size="10" fill="#9fb1c0">espelho do Liddle: o canal é o eixo</text>
  <text x="370" y="222" font-size="10" fill="#9fb1c0">o número (aldo) só faz sentido com o mecanismo</text>
</svg>

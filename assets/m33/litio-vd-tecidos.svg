<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Georgia,serif">
  <rect width="640" height="340" fill="#0a1016"/>
  <rect x="2" y="2" width="636" height="336" rx="6" fill="none" stroke="#283642" stroke-width="2"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Lítio: muito dialisável — mas REBOTA dos tecidos</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#9fb1c0">o íon vive DENTRO da célula; a HD esvazia o sangue, depois os tecidos reenchem</text>

  <!-- compartimento sangue -->
  <rect x="60" y="90" width="200" height="180" rx="10" fill="#39c0c8" opacity="0.10" stroke="#39c0c8"/>
  <text x="160" y="112" text-anchor="middle" font-size="13" fill="#39c0c8" font-weight="bold">SANGUE (plasma)</text>
  <text x="160" y="130" text-anchor="middle" font-size="10" fill="#9fb1c0">a HD remove daqui</text>
  <circle cx="110" cy="160" r="6" fill="#39c0c8"/><circle cx="140" cy="180" r="6" fill="#39c0c8"/>
  <circle cx="180" cy="155" r="6" fill="#39c0c8"/>

  <!-- compartimento tecido -->
  <rect x="380" y="90" width="200" height="180" rx="10" fill="#e8a13a" opacity="0.10" stroke="#e8a13a"/>
  <text x="480" y="112" text-anchor="middle" font-size="13" fill="#e8a13a" font-weight="bold">TECIDOS (intracelular)</text>
  <text x="480" y="130" text-anchor="middle" font-size="10" fill="#9fb1c0">reservatório do Li⁺</text>
  <circle cx="420" cy="160" r="6" fill="#e8a13a"/><circle cx="450" cy="180" r="6" fill="#e8a13a"/>
  <circle cx="490" cy="155" r="6" fill="#e8a13a"/><circle cx="520" cy="185" r="6" fill="#e8a13a"/>
  <circle cx="540" cy="160" r="6" fill="#e8a13a"/><circle cx="465" cy="220" r="6" fill="#e8a13a"/>
  <circle cx="510" cy="225" r="6" fill="#e8a13a"/>

  <!-- setas -->
  <line x1="260" y1="170" x2="375" y2="170" stroke="#e0556b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="318" y="160" text-anchor="middle" font-size="11" fill="#e0556b">REBOTE →</text>
  <text x="318" y="200" text-anchor="middle" font-size="10" fill="#9fb1c0">tecidos reenchem o sangue</text>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e0556b"/></marker></defs>

  <rect x="80" y="288" width="480" height="32" rx="6" fill="#141b22" stroke="#283642"/>
  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#e7eef4">Vd baixo no PLASMA → dialisável; pool intracelular → nível SOBE pós-sessão → repetir</text>
  <text x="320" y="334" text-anchor="middle" font-size="9" fill="#9fb1c0" opacity="0.6">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

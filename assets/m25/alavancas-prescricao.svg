<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0f1620" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <rect x="20" y="16" width="56" height="24" rx="4" fill="#39c0c8"/>
  <text x="48" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#05181a">M25</text>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#9fb1c0">As alavancas da prescrição — o que se MOVE para o alvo</text>
  <!-- target box -->
  <rect x="230" y="250" width="180" height="48" rx="8" fill="#52c08a" fill-opacity="0.15" stroke="#52c08a"/>
  <text x="320" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#52c08a">Kt/V ≥ 1,2</text>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#9fb1c0">a meta da sessão</text>
  <!-- lever 1: tempo -->
  <rect x="40" y="70" width="130" height="70" rx="6" fill="#e8a13a" fill-opacity="0.12" stroke="#e8a13a"/>
  <text x="105" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8a13a">① ↑ tempo (t)</text>
  <text x="105" y="116" text-anchor="middle" font-size="10" fill="#9fb1c0">mais horas</text>
  <text x="105" y="131" text-anchor="middle" font-size="10" fill="#9fb1c0">sobe K·t direto</text>
  <line x1="105" y1="140" x2="280" y2="250" stroke="#e8a13a" stroke-width="1.5"/>
  <!-- lever 2: Qb -->
  <rect x="255" y="70" width="130" height="70" rx="6" fill="#52c08a" fill-opacity="0.12" stroke="#52c08a"/>
  <text x="320" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#52c08a">② ↑ Qb</text>
  <text x="320" y="116" text-anchor="middle" font-size="10" fill="#9fb1c0">fluxo de sangue</text>
  <text x="320" y="131" text-anchor="middle" font-size="10" fill="#9fb1c0">sobe K (satura)</text>
  <line x1="320" y1="140" x2="320" y2="250" stroke="#52c08a" stroke-width="1.5"/>
  <!-- lever 3: dialisador/Qd -->
  <rect x="470" y="70" width="130" height="70" rx="6" fill="#39c0c8" fill-opacity="0.12" stroke="#39c0c8"/>
  <text x="535" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#39c0c8">③ ↑ Qd / high-flux</text>
  <text x="535" y="116" text-anchor="middle" font-size="10" fill="#9fb1c0">banho + membrana</text>
  <text x="535" y="131" text-anchor="middle" font-size="10" fill="#9fb1c0">sobe o KoA efetivo</text>
  <line x1="535" y1="140" x2="360" y2="250" stroke="#39c0c8" stroke-width="1.5"/>
  <text x="320" y="190" text-anchor="middle" font-size="11" fill="#9fb1c0">saturado o clearance → ① tempo é a saída</text>
</svg>

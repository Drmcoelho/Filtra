<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O diagrama de Davenport — pH × HCO₃⁻ com isóbaras de PCO₂</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#9fb1c0">cada distúrbio move o ponto numa direção típica; as curvas são linhas de PCO₂ constante</text>

  <!-- eixos -->
  <line x1="70" y1="60" x2="70" y2="280" stroke="#3a4a58"/>
  <line x1="70" y1="280" x2="640" y2="280" stroke="#3a4a58"/>
  <text x="355" y="306" text-anchor="middle" font-size="11" fill="#9fb1c0">pH →</text>
  <text x="30" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 30 170)">HCO₃⁻ (mEq/L)</text>

  <!-- isóbaras (esquemáticas) -->
  <path d="M120,250 Q300,150 600,90" fill="none" stroke="#3a7bd5" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="600" y="86" font-size="9" fill="#9bbef0">PCO₂ 60</text>
  <path d="M120,265 Q330,175 600,120" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <text x="605" y="118" font-size="9" fill="#9fe3ec">PCO₂ 40</text>
  <path d="M120,275 Q360,210 600,160" fill="none" stroke="#52c08a" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="600" y="158" font-size="9" fill="#9fe3ec">PCO₂ 20</text>

  <!-- caixa normal -->
  <rect x="330" y="170" width="40" height="26" fill="#52c08a" fill-opacity="0.25" stroke="#52c08a"/>
  <circle cx="350" cy="183" r="4" fill="#e7eef4"/>
  <text x="350" y="160" text-anchor="middle" font-size="9" fill="#9fe3ec">normal</text>

  <!-- setas de distúrbio -->
  <text x="150" y="250" font-size="10" fill="#e08a96">↙ acidose</text>
  <text x="150" y="264" font-size="10" fill="#e08a96">metabólica</text>
  <text x="520" y="110" font-size="10" fill="#9bbef0">alcalose ↗</text>
  <text x="520" y="124" font-size="10" fill="#9bbef0">metabólica</text>
  <text x="150" y="110" font-size="10" fill="#f0c078">acidose respiratória ↑PCO₂</text>
  <text x="430" y="250" font-size="10" fill="#9fe3ec">alcalose respiratória ↓PCO₂</text>

  <text x="340" y="300" text-anchor="middle" font-size="9" fill="#e8a13a">o Instrumento computa este diagrama do engine e marca o ponto atual (pH, HCO₃)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="c" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52c08a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Convecção — o solvente arrasta o soluto ("solvent drag")</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a água empurrada pela pressão carrega o soluto junto; remove bem as moléculas MÉDIAS</text>

  <!-- fluxo de água grande arrastando solutos médios -->
  <rect x="50" y="90" width="430" height="120" rx="60" fill="#0c2330" stroke="#39c0c8"/>
  <text x="120" y="80" font-size="10" fill="#9fb1c0">sangue + água sob pressão</text>
  <line x1="70" y1="150" x2="470" y2="150" stroke="#52c08a" stroke-width="3" marker-end="url(#c)"/>
  <g fill="#e8a13a"><circle cx="130" cy="130" r="8"/><circle cx="220" cy="170" r="8"/><circle cx="300" cy="135" r="8"/><circle cx="380" cy="168" r="8"/></g>
  <text x="250" y="118" font-size="10" fill="#f0c078" text-anchor="middle">moléculas médias arrastadas pelo fluxo →</text>

  <!-- membrana de saída -->
  <rect x="488" y="90" width="12" height="120" fill="#5a6b78"/>
  <rect x="504" y="90" width="120" height="120" rx="8" fill="#102a18" stroke="#52c08a"/>
  <text x="564" y="150" font-size="10" fill="#9fe3ec" text-anchor="middle">efluente</text>
  <circle cx="540" cy="170" r="7" fill="#e8a13a"/><circle cx="585" cy="135" r="7" fill="#e8a13a"/>

  <text x="340" y="244" text-anchor="middle" font-size="11" fill="#e7eef4">clearance convectivo = Jv × sieving (S)</text>
  <text x="340" y="266" text-anchor="middle" font-size="10" fill="#e8a13a">não depende do gradiente — depende do FLUXO de água (Jv) e de quanto a molécula passa (S)</text>
  <text x="340" y="286" text-anchor="middle" font-size="9" fill="#9fb1c0">é o mecanismo da hemofiltração (HF) e da fração convectiva da HDF/TRRC</text>
</svg>

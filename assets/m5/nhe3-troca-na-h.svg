<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="n" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0556b"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">NHE3 — o trocador Na⁺/H⁺ que move o HCO₃</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">Na entra, H⁺ sai para a luz; o H⁺ recupera o bicarbonato filtrado (com a anidrase)</text>

  <!-- luz e célula -->
  <rect x="40" y="70" width="600" height="40" rx="6" fill="#3a214a" fill-opacity="0.4" stroke="#a06ad0"/><text x="56" y="64" font-size="10" fill="#c9a0e0">LUZ</text>
  <rect x="40" y="150" width="600" height="60" fill="#10202c" stroke="#3a4a58"/><text x="56" y="146" font-size="10" fill="#9fb1c0">CÉLULA TCP</text>

  <!-- NHE3 -->
  <rect x="300" y="100" width="80" height="60" rx="6" fill="#16202a" stroke="#e0556b" stroke-width="2"/>
  <text x="340" y="135" text-anchor="middle" font-size="11" fill="#e08a96" font-weight="bold">NHE3</text>
  <line x1="320" y1="150" x2="320" y2="110" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#n)"/><text x="305" y="128" font-size="10" fill="#9fe3ec">Na⁺→</text>
  <line x1="360" y1="110" x2="360" y2="150" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#n)"/><text x="372" y="128" font-size="10" fill="#f0c078">←H⁺</text>

  <!-- recuperação do HCO3 na luz -->
  <text x="150" y="92" font-size="11" fill="#9fb1c0">H⁺ + HCO₃⁻ → H₂CO₃ → CO₂ + H₂O</text>
  <text x="150" y="200" font-size="11" fill="#9fb1c0">(dentro) CO₂ + H₂O → HCO₃⁻ → sangue</text>
  <text x="150" y="76" font-size="9" fill="#52c08a">anidrase carbônica luminal (alvo da acetazolamida)</text>

  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#e8a13a">bloquear a anidrase (acetazolamida) → o HCO₃ não é recuperado → bicarbonatúria</text>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="#9fb1c0">e o Na deixa de ser reabsorvido junto → natriurese leve (diurético fraco)</text>
</svg>

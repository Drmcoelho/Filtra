<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="system-ui,Segoe UI,Arial" role="img">
  <rect width="520" height="300" fill="#0a1016"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A dose é o EFLUENTE (mL/kg/h)</text>
  <!-- formula -->
  <rect x="90" y="55" width="340" height="50" rx="8" fill="#141b22" stroke="#39c0c8"/>
  <text x="260" y="86" text-anchor="middle" font-size="17" fill="#39c0c8">dose = (Qd + Qf) · 60 ÷ peso</text>
  <!-- componentes -->
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#e0556b">Qd (dialisato, difusão)</text>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="#52c08a">Qf (UF, convecção)</text>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#9fb1c0">= efluente total (mL/min)</text>
  <!-- alvo -->
  <line x1="320" y1="130" x2="320" y2="200" stroke="#3a4a58"/>
  <rect x="300" y="150" width="40" height="50" fill="#39c0c8" fill-opacity="0.4" stroke="#39c0c8"/>
  <text x="380" y="170" font-size="12" fill="#39c0c8" font-weight="bold">alvo ~25</text>
  <text x="380" y="186" font-size="11" fill="#9fb1c0">mL/kg/h</text>
  <text x="40" y="240" font-size="11" fill="#9fb1c0">① a dose contínua é o volume de efluente por kg por hora — não Kt/V (M28).</text>
  <text x="40" y="258" font-size="11" fill="#9fb1c0">② efluente = Qd (difusato) + Qf (ultrafiltrado), conforme o modo; alvo ~25 mL/kg/h.</text>
  <text x="40" y="276" font-size="11" fill="#9fb1c0">③ paciente mais pesado → mesma dose pede mais efluente total (mL/min).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0556b"/></marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker>
  </defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Os fluxos que controlam a física (ponte com o M20)</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#9fb1c0">Qb e Qd alimentam a difusão; a TMP gera o Jv (UF/convecção) — os botões do circuito</text>

  <!-- dialisador contracorrente -->
  <rect x="220" y="100" width="240" height="80" rx="10" fill="#10202c" stroke="#5a6b78"/>
  <text x="340" y="145" text-anchor="middle" font-size="11" fill="#e7eef4">dialisador (membrana)</text>

  <!-- sangue (vermelho) entra em cima, sai embaixo -->
  <line x1="120" y1="120" x2="220" y2="120" stroke="#e0556b" stroke-width="3" marker-end="url(#b1)"/>
  <text x="120" y="112" font-size="10" fill="#e08a96">sangue Qb (≈300 mL/min)</text>
  <line x1="460" y1="160" x2="560" y2="160" stroke="#e0556b" stroke-width="3" marker-end="url(#b1)"/>
  <text x="470" y="180" font-size="9" fill="#e08a96">sangue depurado</text>

  <!-- dialisato (ciano) contracorrente -->
  <line x1="560" y1="120" x2="460" y2="120" stroke="#39c0c8" stroke-width="3" marker-end="url(#b2)"/>
  <text x="470" y="112" font-size="10" fill="#9fe3ec">dialisato Qd (≈500 mL/min)</text>
  <line x1="220" y1="160" x2="120" y2="160" stroke="#39c0c8" stroke-width="3" marker-end="url(#b2)"/>
  <text x="120" y="180" font-size="9" fill="#9fe3ec">efluente</text>

  <!-- TMP/UF -->
  <line x1="340" y1="180" x2="340" y2="230" stroke="#3a7bd5" stroke-width="3" marker-end="url(#b2)"/>
  <text x="340" y="248" text-anchor="middle" font-size="10" fill="#9bbef0">UF (Jv = Kuf·TMP)</text>

  <g font-size="10" fill="#e7eef4">
    <text x="40" y="270">Qb↑ → mais difusão · Qd↑ → mantém o gradiente · TMP↑ → mais UF/convecção</text>
  </g>
  <text x="340" y="290" text-anchor="middle" font-size="9" fill="#9fb1c0">contracorrente: sangue e dialisato em sentidos opostos maximizam o gradiente</text>
</svg>

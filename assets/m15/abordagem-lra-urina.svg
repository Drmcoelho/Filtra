<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A LRA pela urina — um fluxograma de mecanismo</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">creatinina↑ ou oligúria → a urina decide entre pré-renal, intrínseca e pós-renal (capstone M16)</text>

  <rect x="260" y="58" width="160" height="36" rx="8" fill="#0c2330" stroke="#39c0c8"/>
  <text x="340" y="81" text-anchor="middle" font-size="11" fill="#9fe3ec">LRA (Cr↑ / oligúria)</text>
  <line x1="340" y1="94" x2="340" y2="110" stroke="#39c0c8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="250" y="110" width="180" height="30" rx="6" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="130" text-anchor="middle" font-size="10" fill="#e7eef4">descartar pós-renal (US: hidronefrose?)</text>
  <line x1="340" y1="140" x2="340" y2="156" stroke="#39c0c8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="250" y="156" width="180" height="30" rx="6" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="176" text-anchor="middle" font-size="10" fill="#e7eef4">índices urinários + sedimento</text>

  <line x1="340" y1="186" x2="150" y2="212" stroke="#52c08a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="186" x2="340" y2="212" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="186" x2="540" y2="212" stroke="#e0556b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="214" width="220" height="84" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="150" y="236" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">PRÉ-RENAL</text>
  <text x="56" y="256" font-size="9" fill="#cdd9e3">FE_Na&lt;1 · U_osm&gt;500 · BUN:Cr&gt;20</text>
  <text x="56" y="272" font-size="9" fill="#cdd9e3">sedimento limpo/hialino</text>
  <text x="56" y="290" font-size="9" fill="#9fb1c0">→ restaurar perfusão</text>

  <rect x="270" y="214" width="140" height="84" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="340" y="236" text-anchor="middle" font-size="11" fill="#f0c078" font-weight="bold">INTRÍNSECA</text>
  <text x="286" y="256" font-size="9" fill="#cdd9e3">FE_Na&gt;2 · iso</text>
  <text x="286" y="272" font-size="9" fill="#cdd9e3">NTA: muddy brown</text>
  <text x="286" y="288" font-size="9" fill="#cdd9e3">GN/NIA: cilindros próprios</text>

  <rect x="420" y="214" width="220" height="84" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="530" y="236" text-anchor="middle" font-size="11" fill="#e08a96" font-weight="bold">PÓS-RENAL</text>
  <text x="436" y="256" font-size="9" fill="#cdd9e3">obstrução (US: dilatação)</text>
  <text x="436" y="272" font-size="9" fill="#cdd9e3">índices variáveis</text>
  <text x="436" y="290" font-size="9" fill="#9fb1c0">→ desobstruir</text>
</svg>

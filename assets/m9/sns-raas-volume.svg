<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8a13a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">RAAS e simpático — os retentores de Na quando o VCE cai</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">VCE baixo dispara uma cascata que reabsorve Na em vários segmentos</text>

  <rect x="40" y="64" width="160" height="40" rx="6" fill="#7a2330" fill-opacity="0.4" stroke="#e0556b"/>
  <text x="120" y="89" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">VCE ↓</text>

  <g font-size="11" fill="#e7eef4">
    <line x1="200" y1="84" x2="250" y2="84" stroke="#e8a13a" stroke-width="2" marker-end="url(#r)"/>
    <rect x="250" y="66" width="390" height="38" rx="6" fill="#10202c" stroke="#e8a13a"/><text x="266" y="89">renina → Ang II → vasoconstrição + reabsorção proximal de Na</text>
    <rect x="250" y="112" width="390" height="38" rx="6" fill="#10202c" stroke="#e8a13a"/><text x="266" y="135">Ang II → aldosterona → ENaC no ducto (Na in, K out, M8)</text>
    <rect x="250" y="158" width="390" height="38" rx="6" fill="#10202c" stroke="#3a7bd5"/><text x="266" y="181">simpático → constrição renal + renina + reabsorção de Na</text>
    <rect x="250" y="204" width="390" height="38" rx="6" fill="#10202c" stroke="#39c0c8"/><text x="266" y="227">ADH (override de volume) → retém água (pode dar hiponatremia, M10)</text>
  </g>
  <text x="120" y="180" text-anchor="middle" font-size="10" fill="#9fb1c0">resultado: FENa baixa</text>
  <text x="120" y="196" text-anchor="middle" font-size="10" fill="#9fb1c0">(urina pobre em Na)</text>
  <text x="120" y="230" text-anchor="middle" font-size="9" fill="#e8a13a">é o que o IECA/BRA/ARM bloqueiam</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,Segoe UI,Arial">
  <rect width="480" height="300" fill="#0a1016"/>
  <text x="240" y="24" fill="#39c0c8" font-size="15" font-weight="bold" text-anchor="middle">UF rate = volume ÷ tempo</text>
  <text x="240" y="44" fill="#9fb1c0" font-size="11" text-anchor="middle">tirar os MESMOS 5 L de sobrecarga</text>
  <!-- refilling ceiling -->
  <line x1="40" y1="120" x2="445" y2="120" stroke="#e0556b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="445" y="114" fill="#e0556b" font-size="10" text-anchor="end">refilling ≈ 400 mL/h (teto)</text>
  <!-- HDI tall bar exceeds ceiling -->
  <rect x="90" y="80" width="70" height="160" fill="#e0556b" fill-opacity="0.45" stroke="#e0556b" stroke-width="1.5"/>
  <text x="125" y="256" fill="#9fb1c0" font-size="10" text-anchor="middle">HDI 4 h</text>
  <text x="125" y="74" fill="#e0556b" font-size="11" text-anchor="middle" font-weight="bold">1250 mL/h</text>
  <text x="125" y="160" fill="#e7eef4" font-size="9" text-anchor="middle">UF &gt; refilling</text>
  <text x="125" y="174" fill="#e7eef4" font-size="9" text-anchor="middle">→ hipotensão</text>
  <!-- SLED short bar under ceiling -->
  <rect x="320" y="180" width="70" height="60" fill="#52c08a" fill-opacity="0.5" stroke="#52c08a" stroke-width="1.5"/>
  <text x="355" y="256" fill="#9fb1c0" font-size="10" text-anchor="middle">SLED 14 h</text>
  <text x="355" y="172" fill="#52c08a" font-size="11" text-anchor="middle" font-weight="bold">357 mL/h</text>
  <text x="355" y="212" fill="#e7eef4" font-size="9" text-anchor="middle">UF &lt; refilling</text>
  <text x="355" y="226" fill="#e7eef4" font-size="9" text-anchor="middle">→ tolerada</text>
</svg>

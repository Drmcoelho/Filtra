<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A curva dose-resposta é fisiologia — não tabela</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">bloqueio do transportador = Emax·dose/(EC50+dose); sigmoide com LIMIAR e TETO</text>

  <line x1="70" y1="250" x2="640" y2="250" stroke="#3a4a58"/>
  <line x1="70" y1="64" x2="70" y2="250" stroke="#3a4a58"/>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="#9fb1c0">dose (mg, escala log) →</text>
  <text x="30" y="160" font-size="11" fill="#9fb1c0" transform="rotate(-90 30 160)">natriurese (FENa)</text>

  <!-- sigmoide -->
  <path d="M80,242 C180,238 240,232 300,180 C340,140 380,100 440,88 C520,80 580,78 630,77" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <line x1="70" y1="82" x2="640" y2="82" stroke="#52c08a" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  <text x="560" y="76" font-size="10" fill="#9fe3ec">teto (Emax)</text>
  <line x1="300" y1="64" x2="300" y2="250" stroke="#e8a13a" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <text x="306" y="200" font-size="10" fill="#f0c078">EC50 (½ do efeito)</text>
  <text x="120" y="232" font-size="10" fill="#9fb1c0">limiar: abaixo dele, nada sai</text>

  <text x="340" y="296" text-anchor="middle" font-size="9" fill="#e8a13a">dobrar a dose ABAIXO do limiar não faz nada; ACIMA do teto também não — ajustar é mover na curva certa</text>
</svg>

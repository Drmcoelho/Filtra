<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">VITAMINA D — o rim é a usina final</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a 1-α-hidroxilase do túbulo proximal ativa a forma que conta</text>

  <!-- pele/fígado -->
  <rect x="30" y="86" width="150" height="56" rx="8" fill="#1b242d" stroke="#3a4a58"/>
  <text x="105" y="106" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e7eef4">pele + fígado</text>
  <text x="105" y="124" text-anchor="middle" font-size="9.5" fill="#9fb1c0">25(OH)D (calcidiol)</text>
  <text x="105" y="137" text-anchor="middle" font-size="9" fill="#9fb1c0">forma de estoque</text>

  <line x1="180" y1="114" x2="262" y2="114" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="76" width="60" height="22" rx="6" fill="#2a210f" stroke="#e8a13a"/>
  <text x="230" y="91" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e8a13a">1-α-OHase</text>
  <text x="221" y="142" text-anchor="middle" font-size="8.5" fill="#e8a13a">no rim (TCP)</text>

  <!-- calcitriol -->
  <rect x="264" y="86" width="150" height="56" rx="8" fill="#19303a" stroke="#52c08a" stroke-width="2"/>
  <text x="339" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#52c08a">1,25(OH)₂D</text>
  <text x="339" y="123" text-anchor="middle" font-size="9.5" fill="#cfdbe6">CALCITRIOL (ativo)</text>
  <text x="339" y="136" text-anchor="middle" font-size="9" fill="#9fb1c0">o hormônio que age</text>

  <line x1="414" y1="114" x2="486" y2="114" stroke="#52c08a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="488" y="86" width="124" height="56" rx="8" fill="#141b22" stroke="#52c08a"/>
  <text x="550" y="106" text-anchor="middle" font-size="10.5" font-weight="700" fill="#52c08a">intestino</text>
  <text x="550" y="124" text-anchor="middle" font-size="9.5" fill="#cfdbe6">absorve Ca²⁺</text>
  <text x="550" y="137" text-anchor="middle" font-size="9" fill="#9fb1c0">(e fosfato)</text>

  <!-- PTH estimula -->
  <text x="230" y="178" text-anchor="middle" font-size="10" fill="#9fb1c0">PTH estimula a 1-α-hidroxilase ↑</text>

  <!-- DRC-DMO -->
  <rect x="40" y="200" width="560" height="130" rx="8" fill="#1d1116" stroke="#e0556b"/>
  <text x="320" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e0556b">PÉROLA — DRC-DMO: o ciclo do hiperPTH secundário</text>
  <g font-size="10.5" fill="#cfdbe6">
    <text x="60" y="248">① rim doente → menos 1-α-hidroxilase → <tspan fill="#52c08a">calcitriol ↓</tspan></text>
    <text x="60" y="270">② menos absorção intestinal de Ca²⁺ → <tspan fill="#e8a13a">cálcio sérico ↓</tspan></text>
    <text x="60" y="292">③ a paratireoide sente a hipocalcemia → <tspan fill="#e0556b">PTH ↑↑ (hiperPTH 2ário)</tspan></text>
    <text x="60" y="314">④ PTH tenta corrigir, mas o rim não consegue ativar a vit D → ciclo persiste (doença óssea)</text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e8a13a"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52c08a"/></marker>
  </defs>
</svg>

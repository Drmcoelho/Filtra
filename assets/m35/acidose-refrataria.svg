<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui,Segoe UI,sans-serif">
  <rect width="640" height="320" fill="#0f161d"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#e7eef4">A — Acidose metabólica grave REFRATÁRIA</text>
  <!-- eixo pH -->
  <line x1="70" y1="250" x2="570" y2="250" stroke="#3a4a58"/>
  <text x="320" y="285" text-anchor="middle" font-size="11" fill="#9fb1c0">pH arterial</text>
  <g font-size="11" fill="#9fb1c0" text-anchor="middle">
    <text x="120" y="270">6,9</text><text x="245" y="270">7,15</text><text x="400" y="270">7,30</text><text x="540" y="270">7,40</text>
  </g>
  <!-- zona grave -->
  <rect x="70" y="60" width="175" height="190" fill="#e0556b" opacity="0.14"/>
  <text x="157" y="80" text-anchor="middle" font-size="12" fill="#e0556b" font-weight="bold">zona grave</text>
  <line x1="245" y1="60" x2="245" y2="250" stroke="#e0556b" stroke-dasharray="4 3"/>
  <text x="245" y="52" text-anchor="middle" font-size="10" fill="#e0556b">limiar pH 7,15</text>
  <!-- curva severidade -->
  <path d="M120 90 Q200 130 245 175 Q330 230 540 245" fill="none" stroke="#39c0c8" stroke-width="2.5"/>
  <text x="470" y="200" font-size="11" fill="#39c0c8">severidade ↓ com pH ↑</text>
  <!-- refratário vs respondeu -->
  <circle cx="157" cy="110" r="7" fill="#e0556b"/><text x="172" y="114" font-size="11" fill="#e7eef4">refratário ao bicarbonato → DISPARA</text>
  <circle cx="157" cy="160" r="7" fill="#52c08a"/><text x="172" y="164" font-size="11" fill="#9fb1c0">se respondeu ao tampão/clínica → severidade cai</text>
  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#9fb1c0">o que indica é a acidose que NÃO cede ao bicarbonato/ventilação — não o número isolado</text>
</svg>

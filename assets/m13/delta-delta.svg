<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Delta-delta — desmascara o distúrbio MISTO</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">Δ-Δ = (AG − 12) / (24 − HCO₃): na HAGMA pura, o que sobe o AG deveria derrubar o HCO₃ na mesma medida</text>

  <rect x="40" y="68" width="195" height="180" rx="10" fill="#10202c" stroke="#3a7bd5"/>
  <text x="137" y="92" text-anchor="middle" font-size="13" fill="#9bbef0" font-weight="bold">&lt; 1</text>
  <text x="137" y="116" text-anchor="middle" font-size="11" fill="#e7eef4">HCO₃ caiu MAIS</text>
  <text x="137" y="136" text-anchor="middle" font-size="11" fill="#e7eef4">que o AG subiu</text>
  <text x="137" y="166" text-anchor="middle" font-size="11" fill="#cdd9e3">→ há TAMBÉM uma</text>
  <text x="137" y="184" text-anchor="middle" font-size="11" fill="#cdd9e3">acidose de AG normal</text>
  <text x="137" y="214" text-anchor="middle" font-size="9" fill="#9fb1c0">(ex.: HAGMA + diarreia)</text>

  <rect x="243" y="68" width="195" height="180" rx="10" fill="#0c2a30" stroke="#52c08a"/>
  <text x="340" y="92" text-anchor="middle" font-size="13" fill="#9fe3ec" font-weight="bold">1 – 2</text>
  <text x="340" y="120" text-anchor="middle" font-size="11" fill="#e7eef4">subiu o AG ≈ caiu</text>
  <text x="340" y="138" text-anchor="middle" font-size="11" fill="#e7eef4">o HCO₃</text>
  <text x="340" y="170" text-anchor="middle" font-size="11" fill="#cdd9e3">→ acidose de AG alto</text>
  <text x="340" y="188" text-anchor="middle" font-size="11" fill="#cdd9e3">PURA</text>
  <text x="340" y="214" text-anchor="middle" font-size="9" fill="#9fb1c0">(ex.: cetoacidose simples)</text>

  <rect x="446" y="68" width="195" height="180" rx="10" fill="#10202c" stroke="#e8a13a"/>
  <text x="543" y="92" text-anchor="middle" font-size="13" fill="#f0c078" font-weight="bold">&gt; 2</text>
  <text x="543" y="116" text-anchor="middle" font-size="11" fill="#e7eef4">AG subiu muito,</text>
  <text x="543" y="136" text-anchor="middle" font-size="11" fill="#e7eef4">HCO₃ "preservado"</text>
  <text x="543" y="166" text-anchor="middle" font-size="11" fill="#cdd9e3">→ há TAMBÉM uma</text>
  <text x="543" y="184" text-anchor="middle" font-size="11" fill="#cdd9e3">alcalose metabólica</text>
  <text x="543" y="214" text-anchor="middle" font-size="9" fill="#9fb1c0">(ex.: HAGMA + vômitos)</text>

  <text x="340" y="278" text-anchor="middle" font-size="10" fill="#e8a13a">só faz sentido na acidose de AG alto — é o que o engine calcula e classifica</text>
</svg>

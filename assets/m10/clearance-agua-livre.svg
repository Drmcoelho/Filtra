<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">Clearance de ÁGUA LIVRE — C_H₂O = V̇ − C_osm</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o rim separa a urina em "água com osmoles" (C_osm) e ÁGUA pura (C_H₂O)</text>

  <!-- fórmula -->
  <rect x="180" y="58" width="280" height="34" rx="8" fill="#101d22" stroke="#283642"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" fill="#e7eef4">V̇ (fluxo) = C_osm + C_H₂O</text>

  <!-- lado SEM ADH: dilui, excreta água -->
  <rect x="34" y="104" width="278" height="206" rx="10" fill="#102a2c" stroke="#39c0c8" stroke-width="2"/>
  <text x="173" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#39c0c8">① SEM ADH → urina DILUÍDA</text>
  <text x="173" y="146" text-anchor="middle" font-size="10" fill="#cfdbe6">Uosm baixa (&lt;250) · aquaporina-2 fechada</text>
  <rect x="78" y="160" width="190" height="58" rx="6" fill="#0a1016" stroke="#39c0c8"/>
  <rect x="78" y="160" width="46" height="58" fill="#39c0c8" fill-opacity="0.5"/>
  <text x="101" y="244" text-anchor="middle" font-size="9" fill="#9fb1c0">C_osm</text>
  <text x="196" y="244" text-anchor="middle" font-size="9" fill="#52c08a">C_H₂O &gt; 0 (água pura)</text>
  <text x="173" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#52c08a">EXCRETA água livre → Na sobe</text>
  <text x="173" y="292" text-anchor="middle" font-size="10" fill="#cfdbe6">defende contra a hiponatremia</text>

  <!-- lado COM ADH: concentra, retém água -->
  <rect x="328" y="104" width="278" height="206" rx="10" fill="#1a1410" stroke="#e8a13a" stroke-width="2"/>
  <text x="467" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#e8a13a">② COM ADH → urina CONCENTRADA</text>
  <text x="467" y="146" text-anchor="middle" font-size="10" fill="#cfdbe6">Uosm alta (&gt;600) · aquaporina-2 aberta</text>
  <rect x="372" y="160" width="190" height="58" rx="6" fill="#0a1016" stroke="#e8a13a"/>
  <rect x="372" y="160" width="150" height="58" fill="#e8a13a" fill-opacity="0.5"/>
  <text x="447" y="244" text-anchor="middle" font-size="9" fill="#9fb1c0">C_osm (quase tudo)</text>
  <text x="467" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#e0556b">RETÉM água (C_H₂O &lt; 0) → Na cai</text>
  <text x="467" y="292" text-anchor="middle" font-size="10" fill="#cfdbe6">reabsorve água de volta para o sangue</text>

  <text x="320" y="334" text-anchor="middle" font-size="11" fill="#52c08a">a barra azul = ÁGUA livre; o ADH decide se ela sai (Na↑) ou volta (Na↓)</text>
  <text x="320" y="354" text-anchor="middle" font-size="9" fill="#5b6b78">FILTRA · M10 — C_H₂O é a alavanca renal da natremia</text>
</svg>

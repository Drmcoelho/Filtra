<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Cristais urinários — a forma denuncia a composição</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">úteis em cálculos, intoxicações e fármacos; o pH urinário favorece uns ou outros</text>

  <g font-size="10" text-anchor="middle">
    <!-- oxalato (envelope) -->
    <rect x="36" y="64" width="150" height="150" rx="8" fill="#0a1016" stroke="#283642"/>
    <rect x="86" y="104" width="50" height="50" fill="none" stroke="#9fe3ec" stroke-width="2"/>
    <line x1="86" y1="104" x2="136" y2="154" stroke="#9fe3ec"/><line x1="136" y1="104" x2="86" y2="154" stroke="#9fe3ec"/>
    <text x="111" y="184" fill="#9fe3ec" font-weight="bold">Oxalato de Ca</text>
    <text x="111" y="202" fill="#9fb1c0">"envelope" · etilenoglicol!</text>

    <!-- ácido úrico (losango) -->
    <rect x="196" y="64" width="150" height="150" rx="8" fill="#0a1016" stroke="#283642"/>
    <polygon points="271,100 301,129 271,158 241,129" fill="none" stroke="#e8a13a" stroke-width="2"/>
    <text x="271" y="184" fill="#f0c078" font-weight="bold">Ácido úrico</text>
    <text x="271" y="202" fill="#9fb1c0">losango · urina ácida · gota/lise</text>

    <!-- estruvita (caixão) -->
    <rect x="356" y="64" width="150" height="150" rx="8" fill="#0a1016" stroke="#283642"/>
    <rect x="406" y="104" width="50" height="40" fill="none" stroke="#3a7bd5" stroke-width="2"/>
    <line x1="406" y1="104" x2="431" y2="92" stroke="#3a7bd5"/><line x1="456" y1="104" x2="431" y2="92" stroke="#3a7bd5"/>
    <text x="431" y="184" fill="#9bbef0" font-weight="bold">Estruvita</text>
    <text x="431" y="202" fill="#9fb1c0">"tampa de caixão" · urina alcalina/infecção</text>

    <!-- cistina (hexágono) -->
    <rect x="516" y="64" width="150" height="150" rx="8" fill="#0a1016" stroke="#283642"/>
    <polygon points="591,100 614,113 614,139 591,152 568,139 568,113" fill="none" stroke="#e0556b" stroke-width="2"/>
    <text x="591" y="184" fill="#e08a96" font-weight="bold">Cistina</text>
    <text x="591" y="202" fill="#9fb1c0">hexágono · cistinúria (genética)</text>
  </g>
  <text x="340" y="248" text-anchor="middle" font-size="11" fill="#e8a13a">cristais de oxalato + acidose de AG alto + gap osmolar = intoxicação por etilenoglicol (ponte M13/M33)</text>
  <text x="340" y="272" text-anchor="middle" font-size="9" fill="#9fb1c0">fármacos também cristalizam (aciclovir, sulfas, metotrexato) → lesão tubular obstrutiva</text>
</svg>

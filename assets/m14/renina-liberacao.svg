<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">Os 3 estímulos para liberar RENINA</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a célula justaglomerular (JG) sente pressão, NaCl e simpático</text>

  <circle cx="320" cy="200" r="56" fill="#102a2c" stroke="#39c0c8" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#39c0c8">célula JG</text>
  <text x="320" y="212" text-anchor="middle" font-size="10" fill="#9fb1c0">grânulos de</text>
  <text x="320" y="226" text-anchor="middle" font-size="10" fill="#9fb1c0">renina</text>
  <circle cx="304" cy="190" r="4" fill="#39c0c8"/><circle cx="332" cy="186" r="4" fill="#39c0c8"/>
  <circle cx="318" cy="210" r="4" fill="#39c0c8"/><circle cx="336" cy="206" r="4" fill="#39c0c8"/>

  <rect x="34" y="96" width="190" height="62" rx="8" fill="#141b22" stroke="#e8a13a"/>
  <text x="46" y="118" font-size="12" font-weight="700" fill="#e8a13a">① barorreceptor renal</text>
  <text x="46" y="136" font-size="10.5" fill="#cfdbe6">↓ pressão de perfusão na aferente</text>
  <text x="46" y="151" font-size="10.5" fill="#cfdbe6">→ menos estiramento → +renina</text>
  <line x1="224" y1="140" x2="276" y2="178" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="416" y="96" width="200" height="62" rx="8" fill="#141b22" stroke="#52c08a"/>
  <text x="428" y="118" font-size="12" font-weight="700" fill="#52c08a">② mácula densa</text>
  <text x="428" y="136" font-size="10.5" fill="#cfdbe6">↓ NaCl no túbulo distal</text>
  <text x="428" y="151" font-size="10.5" fill="#cfdbe6">→ sinaliza hipovolemia → +renina</text>
  <line x1="416" y1="140" x2="364" y2="178" stroke="#52c08a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="216" y="288" width="208" height="56" rx="8" fill="#141b22" stroke="#e0556b"/>
  <text x="228" y="310" font-size="12" font-weight="700" fill="#e0556b">③ tônus simpático (β1)</text>
  <text x="228" y="328" font-size="10.5" fill="#cfdbe6">estresse/hipotensão → β1 na JG → +renina</text>
  <line x1="320" y1="288" x2="320" y2="258" stroke="#e0556b" stroke-width="2" marker-end="url(#a)"/>

  <line x1="376" y1="200" x2="470" y2="200" stroke="#39c0c8" stroke-width="2" marker-end="url(#ac)"/>
  <text x="500" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#39c0c8">RENINA ↑</text>
  <text x="500" y="214" text-anchor="middle" font-size="9.5" fill="#9fb1c0">inicia a cascata</text>

  <text x="320" y="356" text-anchor="middle" font-size="9" fill="#5b6b78">FILTRA · M14 — qualquer sinal de "pouco volume efetivo" sobe a renina</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9fb1c0"/></marker>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#39c0c8"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A P_GC é um divisor de pressão entre duas resistências</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">como num circuito em série: a pressão no meio sobe com R_E e cai com R_A</text>

  <!-- linha do circuito -->
  <line x1="60" y1="150" x2="620" y2="150" stroke="#3a4a58" stroke-width="2"/>
  <!-- fonte PAM -->
  <circle cx="60" cy="150" r="10" fill="#e0556b"/><text x="60" y="124" text-anchor="middle" font-size="11" fill="#e08a96">PAM</text>
  <!-- R_A -->
  <rect x="150" y="135" width="90" height="30" rx="4" fill="#10202c" stroke="#e0556b"/><text x="195" y="155" text-anchor="middle" font-size="12" fill="#e08a96">R_A (aferente)</text>
  <!-- nó P_GC -->
  <circle cx="340" cy="150" r="14" fill="#0f3540" stroke="#39c0c8" stroke-width="2"/>
  <text x="340" y="120" text-anchor="middle" font-size="13" fill="#9fe3ec" font-weight="bold">P_GC</text>
  <line x1="340" y1="136" x2="340" y2="126" stroke="#39c0c8"/>
  <!-- R_E -->
  <rect x="440" y="135" width="90" height="30" rx="4" fill="#10202c" stroke="#3a7bd5"/><text x="485" y="155" text-anchor="middle" font-size="12" fill="#9bbef0">R_E (eferente)</text>
  <!-- saída -->
  <circle cx="620" cy="150" r="9" fill="#3a7bd5"/><text x="620" y="124" text-anchor="middle" font-size="10" fill="#9bbef0">P_venosa</text>

  <!-- equação -->
  <rect x="120" y="196" width="440" height="32" rx="6" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="217" text-anchor="middle" font-size="13" fill="#e7eef4">P_GC = (PAM·R_E + P_v·R_A) / (R_A + R_E)</text>

  <text x="195" y="256" text-anchor="middle" font-size="10" fill="#e08a96">fechar R_A → P_GC ↓ (e fluxo↓)</text>
  <text x="485" y="256" text-anchor="middle" font-size="10" fill="#9bbef0">fechar R_E → P_GC ↑ (fluxo↓, FF↑)</text>
  <text x="340" y="280" text-anchor="middle" font-size="10" fill="#9fb1c0">o AINE mexe em R_A; o IECA/BRA mexe em R_E</text>
</svg>

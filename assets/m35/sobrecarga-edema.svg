<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui,Segoe UI,sans-serif">
  <rect width="640" height="320" fill="#0f161d"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#e7eef4">O — Sobrecarga REFRATÁRIA ao diurético → edema pulmonar</text>
  <!-- pulmão esquema -->
  <g transform="translate(70,60)">
    <path d="M60 10 C20 10 10 60 12 130 C14 175 60 175 70 150 L70 20 C70 12 66 10 60 10 Z" fill="#1b242d" stroke="#e0556b"/>
    <path d="M150 10 C190 10 200 60 198 130 C196 175 150 175 140 150 L140 20 C140 12 144 10 150 10 Z" fill="#1b242d" stroke="#e0556b"/>
    <!-- líquido -->
    <g fill="#39c0c8" opacity="0.6"><circle cx="45" cy="120" r="6"/><circle cx="60" cy="135" r="5"/><circle cx="160" cy="120" r="6"/><circle cx="150" cy="138" r="5"/><circle cx="105" cy="150" r="6"/></g>
    <text x="105" y="200" text-anchor="middle" font-size="11" fill="#e0556b">congestão alveolar (edema)</text>
  </g>
  <!-- fluxo diurético -->
  <g transform="translate(360,80)">
    <text x="0" y="0" font-size="12" fill="#e7eef4" font-weight="bold">furosemida em dose alta</text>
    <path d="M0 14 H160" stroke="#52c08a" stroke-width="2"/>
    <text x="0" y="46" font-size="11" fill="#52c08a">↑ diurese → volume cai → não indica TRS</text>
    <text x="0" y="90" font-size="12" fill="#e7eef4" font-weight="bold">sem resposta (anúria / refratário)</text>
    <path d="M0 104 H120" stroke="#e0556b" stroke-width="2"/>
    <line x1="123" y1="94" x2="133" y2="114" stroke="#e0556b" stroke-width="2.5"/><line x1="133" y1="94" x2="123" y2="114" stroke="#e0556b" stroke-width="2.5"/>
    <text x="0" y="138" font-size="11" fill="#e0556b">volume não sai → ULTRAFILTRAÇÃO mecânica</text>
    <text x="0" y="160" font-size="11" fill="#e8a13a">O dispara: a UF tira o volume que o rim não tira</text>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="11" fill="#9fb1c0">o gatilho é a refratariedade — o mesmo +9 L responde OU não responde ao diurético</text>
</svg>

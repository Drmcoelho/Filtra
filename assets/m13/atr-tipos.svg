<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">As acidoses tubulares renais (ATR) — por segmento e por K⁺</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">todas dão acidose de AG NORMAL (hiperclorêmica); diferem no defeito e no potássio</text>

  <!-- cabeçalho de tabela -->
  <g font-size="11">
    <rect x="24" y="60" width="632" height="28" fill="#10202c" stroke="#283642"/>
    <text x="40" y="79" fill="#9fb1c0">Tipo</text><text x="150" y="79" fill="#9fb1c0">Defeito</text>
    <text x="380" y="79" fill="#9fb1c0">pH urinário</text><text x="510" y="79" fill="#9fb1c0">Potássio</text>

    <rect x="24" y="88" width="632" height="58" fill="#0c2330" stroke="#39c0c8"/>
    <text x="40" y="112" fill="#9fe3ec" font-weight="bold">II (proximal)</text>
    <text x="150" y="108" fill="#e7eef4">não reabsorve HCO₃⁻ (TCP)</text>
    <text x="150" y="128" fill="#9fb1c0" font-size="9">perde HCO₃ até cair o limiar; Fanconi</text>
    <text x="380" y="112" fill="#e7eef4">variável (&lt;5,5 já baixo)</text>
    <text x="510" y="112" fill="#9bbef0">baixo (hipoK)</text>

    <rect x="24" y="146" width="632" height="58" fill="#10202c" stroke="#e8a13a"/>
    <text x="40" y="170" fill="#f0c078" font-weight="bold">I (distal)</text>
    <text x="150" y="166" fill="#e7eef4">não secreta H⁺ (distal)</text>
    <text x="150" y="186" fill="#9fb1c0" font-size="9">cálculos, nefrocalcinose</text>
    <text x="380" y="170" fill="#e7eef4">ALTO (&gt; 5,5)</text>
    <text x="510" y="170" fill="#9bbef0">baixo (hipoK)</text>

    <rect x="24" y="204" width="632" height="58" fill="#10202c" stroke="#e0556b"/>
    <text x="40" y="228" fill="#e08a96" font-weight="bold">IV (hipoaldo)</text>
    <text x="150" y="224" fill="#e7eef4">hipoaldosteronismo / resistência</text>
    <text x="150" y="244" fill="#9fb1c0" font-size="9">DM, IECA/ARM; ↓amoniogênese</text>
    <text x="380" y="228" fill="#e7eef4">baixo (&lt; 5,5)</text>
    <text x="510" y="228" fill="#e08a96">ALTO (hiperK)</text>
  </g>
  <text x="340" y="284" text-anchor="middle" font-size="11" fill="#e8a13a">a regra rápida: o K⁺ separa — tipos I e II com hipoK; tipo IV com hiperK</text>
  <text x="340" y="304" text-anchor="middle" font-size="9" fill="#9fb1c0">o gap urinário (Na+K−Cl) negativo = NH₄⁺ presente (extrarrenal); positivo = defeito renal de H⁺</text>
</svg>

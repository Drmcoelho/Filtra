<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Georgia, serif">
  <rect width="640" height="400" fill="#fafaf8"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Autorregulação da TFG</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#555">TFG permanece estável entre PAM 80–180 mmHg</text>

  <!-- Eixos -->
  <line x1="80" y1="310" x2="580" y2="310" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="315" stroke="#333" stroke-width="2"/>

  <!-- Labels eixos -->
  <text x="330" y="345" text-anchor="middle" font-size="13" fill="#333">Pressão Arterial Média (mmHg)</text>
  <text x="30" y="190" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90,30,190)">TFG (mL/min)</text>

  <!-- Tick marks X -->
  <line x1="140" y1="310" x2="140" y2="318" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="330" text-anchor="middle" font-size="11" fill="#333">40</text>
  <line x1="220" y1="310" x2="220" y2="318" stroke="#333" stroke-width="1.5"/>
  <text x="220" y="330" text-anchor="middle" font-size="11" fill="#333">80</text>
  <line x1="340" y1="310" x2="340" y2="318" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="330" text-anchor="middle" font-size="11" fill="#333">120</text>
  <line x1="460" y1="310" x2="460" y2="318" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="330" text-anchor="middle" font-size="11" fill="#333">160</text>
  <line x1="540" y1="310" x2="540" y2="318" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="330" text-anchor="middle" font-size="11" fill="#333">200</text>

  <!-- Tick marks Y -->
  <line x1="80" y1="250" x2="72" y2="250" stroke="#333" stroke-width="1.5"/>
  <text x="68" y="254" text-anchor="end" font-size="11" fill="#333">50</text>
  <line x1="80" y1="160" x2="72" y2="160" stroke="#333" stroke-width="1.5"/>
  <text x="68" y="164" text-anchor="end" font-size="11" fill="#333">100</text>
  <line x1="80" y1="100" x2="72" y2="100" stroke="#333" stroke-width="1.5"/>
  <text x="68" y="104" text-anchor="end" font-size="11" fill="#333">130</text>

  <!-- Curva de autorregulação: sobe ~pré-renal, plato, sobe de novo -->
  <!-- Zona pré-renal (PAM < 80): sobe acentuado -->
  <polyline points="80,310 140,300 220,165" fill="none" stroke="#cc2200" stroke-width="3"/>
  <!-- Zona de autorregulação (PAM 80-180): plato quase horizontal -->
  <polyline points="220,165 340,158 460,162" fill="none" stroke="#2a7a2a" stroke-width="3.5"/>
  <!-- Zona pós-autorregulação (PAM > 180): sobe novamente -->
  <polyline points="460,162 540,130" fill="none" stroke="#cc2200" stroke-width="3"/>

  <!-- Área de autorregulação sombreada -->
  <rect x="220" y="60" width="240" height="255" fill="#e8ffe8" opacity="0.35"/>

  <!-- Labels das zonas -->
  <text x="155" y="220" text-anchor="middle" font-size="11" fill="#cc2200" font-weight="bold">Zona</text>
  <text x="155" y="234" text-anchor="middle" font-size="11" fill="#cc2200" font-weight="bold">pré-renal</text>
  <text x="340" y="85" text-anchor="middle" font-size="12" fill="#2a7a2a" font-weight="bold">Autorregulação</text>
  <text x="340" y="99" text-anchor="middle" font-size="11" fill="#2a7a2a">PAM 80 – 180 mmHg</text>
  <text x="510" y="175" text-anchor="middle" font-size="11" fill="#cc2200" font-weight="bold">Limite</text>

  <!-- Linha de referência TFG normal -->
  <line x1="80" y1="160" x2="580" y2="160" stroke="#aaa" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="582" y="163" font-size="10" fill="#aaa">TFG normal</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O ENaC dirige a secreção de K⁺ — a balança Na↔K</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">reabsorver Na pelo ENaC deixa a luz negativa, o que "puxa" o K⁺ para fora (ROMK)</text>

  <!-- gangorra -->
  <line x1="160" y1="180" x2="520" y2="120" stroke="#3a4a58" stroke-width="4"/>
  <polygon points="340,200 320,240 360,240" fill="#3a4a58"/>
  <circle cx="180" cy="174" r="22" fill="#39c0c8" fill-opacity="0.6" stroke="#39c0c8"/><text x="180" y="178" text-anchor="middle" font-size="11" fill="#06121a" font-weight="bold">Na⁺ in</text>
  <circle cx="500" cy="126" r="22" fill="#e8a13a" fill-opacity="0.6" stroke="#e8a13a"/><text x="500" y="130" text-anchor="middle" font-size="11" fill="#06121a" font-weight="bold">K⁺ out</text>

  <text x="120" y="270" font-size="11" fill="#9fe3ec">+ aldosterona / + fluxo distal → +Na in → +K out (hipocalemia)</text>
  <text x="120" y="290" font-size="11" fill="#f0c078">bloquear o ENaC → −Na in → −K out (poupa K, hipercalemia)</text>
  <text x="340" y="76" text-anchor="middle" font-size="10" fill="#9fb1c0">é por isso que diuréticos que aumentam o fluxo distal (alça, tiazídico) perdem K⁺</text>
</svg>

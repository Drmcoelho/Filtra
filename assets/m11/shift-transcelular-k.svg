<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs>
    <marker id="in" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52c08a"/></marker>
    <marker id="out" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0556b"/></marker>
  </defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O balanço INTERNO — o shift transcelular (minuto a minuto)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">move K⁺ entre dentro e fora SEM mudar o estoque total — a defesa rápida da caliemia</text>

  <line x1="340" y1="64" x2="340" y2="270" stroke="#5a6b78" stroke-width="3"/>
  <text x="200" y="84" text-anchor="middle" font-size="12" fill="#9fe3ec">DENTRO da célula</text>
  <text x="490" y="84" text-anchor="middle" font-size="12" fill="#e08a96">FORA (plasma)</text>

  <g font-size="11" fill="#e7eef4">
    <text x="60" y="120" fill="#52c08a" font-weight="bold">empurram K⁺ para DENTRO (↓ plasma):</text>
    <line x1="430" y1="135" x2="250" y2="135" stroke="#52c08a" stroke-width="2" marker-end="url(#in)"/>
    <text x="70" y="150">• insulina   • β-agonista   • alcalose</text>

    <text x="60" y="200" fill="#e0556b" font-weight="bold">empurram K⁺ para FORA (↑ plasma):</text>
    <line x1="250" y1="215" x2="430" y2="215" stroke="#e0556b" stroke-width="2" marker-end="url(#out)"/>
    <text x="70" y="230">• acidose   • lise celular / rabdomiólise   • déficit de insulina</text>
  </g>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="#e8a13a">é a alavanca de emergência: insulina/β baixam a caliemia em minutos — mas o K continua no corpo</text>
</svg>

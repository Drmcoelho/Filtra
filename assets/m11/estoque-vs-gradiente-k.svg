<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">98% do potássio é INTRACELULAR — o plasma é a ponta do iceberg</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o estoque total mora dentro da célula; a caliemia mede só o pouco que está fora</text>

  <rect x="40" y="64" width="380" height="200" rx="14" fill="#0c2a30" stroke="#39c0c8" stroke-width="2"/>
  <text x="230" y="92" text-anchor="middle" font-size="13" fill="#9fe3ec" font-weight="bold">Intracelular (ICF) — ~140 mEq/L</text>
  <text x="230" y="112" text-anchor="middle" font-size="11" fill="#cdd9e3">≈ 98% do K⁺ corporal (~3500 mEq)</text>
  <g fill="#43d4dc">
    <circle cx="90" cy="150" r="6"/><circle cx="130" cy="175" r="6"/><circle cx="170" cy="145" r="6"/><circle cx="210" cy="185" r="6"/>
    <circle cx="250" cy="150" r="6"/><circle cx="290" cy="180" r="6"/><circle cx="330" cy="150" r="6"/><circle cx="370" cy="180" r="6"/>
    <circle cx="110" cy="220" r="6"/><circle cx="180" cy="225" r="6"/><circle cx="260" cy="220" r="6"/><circle cx="330" cy="220" r="6"/></g>

  <rect x="440" y="64" width="200" height="200" rx="10" fill="#10202c" stroke="#e0556b"/>
  <text x="540" y="92" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">Extracelular (plasma)</text>
  <text x="540" y="112" text-anchor="middle" font-size="11" fill="#cdd9e3">~4 mEq/L (≈ 2%)</text>
  <circle cx="540" cy="160" r="6" fill="#e0556b"/><circle cx="510" cy="195" r="6" fill="#e0556b"/>
  <text x="540" y="235" text-anchor="middle" font-size="10" fill="#f0c078">é só ISTO que dosamos</text>
  <text x="540" y="252" text-anchor="middle" font-size="9" fill="#9fb1c0">e que mexe no coração</text>

  <text x="340" y="286" text-anchor="middle" font-size="11" fill="#e8a13a">o estoque pode estar depletado com caliemia normal — o shift mascara</text>
</svg>

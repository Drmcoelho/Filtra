<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O coeficiente de peneiramento (sieving, S)</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#9fb1c0">S = fração do soluto que acompanha a água: 1 = passa livre · 0 = rejeitado</text>

  <line x1="70" y1="60" x2="70" y2="250" stroke="#3a4a58"/>
  <line x1="70" y1="250" x2="640" y2="250" stroke="#3a4a58"/>
  <text x="355" y="276" text-anchor="middle" font-size="11" fill="#9fb1c0">tamanho molecular (MW) →</text>
  <text x="34" y="160" font-size="11" fill="#9fb1c0" transform="rotate(-90 34 160)">sieving S</text>
  <text x="56" y="74" font-size="9" fill="#9fb1c0" text-anchor="end">1</text>
  <text x="56" y="250" font-size="9" fill="#9fb1c0" text-anchor="end">0</text>

  <!-- S cai de 1 a 0 -->
  <path d="M80,72 C220,76 360,120 470,200 C520,236 560,248 600,249" fill="none" stroke="#39c0c8" stroke-width="3"/>

  <g font-size="9" fill="#9fb1c0" text-anchor="middle">
    <circle cx="100" cy="74" r="4" fill="#9fe3ec"/><text x="100" y="92">ureia (S≈1)</text>
    <circle cx="360" cy="120" r="6" fill="#e8a13a"/><text x="360" y="106">β2-micro (S~0,7)</text>
    <circle cx="600" cy="249" r="9" fill="#a06ad0"/><text x="585" y="238">albumina (S=0)</text>
  </g>
  <text x="340" y="294" text-anchor="middle" font-size="10" fill="#e8a13a">o sieving define o que a CONVECÇÃO consegue remover — e por que a albumina deve ser poupada</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0f1620" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <rect x="20" y="16" width="56" height="24" rx="4" fill="#39c0c8"/>
  <text x="48" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#05181a">M25</text>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#9fb1c0">V = volume de distribuição da ureia ≈ ÁGT (peso · 0,58)</text>
  <!-- small patient -->
  <ellipse cx="170" cy="170" rx="55" ry="95" fill="#39c0c8" fill-opacity="0.18" stroke="#39c0c8" stroke-width="2"/>
  <text x="170" y="175" text-anchor="middle" font-size="13" fill="#e7eef4">50 kg</text>
  <text x="170" y="195" text-anchor="middle" font-size="11" fill="#39c0c8">V ≈ 29 L</text>
  <text x="170" y="285" text-anchor="middle" font-size="11" fill="#9fb1c0">V pequeno</text>
  <!-- big patient -->
  <ellipse cx="470" cy="170" rx="85" ry="110" fill="#e8a13a" fill-opacity="0.18" stroke="#e8a13a" stroke-width="2"/>
  <text x="470" y="175" text-anchor="middle" font-size="13" fill="#e7eef4">110 kg</text>
  <text x="470" y="195" text-anchor="middle" font-size="11" fill="#e8a13a">V ≈ 64 L</text>
  <text x="470" y="290" text-anchor="middle" font-size="11" fill="#9fb1c0">V grande</text>
  <!-- arrow + lesson -->
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#9fb1c0">mesmo K · t</text>
  <line x1="245" y1="135" x2="380" y2="135" stroke="#e0556b" stroke-width="2"/>
  <polygon points="380,135 367,128 367,142" fill="#e0556b"/>
  <text x="320" y="155" text-anchor="middle" font-size="12" fill="#e0556b">Kt/V MENOR</text>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#9fb1c0">V grande dilui a dose:</text>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#9fb1c0">o paciente grande</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#9fb1c0">precisa de mais K ou t</text>
</svg>

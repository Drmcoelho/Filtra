<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0d1b16" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a7a4a" stroke-width="2"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#bfe9cf">Acúmulo de citrato — o fígado depura, o fígado ruim não</text>
  <!-- citrato chega -->
  <line x1="40" y1="120" x2="150" y2="120" stroke="#e8a13a" stroke-width="6"/>
  <text x="95" y="108" text-anchor="middle" font-size="11" fill="#e8a13a">citrato (mmol/h)</text>
  <!-- fígado bom -->
  <g>
    <path d="M170 90 q70 -20 110 10 q20 40 -20 60 q-60 20 -90 -10 z" fill="#15302a" stroke="#52c08a" stroke-width="2"/>
    <text x="225" y="130" text-anchor="middle" font-size="12" fill="#8fe0b0">fígado OK</text>
    <text x="225" y="180" text-anchor="middle" font-size="11" fill="#52c08a">metaboliza → HCO₃⁻ + Ca²⁺</text>
    <text x="225" y="198" text-anchor="middle" font-size="11" fill="#52c08a">gap normal</text>
  </g>
  <!-- fígado ruim -->
  <g>
    <path d="M400 90 q70 -20 110 10 q20 40 -20 60 q-60 20 -90 -10 z" fill="#2a1116" stroke="#e0556b" stroke-width="2"/>
    <text x="455" y="130" text-anchor="middle" font-size="12" fill="#f0c5cf">fígado RUIM</text>
    <text x="455" y="180" text-anchor="middle" font-size="11" fill="#e0556b">não depura → citrato ACUMULA</text>
    <text x="455" y="198" text-anchor="middle" font-size="11" fill="#e0556b">quela Ca²⁺ sistêmico → gap↑</text>
  </g>
  <text x="320" y="245" text-anchor="middle" font-size="13" fill="#f0b08a">choque, insuf. hepática, lactato alto → clearance de citrato cai</text>
  <text x="320" y="270" text-anchor="middle" font-size="13" fill="#e0556b">fígado ruim CONTRAINDICA o citrato</text>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="#6fae8a">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A curva FSR × PAM — o platô e o precipício</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a autorregulação aplaina o fluxo entre ~80 e ~180 mmHg; fora disso, o fluxo segue a pressão</text>

  <!-- eixos -->
  <line x1="70" y1="270" x2="640" y2="270" stroke="#3a4a58"/>
  <line x1="70" y1="70" x2="70" y2="270" stroke="#3a4a58"/>
  <text x="355" y="298" text-anchor="middle" font-size="11" fill="#9fb1c0">PAM (mmHg)</text>
  <text x="24" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 24 170)">FSR</text>
  <text x="70" y="286" text-anchor="middle" font-size="9" fill="#9fb1c0">0</text>
  <text x="250" y="286" text-anchor="middle" font-size="9" fill="#9fb1c0">80</text>
  <text x="470" y="286" text-anchor="middle" font-size="9" fill="#9fb1c0">180</text>

  <!-- zona de platô -->
  <rect x="250" y="70" width="220" height="200" fill="#39c0c8" fill-opacity="0.06"/>
  <text x="360" y="86" text-anchor="middle" font-size="10" fill="#39c0c8">autorregulação (platô)</text>

  <!-- curva normal -->
  <path d="M70,250 C150,250 210,140 250,135 L470,128 C520,126 580,110 640,96" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <text x="600" y="86" font-size="10" fill="#39c0c8">normal</text>

  <!-- curva deslocada (AINE/depleção): platô estreito, precipício mais à direita -->
  <path d="M70,258 C170,258 250,180 300,172 L470,160 C520,156 580,138 640,120" fill="none" stroke="#e8a13a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="590" y="112" font-size="10" fill="#e8a13a">AINE / depleção</text>

  <!-- precipício -->
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#e0556b">precipício</text>
  <text x="150" y="164" text-anchor="middle" font-size="10" fill="#e0556b">pré-renal</text>
  <line x1="250" y1="70" x2="250" y2="270" stroke="#3a4a58" stroke-dasharray="3 3"/>
  <line x1="470" y1="70" x2="470" y2="270" stroke="#3a4a58" stroke-dasharray="3 3"/>
  <text x="360" y="262" text-anchor="middle" font-size="9" fill="#9fb1c0">o AINE/depleção encolhe o platô e adianta o precipício</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,Segoe UI,Arial">
  <rect width="480" height="300" fill="#0a1016"/>
  <text x="240" y="24" fill="#39c0c8" font-size="15" font-weight="bold" text-anchor="middle">Fluxos baixos (Qb, Qd) da SLED</text>
  <!-- dialyzer schematic -->
  <rect x="170" y="70" width="140" height="160" rx="12" fill="#141b22" stroke="#39c0c8" stroke-width="2"/>
  <text x="240" y="155" fill="#9fb1c0" font-size="11" text-anchor="middle">dialisador</text>
  <!-- blood flow Qb (thin) -->
  <line x1="60" y1="100" x2="170" y2="100" stroke="#e0556b" stroke-width="3"/>
  <text x="90" y="92" fill="#e0556b" font-size="11">Qb ↓</text>
  <text x="60" y="124" fill="#9fb1c0" font-size="9">sangue ~200 mL/min</text>
  <line x1="310" y1="100" x2="420" y2="100" stroke="#e0556b" stroke-width="3"/>
  <!-- dialysate Qd (thin, counter) -->
  <line x1="420" y1="200" x2="310" y2="200" stroke="#39c0c8" stroke-width="3"/>
  <text x="350" y="192" fill="#39c0c8" font-size="11">Qd ↑</text>
  <text x="305" y="224" fill="#9fb1c0" font-size="9">dialisato ~300 mL/min</text>
  <line x1="170" y1="200" x2="60" y2="200" stroke="#39c0c8" stroke-width="3"/>
  <!-- gradient note -->
  <text x="240" y="258" fill="#e8a13a" font-size="11" text-anchor="middle">gradiente menor por hora → queda SUAVE de soluto</text>
  <text x="240" y="278" fill="#9fb1c0" font-size="10" text-anchor="middle">(na HDI, Qb ~350 / Qd ~600: gradiente abrupto)</text>
</svg>

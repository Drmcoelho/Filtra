<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A medula renal vive à beira da hipóxia</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">pouco fluxo + alto consumo (ramo espesso) → pO₂ baixa mesmo no normal</text>

  <!-- coluna córtex->medula -->
  <rect x="60" y="62" width="160" height="80"  fill="#1d4e74" stroke="#5aa0e0"/><text x="140" y="100" text-anchor="middle" font-size="13" fill="#dcebff" font-weight="bold">CÓRTEX</text><text x="140" y="120" text-anchor="middle" font-size="11" fill="#cfe0ff">88% do FSR · pO₂ &gt; 50 mmHg</text>
  <rect x="60" y="142" width="160" height="66"  fill="#143447" stroke="#3a7bd5"/><text x="140" y="170" text-anchor="middle" font-size="12" fill="#bfe0ff">medula externa</text><text x="140" y="190" text-anchor="middle" font-size="11" fill="#9fb1c0">pO₂ ~30 mmHg</text>
  <rect x="60" y="208" width="160" height="80"  fill="#0c2230" stroke="#e0556b"/><text x="140" y="240" text-anchor="middle" font-size="12" fill="#ffd0d6" font-weight="bold">medula interna</text><text x="140" y="260" text-anchor="middle" font-size="11" fill="#e08a96">12% do FSR · pO₂ ~15–20 mmHg</text>

  <!-- termômetro pO2 -->
  <text x="300" y="70" font-size="11" fill="#9fb1c0">pO₂</text>
  <rect x="300" y="78" width="22" height="210" rx="11" fill="#10202c" stroke="#3a4a58"/>
  <rect x="300" y="78" width="22" height="70" rx="11" fill="#5aa0e0"/>
  <rect x="300" y="218" width="22" height="70" fill="#e0556b"/>
  <text x="330" y="92"  font-size="10" fill="#cfe0ff">50</text>
  <text x="330" y="232" font-size="10" fill="#e08a96">20</text>
  <text x="330" y="284" font-size="10" fill="#e08a96">15</text>

  <!-- o consumidor: ramo espesso -->
  <rect x="380" y="96" width="270" height="150" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="515" y="120" text-anchor="middle" font-size="12" fill="#e7eef4" font-weight="bold">Quem consome o O₂ da medula</text>
  <text x="396" y="146" font-size="11" fill="#cdd9e3">• ramo espesso da alça (TAL):</text>
  <text x="412" y="164" font-size="11" fill="#9fe3ec">NKCC2 + Na⁺/K⁺-ATPase → ATP alto</text>
  <text x="396" y="190" font-size="11" fill="#cdd9e3">• a vasa recta faz shunt de O₂ (fig. própria)</text>
  <text x="396" y="216" font-size="11" fill="#e8a13a">⇒ qualquer queda de fluxo → hipóxia → NTA</text>
  <text x="396" y="234" font-size="10" fill="#9fb1c0">(o ponto cego onde AINEs e hipotensão batem)</text>
</svg>

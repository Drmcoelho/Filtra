<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52c08a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Amoniogênese — o tampão urinário que o rim AJUSTA</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a glutamina vira NH₄⁺ (excretado) + HCO₃⁻ NOVO (para o sangue); sobe na acidose</text>

  <rect x="40" y="70" width="150" height="56" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="115" y="94" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">glutamina</text>
  <text x="115" y="114" text-anchor="middle" font-size="9" fill="#9fb1c0">(no TCP)</text>
  <line x1="190" y1="98" x2="250" y2="98" stroke="#52c08a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="250" y="70" width="180" height="56" rx="8" fill="#0c2a30" stroke="#39c0c8"/>
  <text x="340" y="94" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">2 NH₄⁺ + 2 HCO₃⁻</text>
  <text x="340" y="114" text-anchor="middle" font-size="9" fill="#cdd9e3">por molécula metabolizada</text>

  <line x1="340" y1="126" x2="200" y2="170" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="60" y="172" width="280" height="44" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="200" y="194" text-anchor="middle" font-size="11" fill="#f0c078">NH₄⁺ → excretado na urina</text>
  <text x="200" y="210" text-anchor="middle" font-size="9" fill="#9fb1c0">carrega o H⁺ para fora</text>

  <line x1="340" y1="126" x2="490" y2="170" stroke="#52c08a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="350" y="172" width="280" height="44" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="490" y="194" text-anchor="middle" font-size="11" fill="#9fe3ec">HCO₃⁻ NOVO → sangue</text>
  <text x="490" y="210" text-anchor="middle" font-size="9" fill="#9fb1c0">regenera a base consumida</text>

  <text x="340" y="248" text-anchor="middle" font-size="11" fill="#e8a13a">na acidose crônica, a amoniogênese aumenta muito (dias) → maior excreção de H⁺</text>
  <text x="340" y="270" text-anchor="middle" font-size="9" fill="#9fb1c0">a acidez titulável (fosfato) é fixa pela dieta; o NH₄⁺ é o tampão regulável</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">As fórmulas de eGFR — estimam a TFG a partir da creatinina</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">corrigem pela creatinina + idade/sexo (proxies da produção/massa)</text>

  <rect x="40" y="62" width="290" height="78" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="185" y="84" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">Cockcroft-Gault</text>
  <text x="185" y="106" text-anchor="middle" font-size="10" fill="#cdd9e3">(140 − idade)·peso / (72·Pcr)</text>
  <text x="185" y="124" text-anchor="middle" font-size="10" fill="#9fb1c0">estima o CLEARANCE; usa peso</text>

  <rect x="350" y="62" width="290" height="78" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="495" y="84" text-anchor="middle" font-size="12" fill="#8fe0b0" font-weight="bold">CKD-EPI (atual)</text>
  <text x="495" y="106" text-anchor="middle" font-size="10" fill="#cdd9e3">creatinina + idade + sexo</text>
  <text x="495" y="124" text-anchor="middle" font-size="10" fill="#9fb1c0">a recomendada; raça removida (2021)</text>

  <rect x="120" y="156" width="440" height="60" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#e7eef4">Todas pressupõem EQUILÍBRIO e produção típica para idade/sexo</text>
  <text x="340" y="198" text-anchor="middle" font-size="10" fill="#f0c078">→ na LRA (fora do equilíbrio) e nos extremos de massa, o eGFR engana</text>

  <text x="340" y="244" text-anchor="middle" font-size="10" fill="#9fb1c0">estágios KDIGO: G1 ≥90 · G2 60–89 · G3a 45–59 · G3b 30–44 · G4 15–29 · G5 &lt;15</text>
  <text x="340" y="268" text-anchor="middle" font-size="9" fill="#9fb1c0">o eGFR só vale como medida de TFG quando a creatinina está estável</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A microscopia: dois campos, duas histórias</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o mesmo paciente oligúrico — o campo distingue túbulo íntegro de túbulo morto</text>

  <!-- campo pré-renal -->
  <circle cx="190" cy="170" r="100" fill="#0a1016" stroke="#39c0c8" stroke-width="2"/>
  <rect x="150" y="150" width="60" height="16" rx="8" fill="none" stroke="#9fe3ec"/>
  <rect x="200" y="180" width="50" height="14" rx="7" fill="none" stroke="#9fe3ec"/>
  <text x="190" y="288" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">Pré-renal: limpo, cilindros hialinos</text>
  <text x="190" y="66" text-anchor="middle" font-size="10" fill="#9fb1c0">FE_Na &lt;1 · U_osm alta</text>

  <!-- campo NTA -->
  <circle cx="490" cy="170" r="100" fill="#0a1016" stroke="#e8a13a" stroke-width="2"/>
  <rect x="450" y="150" width="60" height="16" rx="5" fill="#7a5a30" stroke="#e8a13a"/>
  <rect x="500" y="185" width="55" height="15" rx="4" fill="#7a5a30" stroke="#e8a13a"/>
  <rect x="445" y="195" width="40" height="13" rx="4" fill="#7a5a30" stroke="#e8a13a"/>
  <circle cx="520" cy="150" r="6" fill="none" stroke="#cdd9e3"/>
  <text x="490" y="288" text-anchor="middle" font-size="11" fill="#f0c078" font-weight="bold">NTA: cilindros granulosos pigmentados</text>
  <text x="490" y="66" text-anchor="middle" font-size="10" fill="#9fb1c0">FE_Na &gt;2 · U_osm ~iso</text>

  <text x="340" y="170" text-anchor="middle" font-size="20" fill="#5a6b78">vs</text>
</svg>

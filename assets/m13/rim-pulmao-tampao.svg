<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Dois reguladores, dois tempos — o sistema tampão do bicarbonato</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻ — o pulmão tira CO₂ (min); o rim ajusta o HCO₃⁻ (dias)</text>

  <text x="340" y="92" text-anchor="middle" font-size="16" fill="#e7eef4">CO₂ + H₂O ⇌ H⁺ + HCO₃⁻</text>

  <rect x="60" y="120" width="240" height="120" rx="10" fill="#10202c" stroke="#3a7bd5"/>
  <text x="180" y="146" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">PULMÃO (rápido)</text>
  <text x="180" y="170" text-anchor="middle" font-size="11" fill="#e7eef4">controla o PaCO₂</text>
  <text x="180" y="192" text-anchor="middle" font-size="11" fill="#cdd9e3">↑ventilação → ↓CO₂ → ↑pH</text>
  <text x="180" y="214" text-anchor="middle" font-size="10" fill="#9fb1c0">resposta em minutos</text>
  <text x="180" y="232" text-anchor="middle" font-size="9" fill="#9fb1c0">compensa distúrbios metabólicos</text>

  <rect x="380" y="120" width="240" height="120" rx="10" fill="#0c2a30" stroke="#39c0c8"/>
  <text x="500" y="146" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">RIM (lento)</text>
  <text x="500" y="170" text-anchor="middle" font-size="11" fill="#e7eef4">controla o HCO₃⁻</text>
  <text x="500" y="192" text-anchor="middle" font-size="11" fill="#cdd9e3">reabsorve + regenera (NH₄⁺)</text>
  <text x="500" y="214" text-anchor="middle" font-size="10" fill="#9fb1c0">resposta em horas a dias</text>
  <text x="500" y="232" text-anchor="middle" font-size="9" fill="#9fb1c0">compensa distúrbios respiratórios</text>

  <text x="340" y="270" text-anchor="middle" font-size="11" fill="#e8a13a">a compensação NUNCA corrige por completo (o pH não volta totalmente ao normal)</text>
  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#9fb1c0">se "corrigiu" demais ou de menos → distúrbio misto</text>
</svg>

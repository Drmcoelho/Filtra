<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0f1620" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <rect x="20" y="16" width="56" height="24" rx="4" fill="#39c0c8"/>
  <text x="48" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#05181a">M25</text>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#9fb1c0">Clearance K × Qb — dobrar o fluxo NÃO dobra K</text>
  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="270" stroke="#3a4a58" stroke-width="1.5"/>
  <line x1="70" y1="270" x2="600" y2="270" stroke="#3a4a58" stroke-width="1.5"/>
  <text x="40" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 40 170)">K (mL/min)</text>
  <text x="340" y="295" text-anchor="middle" font-size="11" fill="#9fb1c0">Qb — fluxo de sangue (mL/min)</text>
  <!-- KoA ceiling -->
  <line x1="70" y1="90" x2="600" y2="90" stroke="#e8a13a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="595" y="84" text-anchor="end" font-size="11" fill="#e8a13a">teto da membrana (KoA)</text>
  <!-- saturating curve -->
  <path d="M70 250 Q 230 150 380 120 T 600 100" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <!-- two points showing diminishing returns -->
  <circle cx="180" cy="170" r="6" fill="#52c08a"/>
  <text x="180" y="160" text-anchor="middle" font-size="10" fill="#52c08a">Qb 200 → K 150</text>
  <circle cx="380" cy="120" r="6" fill="#e0556b"/>
  <text x="400" y="135" font-size="10" fill="#e0556b">Qb 400 → K 240 (não 300)</text>
  <text x="180" y="265" text-anchor="middle" font-size="10" fill="#9fb1c0">200</text>
  <text x="380" y="265" text-anchor="middle" font-size="10" fill="#9fb1c0">400</text>
  <text x="320" y="225" text-anchor="middle" font-size="11" fill="#9fb1c0">o ganho diminui — o KoA limita</text>
</svg>

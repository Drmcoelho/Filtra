<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">Cascata renina–angiotensina–aldosterona</title><desc id="desc">Cada etapa tem origem, enzima e alvo próprios; Ang II é o principal nó efetor.</desc><defs>

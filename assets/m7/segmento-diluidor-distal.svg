<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O TCD — o ajuste fino e o "diluidor distal"</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">reabsorve Na pelo NCC (sem água) → continua diluindo o filtrado; é o alvo do tiazídico</text>

  <rect x="40" y="74" width="600" height="40" rx="6" fill="#3a214a" fill-opacity="0.35" stroke="#a06ad0"/><text x="56" y="68" font-size="10" fill="#c9a0e0">LUZ (TCD)</text>
  <rect x="40" y="150" width="600" height="56" fill="#10202c" stroke="#3a4a58"/><text x="56" y="146" font-size="10" fill="#9fb1c0">CÉLULA do TCD</text>

  <rect x="300" y="100" width="80" height="60" rx="6" fill="#16202a" stroke="#39c0c8" stroke-width="2"/>
  <text x="340" y="135" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">NCC</text>
  <line x1="320" y1="110" x2="320" y2="150" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#d)"/><text x="312" y="96" font-size="9" fill="#9fe3ec">Na⁺</text>
  <line x1="360" y1="110" x2="360" y2="150" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#d)"/><text x="356" y="96" font-size="9" fill="#9fe3ec">Cl⁻</text>
  <line x1="296" y1="116" x2="384" y2="144" stroke="#e0556b" stroke-width="3"/>
  <text x="470" y="130" font-size="11" fill="#e08a96" font-weight="bold">tiazídico</text>

  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#e8a13a">como sai Na (sem água), o fluido fica mais diluído — bloquear o NCC prejudica a DILUIÇÃO</text>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="#9fb1c0">por isso o tiazídico pode causar HIPONATREMIA (≠ do de alça, que também tira a concentração)</text>
</svg>

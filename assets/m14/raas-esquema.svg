<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">A cascata RAA — do substrato à Ang II</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">cada seta é uma enzima · o passo limitante é a renina</text>

  <!-- angiotensinogênio -->
  <rect x="40" y="70" width="170" height="48" rx="8" fill="#1b242d" stroke="#3a4a58"/>
  <text x="125" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#e7eef4">Angiotensinogênio</text>
  <text x="125" y="108" text-anchor="middle" font-size="10" fill="#9fb1c0">produzido no FÍGADO</text>

  <!-- renina enzima -->
  <line x1="210" y1="94" x2="300" y2="94" stroke="#39c0c8" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="222" y="56" width="66" height="24" rx="6" fill="#102a2c" stroke="#39c0c8"/>
  <text x="255" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#39c0c8">RENINA</text>
  <text x="255" y="118" text-anchor="middle" font-size="9" fill="#39c0c8">do rim (JGA)</text>

  <!-- Ang I -->
  <rect x="300" y="70" width="120" height="48" rx="8" fill="#1b242d" stroke="#3a4a58"/>
  <text x="360" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#e7eef4">Ang I</text>

  <!-- ECA enzima -->
  <line x1="420" y1="94" x2="500" y2="94" stroke="#e8a13a" stroke-width="2" marker-end="url(#ao)"/>
  <rect x="430" y="56" width="60" height="24" rx="6" fill="#2a210f" stroke="#e8a13a"/>
  <text x="460" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#e8a13a">ECA</text>
  <text x="460" y="118" text-anchor="middle" font-size="9" fill="#e8a13a">no PULMÃO</text>

  <!-- Ang II -->
  <rect x="500" y="68" width="110" height="52" rx="8" fill="#19303a" stroke="#39c0c8" stroke-width="2"/>
  <text x="555" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#39c0c8">Ang II</text>
  <text x="555" y="108" text-anchor="middle" font-size="9" fill="#9fb1c0">o hormônio efetor</text>

  <!-- ações da Ang II -->
  <text x="320" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#e7eef4">Ang II faz 4 coisas:</text>
  <g font-size="11" fill="#cfdbe6">
    <rect x="40" y="178" width="270" height="36" rx="6" fill="#141b22" stroke="#3a4a58"/>
    <text x="54" y="201" font-size="11" fill="#e7eef4">① constringe a arteríola EFERENTE → ↑P_GC (defende a TFG)</text>
    <rect x="330" y="178" width="270" height="36" rx="6" fill="#141b22" stroke="#3a4a58"/>
    <text x="344" y="201" font-size="11" fill="#e7eef4">② estimula ALDOSTERONA (adrenal) → ENaC, retém Na</text>
    <rect x="40" y="222" width="270" height="36" rx="6" fill="#141b22" stroke="#3a4a58"/>
    <text x="54" y="245" font-size="11" fill="#e7eef4">③ sede + ADH → retém água</text>
    <rect x="330" y="222" width="270" height="36" rx="6" fill="#141b22" stroke="#3a4a58"/>
    <text x="344" y="245" font-size="11" fill="#e7eef4">④ vasoconstrição sistêmica → ↑PA</text>
  </g>

  <!-- gancho farmacológico -->
  <rect x="40" y="276" width="560" height="40" rx="8" fill="#102026" stroke="#39c0c8" stroke-dasharray="4 3"/>
  <text x="320" y="294" text-anchor="middle" font-size="10.5" fill="#9fb1c0">IECA bloqueia a ECA (③→②); BRA bloqueia o receptor AT1 da Ang II — alavancas do M18.</text>
  <text x="320" y="310" text-anchor="middle" font-size="10.5" fill="#9fb1c0">Resultado comum: ↓PA, ↓aldosterona, e — atenção — ↓P_GC pela eferente (creatinina pode subir).</text>

  <text x="320" y="344" text-anchor="middle" font-size="9" fill="#5b6b78">FILTRA · DIALISA — M14 · RAAS</text>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#39c0c8"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e8a13a"/></marker>
  </defs>
</svg>

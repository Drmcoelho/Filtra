<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui,Segoe UI,sans-serif">
  <rect width="640" height="320" fill="#0f161d"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#e7eef4">O MESMO número decide diferente: refratário × responsivo</text>
  <!-- caixa do número -->
  <rect x="240" y="55" width="160" height="46" rx="8" fill="#1b242d" stroke="#9fb1c0"/>
  <text x="320" y="84" text-anchor="middle" font-size="15" fill="#e7eef4" font-weight="bold">K⁺ 6,8 mEq/L + ECG</text>
  <!-- bifurcação -->
  <path d="M280 101 L150 150" stroke="#52c08a" stroke-width="2"/>
  <path d="M360 101 L490 150" stroke="#e0556b" stroke-width="2"/>
  <!-- ramo responsivo -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#52c08a" opacity="0.12" stroke="#52c08a"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" fill="#52c08a" font-weight="bold">RESPONDEU à clínica</text>
    <text x="110" y="46" text-anchor="middle" font-size="11" fill="#e7eef4">insulina+glicose, β₂, gluconato</text>
    <text x="110" y="68" text-anchor="middle" font-size="11" fill="#9fb1c0">K⁺ desce, ECG normaliza</text>
    <text x="110" y="98" text-anchor="middle" font-size="13" fill="#52c08a" font-weight="bold">NÃO indica TRS</text>
  </g>
  <!-- ramo refratário -->
  <g transform="translate(380,150)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#e0556b" opacity="0.12" stroke="#e0556b"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" fill="#e0556b" font-weight="bold">REFRATÁRIO</text>
    <text x="110" y="46" text-anchor="middle" font-size="11" fill="#e7eef4">K⁺ persiste apesar do tratamento</text>
    <text x="110" y="68" text-anchor="middle" font-size="11" fill="#9fb1c0">ECG mantém alteração</text>
    <text x="110" y="98" text-anchor="middle" font-size="13" fill="#e0556b" font-weight="bold">INDICA TRS</text>
  </g>
  <text x="320" y="305" text-anchor="middle" font-size="11" fill="#9fb1c0">a indicação não está no número — está na RESPOSTA do mecanismo à terapia clínica</text>
</svg>

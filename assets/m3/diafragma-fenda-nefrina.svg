<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O diafragma de fenda — o zíper de nefrina entre os pedicelos</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a terceira e mais fina peneira; mutação/lesão da nefrina → proteinúria</text>

  <!-- dois pedicelos -->
  <path d="M120,120 q40,-40 80,0 l0,90 l-80,0 z" fill="#a06ad0" fill-opacity="0.5" stroke="#c9a0e0" stroke-width="2"/>
  <path d="M480,120 q40,-40 80,0 l0,90 l-80,0 z" fill="#a06ad0" fill-opacity="0.5" stroke="#c9a0e0" stroke-width="2"/>
  <text x="160" y="230" text-anchor="middle" font-size="11" fill="#c9a0e0">pedicelo (podócito)</text>
  <text x="520" y="230" text-anchor="middle" font-size="11" fill="#c9a0e0">pedicelo (podócito)</text>

  <!-- fenda + diafragma (zíper de nefrina) -->
  <rect x="200" y="120" width="280" height="6" fill="#0a1016"/>
  <g stroke="#39c0c8" stroke-width="3">
    <line x1="220" y1="123" x2="250" y2="105"/><line x1="250" y1="105" x2="280" y2="123"/>
    <line x1="280" y1="123" x2="310" y2="105"/><line x1="310" y1="105" x2="340" y2="123"/>
    <line x1="340" y1="123" x2="370" y2="105"/><line x1="370" y1="105" x2="400" y2="123"/>
    <line x1="400" y1="123" x2="430" y2="105"/><line x1="430" y1="105" x2="460" y2="123"/>
  </g>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#9fe3ec">diafragma de fenda — nefrina + podocina (o "zíper")</text>

  <!-- molécula barrada -->
  <circle cx="340" cy="150" r="16" fill="#e0556b"/><text x="340" y="184" text-anchor="middle" font-size="10" fill="#e08a96">proteína barrada na fenda</text>

  <rect x="120" y="252" width="440" height="50" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="272" text-anchor="middle" font-size="11" fill="#e7eef4">Apagamento dos pedicelos (effacement) + perda da carga →</text>
  <text x="340" y="290" text-anchor="middle" font-size="11" fill="#f0c078">proteinúria (lesão mínima é o exemplo clássico, M3)</text>
</svg>

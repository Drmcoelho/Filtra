<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Teto alto (alça) × teto baixo (tiazídico)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a alça bloqueia ~25% do Na filtrado (ramo espesso); o tiazídico, só ~5% (TCD) — tetos diferentes</text>

  <line x1="70" y1="250" x2="640" y2="250" stroke="#3a4a58"/>
  <line x1="70" y1="64" x2="70" y2="250" stroke="#3a4a58"/>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="#9fb1c0">dose →</text>
  <text x="30" y="160" font-size="11" fill="#9fb1c0" transform="rotate(-90 30 160)">natriurese máxima</text>

  <path d="M80,242 C200,210 280,120 380,98 C480,86 580,84 630,83" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <text x="500" y="78" font-size="11" fill="#9fe3ec">alça — teto ALTO (furosemida 20–80 mg)</text>
  <path d="M80,244 C200,232 280,200 380,190 C480,184 580,183 630,182" fill="none" stroke="#e8a13a" stroke-width="3"/>
  <text x="500" y="176" font-size="11" fill="#f0c078">tiazídico — teto BAIXO (HCTZ 12,5–50 mg)</text>

  <text x="340" y="296" text-anchor="middle" font-size="9" fill="#e8a13a">na resistência, aumentar a dose da alça até atingir o teto faz sentido; estourar o teto, não</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Mácula densa e o feedback tubuloglomerular</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o túbulo distal "toca" seu próprio glomérulo e ajusta a aferente</text>

  <!-- glomérulo -->
  <circle cx="170" cy="170" r="52" fill="#0f3540" stroke="#39c0c8" stroke-width="2"/>
  <path d="M144,182 q8,-26 20,-9 q9,-18 20,1 q11,0 5,16 q-22,11 -45,4 z" fill="#39c0c8" fill-opacity="0.5"/>
  <text x="170" y="238" text-anchor="middle" font-size="11" fill="#9fe3ec">glomérulo</text>
  <!-- aferente / eferente -->
  <line x1="70" y1="150" x2="122" y2="160" stroke="#e0556b" stroke-width="8" stroke-linecap="round"/>
  <text x="78" y="138" font-size="10" fill="#e08a96">aferente</text>
  <line x1="218" y1="160" x2="270" y2="150" stroke="#3a7bd5" stroke-width="5" stroke-linecap="round"/>
  <text x="246" y="138" font-size="10" fill="#9bbef0">eferente</text>
  <!-- células granulares -->
  <circle cx="110" cy="158" r="7" fill="#e8a13a"/><text x="92" y="186" font-size="9" fill="#e8a13a">células</text><text x="92" y="197" font-size="9" fill="#e8a13a">granulares</text>

  <!-- túbulo distal com mácula densa tocando a aferente -->
  <path d="M170,222 q0,40 -40,52 q-40,12 -40,-30" fill="none" stroke="#c9a0e0" stroke-width="12" stroke-linecap="round"/>
  <rect x="120" y="150" width="18" height="14" rx="3" fill="#a06ad0"/>
  <text x="129" y="124" text-anchor="middle" font-size="9" fill="#c9a0e0">mácula</text>
  <text x="129" y="135" text-anchor="middle" font-size="9" fill="#c9a0e0">densa</text>
  <text x="150" y="300" font-size="10" fill="#c9a0e0">túbulo distal</text>

  <!-- lógica -->
  <g font-size="12" fill="#e7eef4">
    <rect x="350" y="86" width="300" height="34" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="366" y="108">NaCl distal ALTO → mácula densa sente</text>
    <rect x="350" y="128" width="300" height="34" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="366" y="150">→ adenosina → CONTRAI a aferente</text>
    <rect x="350" y="170" width="300" height="34" rx="6" fill="#0f3540" stroke="#39c0c8"/><text x="366" y="192" fill="#9fe3ec">→ TFG↓ (protege contra perda de sal)</text>
    <rect x="350" y="212" width="300" height="34" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="366" y="234">NaCl BAIXO → células granulares → RENINA (RAAS, M14)</text>
  </g>
  <line x1="360" y1="103" x2="146" y2="158" stroke="#39c0c8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#m)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Proteinúria por mecanismo — não basta o número, decomponha</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">de onde vem a proteína na urina muda o diagnóstico e a conduta</text>

  <!-- GLOMERULAR -->
  <rect x="24" y="64" width="200" height="232" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="124" y="88" text-anchor="middle" font-size="13" fill="#e08a96" font-weight="bold">GLOMERULAR</text>
  <text x="124" y="112" text-anchor="middle" font-size="10" fill="#cdd9e3">a barreira vaza</text>
  <text x="124" y="140" text-anchor="middle" font-size="11" fill="#e7eef4">seletiva (só carga)</text>
  <text x="124" y="156" text-anchor="middle" font-size="9" fill="#9fb1c0">→ albumina (lesão mínima)</text>
  <text x="124" y="182" text-anchor="middle" font-size="11" fill="#e7eef4">não-seletiva (tamanho)</text>
  <text x="124" y="198" text-anchor="middle" font-size="9" fill="#9fb1c0">→ albumina + IgG</text>
  <text x="124" y="232" text-anchor="middle" font-size="11" fill="#f0c078">pode ser nefrótica</text>
  <text x="124" y="248" text-anchor="middle" font-size="9" fill="#9fb1c0">(&gt; 3,5 g/dia)</text>

  <!-- TUBULAR -->
  <rect x="240" y="64" width="200" height="232" rx="8" fill="#10202c" stroke="#c9a0e0"/>
  <text x="340" y="88" text-anchor="middle" font-size="13" fill="#d7baf0" font-weight="bold">TUBULAR</text>
  <text x="340" y="112" text-anchor="middle" font-size="10" fill="#cdd9e3">o túbulo não reabsorve</text>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#e7eef4">proteínas de baixo PM</text>
  <text x="340" y="156" text-anchor="middle" font-size="9" fill="#9fb1c0">(β2-microglobulina)</text>
  <text x="340" y="186" text-anchor="middle" font-size="10" fill="#9fb1c0">barreira íntegra; o defeito</text>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#9fb1c0">é a reabsorção (Tm)</text>
  <text x="340" y="234" text-anchor="middle" font-size="11" fill="#cdd9e3">geralmente leve</text>
  <text x="340" y="250" text-anchor="middle" font-size="9" fill="#9fb1c0">(&lt; 2 g/dia)</text>

  <!-- OVERFLOW -->
  <rect x="456" y="64" width="200" height="232" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="556" y="88" text-anchor="middle" font-size="13" fill="#f0c078" font-weight="bold">OVERFLOW</text>
  <text x="556" y="112" text-anchor="middle" font-size="10" fill="#cdd9e3">excesso no plasma</text>
  <text x="556" y="140" text-anchor="middle" font-size="11" fill="#e7eef4">satura a reabsorção</text>
  <text x="556" y="168" text-anchor="middle" font-size="10" fill="#9fb1c0">cadeias leves (mieloma),</text>
  <text x="556" y="182" text-anchor="middle" font-size="10" fill="#9fb1c0">mioglobina, Hb</text>
  <text x="556" y="216" text-anchor="middle" font-size="10" fill="#9fb1c0">barreira e túbulo normais;</text>
  <text x="556" y="230" text-anchor="middle" font-size="10" fill="#9fb1c0">a oferta é que é alta</text>
</svg>

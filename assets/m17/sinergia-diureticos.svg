<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Sinergia — o todo é maior que a soma</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">alça + tiazídico produzem mais natriurese que a soma dos efeitos isolados (supra-aditivo)</text>

  <!-- barras -->
  <g text-anchor="middle">
    <rect x="90" y="180" width="80" height="60" fill="#39c0c8" fill-opacity="0.5" stroke="#39c0c8"/>
    <text x="130" y="258" font-size="10" fill="#9fe3ec">só alça</text><text x="130" y="172" font-size="10" fill="#cdd9e3">+Δ</text>
    <rect x="210" y="200" width="80" height="40" fill="#e8a13a" fill-opacity="0.5" stroke="#e8a13a"/>
    <text x="250" y="258" font-size="10" fill="#f0c078">só tiazídico</text><text x="250" y="192" font-size="10" fill="#cdd9e3">+δ</text>
    <rect x="330" y="160" width="80" height="80" fill="#5a6b78" fill-opacity="0.3" stroke="#5a6b78" stroke-dasharray="4 3"/>
    <text x="370" y="258" font-size="10" fill="#9fb1c0">soma esperada</text>
    <rect x="450" y="96" width="80" height="144" fill="#52c08a" fill-opacity="0.55" stroke="#52c08a"/>
    <text x="490" y="258" font-size="10" fill="#9fe3ec" font-weight="bold">alça + tiazídico</text><text x="490" y="88" font-size="11" fill="#9fe3ec">&gt; soma!</text>
  </g>

  <text x="340" y="288" text-anchor="middle" font-size="10" fill="#e8a13a">o tiazídico bloqueia o TCD que IRIA compensar a carga extra entregue pela alça → a sinergia mora na sequência</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0f1620" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <rect x="20" y="16" width="56" height="24" rx="4" fill="#39c0c8"/>
  <text x="48" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#05181a">M25</text>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#9fb1c0">Adequado × subdose — a dose é MEDIDA, não adivinhada</text>
  <!-- adequado -->
  <rect x="40" y="70" width="250" height="210" rx="8" fill="#52c08a" fill-opacity="0.10" stroke="#52c08a" stroke-width="2"/>
  <text x="165" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#52c08a">ADEQUADO</text>
  <text x="165" y="135" text-anchor="middle" font-size="13" fill="#e7eef4">Kt/V 1,35</text>
  <text x="165" y="160" text-anchor="middle" font-size="13" fill="#e7eef4">URR 68%</text>
  <text x="165" y="195" text-anchor="middle" font-size="11" fill="#9fb1c0">Kt/V ≥ 1,2 E URR ≥ 65%</text>
  <text x="165" y="225" text-anchor="middle" font-size="11" fill="#9fb1c0">4 h · Qb 300 · high-flux</text>
  <text x="165" y="255" text-anchor="middle" font-size="11" fill="#52c08a">manter a prescrição</text>
  <!-- subdose -->
  <rect x="350" y="70" width="250" height="210" rx="8" fill="#e0556b" fill-opacity="0.10" stroke="#e0556b" stroke-width="2"/>
  <text x="475" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#e0556b">SUBDOSE</text>
  <text x="475" y="135" text-anchor="middle" font-size="13" fill="#e7eef4">Kt/V 0,8</text>
  <text x="475" y="160" text-anchor="middle" font-size="13" fill="#e7eef4">URR 52%</text>
  <text x="475" y="195" text-anchor="middle" font-size="11" fill="#9fb1c0">abaixo do alvo</text>
  <text x="475" y="225" text-anchor="middle" font-size="11" fill="#9fb1c0">2 h · paciente grande</text>
  <text x="475" y="255" text-anchor="middle" font-size="11" fill="#e8a13a">↑ tempo / ↑ Qb / high-flux</text>
</svg>

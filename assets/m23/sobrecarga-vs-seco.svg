<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#eef6f7" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a6f7a" stroke-width="2"/>
  <rect x="20" y="14" width="56" height="24" rx="4" fill="#2a6f7a"/>
  <text x="48" y="31" text-anchor="middle" font-size="12" font-weight="bold" fill="white">M23</text>
  <text x="360" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#13434a">⑧ SOBRECARGA × PESO SECO — quanto retirar</text>
  <!-- coluna do paciente -->
  <rect x="120" y="70" width="120" height="180" rx="6" fill="#2a7a3a" fill-opacity="0.16" stroke="#2a7a3a" stroke-width="2"/>
  <rect x="120" y="70" width="120" height="55" rx="6" fill="#2a6f7a" fill-opacity="0.4" stroke="#2a6f7a"/>
  <text x="180" y="60" text-anchor="middle" font-size="11" fill="#13434a">peso atual</text>
  <text x="180" y="102" text-anchor="middle" font-size="12" fill="#13434a">① sobrecarga</text>
  <text x="180" y="118" text-anchor="middle" font-size="11" fill="#13434a">(a retirar)</text>
  <line x1="120" y1="125" x2="240" y2="125" stroke="#2a7a3a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="180" y="195" text-anchor="middle" font-size="12" fill="#2a7a3a">② peso seco</text>
  <text x="180" y="265" text-anchor="middle" font-size="10" fill="#2a7a3a">euvolemia</text>
  <!-- formula -->
  <g font-size="12" fill="#13434a">
    <text x="300" y="120">③ UF total (L) = peso atual − peso seco</text>
    <text x="300" y="150">④ UF rate (mL/h) = UF total ÷ tempo</text>
    <text x="300" y="195" fill="#b8402f">subestimar o seco → deixa sobrecarga</text>
    <text x="300" y="218" fill="#c07a1a">superestimar a sobrecarga → tira demais</text>
    <text x="300" y="245" fill="#2a7a3a">o número certo nasce do peso seco correto</text>
  </g>
  <text x="360" y="306" text-anchor="middle" font-size="9" fill="#13434a" opacity="0.55">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

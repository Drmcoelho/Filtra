<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Georgia,serif">
  <rect width="640" height="360" fill="#0a1016"/>
  <rect x="2" y="2" width="636" height="356" rx="6" fill="none" stroke="#283642" stroke-width="2"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Quando indicar a HD por toxina</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#9fb1c0">duas condições: a toxina PASSA pela membrana E há gatilho (nível / gravidade / acidose)</text>
  <defs><marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb1c0"/></marker></defs>

  <!-- decisao 1 -->
  <rect x="220" y="74" width="200" height="44" rx="8" fill="#39c0c8" opacity="0.12" stroke="#39c0c8"/>
  <text x="320" y="100" text-anchor="middle" font-size="12" fill="#39c0c8" font-weight="bold">é DIALISÁVEL? (score ≥ 0,4)</text>

  <!-- nao -->
  <line x1="220" y1="96" x2="120" y2="140" stroke="#9fb1c0" stroke-width="2" marker-end="url(#ar3)"/>
  <text x="150" y="120" font-size="10" fill="#e0556b">não</text>
  <rect x="40" y="142" width="150" height="60" rx="8" fill="#e0556b" opacity="0.10" stroke="#e0556b"/>
  <text x="115" y="166" text-anchor="middle" font-size="11" fill="#e0556b" font-weight="bold">HD não ajuda</text>
  <text x="115" y="184" text-anchor="middle" font-size="9" fill="#9fb1c0">Vd alto / muito ligada</text>
  <text x="115" y="197" text-anchor="middle" font-size="9" fill="#9fb1c0">(digoxina → Fab)</text>

  <!-- sim -->
  <line x1="420" y1="96" x2="520" y2="140" stroke="#9fb1c0" stroke-width="2" marker-end="url(#ar3)"/>
  <text x="490" y="120" font-size="10" fill="#52c08a">sim</text>
  <rect x="430" y="142" width="180" height="78" rx="8" fill="#52c08a" opacity="0.10" stroke="#52c08a"/>
  <text x="520" y="164" text-anchor="middle" font-size="11" fill="#52c08a" font-weight="bold">há GATILHO?</text>
  <text x="520" y="182" text-anchor="middle" font-size="9" fill="#9fb1c0">nível &gt; limiar</text>
  <text x="520" y="196" text-anchor="middle" font-size="9" fill="#9fb1c0">sintomas graves</text>
  <text x="520" y="210" text-anchor="middle" font-size="9" fill="#9fb1c0">acidose refratária</text>

  <!-- indica -->
  <line x1="520" y1="220" x2="520" y2="250" stroke="#9fb1c0" stroke-width="2" marker-end="url(#ar3)"/>
  <rect x="400" y="252" width="220" height="50" rx="8" fill="#52c08a" opacity="0.16" stroke="#52c08a"/>
  <text x="510" y="274" text-anchor="middle" font-size="12" fill="#52c08a" font-weight="bold">INDICA HEMODIÁLISE</text>
  <text x="510" y="292" text-anchor="middle" font-size="9" fill="#9fb1c0">remove tóxico (+ corrige acidose)</text>

  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#e7eef4">lítio, salicilato,</text>
  <text x="200" y="292" text-anchor="middle" font-size="11" fill="#e7eef4">metanol, etilenoglicol → dialisáveis</text>
  <text x="320" y="332" text-anchor="middle" font-size="9" fill="#9fb1c0" opacity="0.6">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">TRPV5 — o canal de cálcio regulado do TCD</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a entrada apical de Ca²⁺; controlada por PTH e vitamina D (eixo ósseo-mineral, M12)</text>

  <rect x="40" y="70" width="600" height="44" rx="6" fill="#3a214a" fill-opacity="0.35" stroke="#a06ad0"/>
  <circle cx="200" cy="92" r="9" fill="#d0c08a"/><text x="200" y="96" text-anchor="middle" font-size="9" fill="#06121a">Ca</text>
  <circle cx="340" cy="92" r="9" fill="#d0c08a"/><text x="340" y="96" text-anchor="middle" font-size="9" fill="#06121a">Ca</text>
  <text x="270" y="68" font-size="10" fill="#c9a0e0">LUZ — Ca²⁺ filtrado a reabsorver</text>

  <rect x="160" y="120" width="80" height="60" rx="6" fill="#16202a" stroke="#d0c08a" stroke-width="2"/>
  <text x="200" y="155" text-anchor="middle" font-size="11" fill="#e0d0a0" font-weight="bold">TRPV5</text>

  <rect x="300" y="180" width="340" height="90" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="470" y="204" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">Quem regula a reabsorção de Ca²⁺ aqui</text>
  <text x="316" y="228" font-size="11" fill="#cdd9e3">• PTH → ↑ TRPV5 → reabsorve mais Ca (poupa Ca)</text>
  <text x="316" y="250" font-size="11" fill="#cdd9e3">• vitamina D (calcitriol) → ↑ proteínas de transporte</text>
  <text x="316" y="266" font-size="10" fill="#9fb1c0">o tiazídico aumenta indiretamente essa reabsorção (paradoxo)</text>
  <text x="160" y="270" font-size="10" fill="#9fb1c0">o TCD é o ponto de ajuste fino do Ca urinário</text>
</svg>

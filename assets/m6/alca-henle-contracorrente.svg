<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A alça de Henle — dois ramos com papéis opostos</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o fino descendente concentra (água sai); o espesso ascendente dilui (NaCl sai, água não)</text>

  <!-- grampo -->
  <path d="M250,70 L250,250 Q250,285 300,285 Q350,285 350,250 L350,70" fill="none" stroke="#3a4a58" stroke-width="2"/>
  <!-- descendente -->
  <rect x="236" y="70" width="14" height="200" fill="#3a7bd5" fill-opacity="0.5"/>
  <text x="210" y="64" text-anchor="end" font-size="11" fill="#9bbef0">ramo fino ↓</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#9bbef0">permeável à ÁGUA</text>
  <text x="150" y="166" text-anchor="middle" font-size="10" fill="#9bbef0">(água sai → concentra)</text>
  <!-- ascendente espesso -->
  <rect x="350" y="70" width="20" height="200" fill="#e0556b" fill-opacity="0.5"/>
  <text x="380" y="64" text-anchor="start" font-size="11" fill="#e08a96">ramo ESPESSO ↑</text>
  <text x="520" y="150" text-anchor="middle" font-size="10" fill="#e08a96">impermeável à água</text>
  <text x="520" y="166" text-anchor="middle" font-size="10" fill="#e08a96">NKCC2 bombeia NaCl (dilui)</text>

  <!-- setas -->
  <line x1="236" y1="160" x2="200" y2="160" stroke="#39c0c8" stroke-width="2" marker-end="url(#a)"/><text x="216" y="152" font-size="9" fill="#9fe3ec">H₂O</text>
  <line x1="370" y1="160" x2="410" y2="160" stroke="#e0556b" stroke-width="2" marker-end="url(#a)"/><text x="392" y="152" font-size="9" fill="#e08a96">NaCl</text>

  <text x="340" y="305" text-anchor="middle" font-size="10" fill="#e8a13a">o ramo espesso é o "segmento diluidor" e o motor do gradiente corticomedular</text>
</svg>

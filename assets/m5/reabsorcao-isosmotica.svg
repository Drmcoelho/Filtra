<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O TCP reabsorve ~65% do Na — isosmótico</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">soluto puxa a água junto → o que sai do proximal tem a mesma osmolaridade do plasma</text>

  <!-- luz tubular -->
  <rect x="40" y="80" width="600" height="46" rx="8" fill="#3a214a" fill-opacity="0.4" stroke="#a06ad0"/>
  <text x="56" y="74" font-size="10" fill="#c9a0e0">luz do TCP (filtrado)</text>
  <!-- célula -->
  <rect x="40" y="140" width="600" height="60" fill="#10202c" stroke="#3a4a58"/>
  <text x="56" y="160" font-size="10" fill="#9fb1c0">célula do TCP</text>
  <!-- sangue -->
  <rect x="40" y="214" width="600" height="40" rx="8" fill="#7a2330" fill-opacity="0.3" stroke="#e0556b"/>
  <text x="56" y="238" font-size="10" fill="#e08a96">sangue (capilar peritubular)</text>

  <!-- setas Na + água descendo -->
  <g stroke="#39c0c8" stroke-width="2.5" marker-end="url(#r)">
    <line x1="160" y1="126" x2="160" y2="214"/><line x1="300" y1="126" x2="300" y2="214"/><line x1="440" y1="126" x2="440" y2="214"/>
  </g>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#9fe3ec">Na⁺</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#9fe3ec">H₂O</text>
  <text x="440" y="180" text-anchor="middle" font-size="11" fill="#9fe3ec">glicose, HCO₃, aa</text>

  <text x="340" y="280" text-anchor="middle" font-size="11" fill="#e8a13a">a alça de Henle é "prisioneira do proximal": o que o TCP não reabsorver chega lá</text>
</svg>

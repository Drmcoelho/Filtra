<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Osmose × ultrafiltração — duas formas de mover água</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a HD/HF empurra água por PRESSÃO (TMP); a diálise peritoneal puxa por OSMOSE (glicose)</text>

  <rect x="40" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="185" y="92" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">Ultrafiltração (pressão)</text>
  <text x="56" y="118" font-size="11" fill="#e7eef4">a água é EMPURRADA pela TMP</text>
  <text x="56" y="140" font-size="11" fill="#cdd9e3">Jv = Kuf · TMP</text>
  <text x="56" y="168" font-size="11" fill="#e7eef4">usada na HD, HF, HDF e TRRC</text>
  <text x="56" y="196" font-size="10" fill="#9fb1c0">gradiente de PRESSÃO hidrostática</text>
  <text x="56" y="218" font-size="9" fill="#e8a13a">a água carrega soluto (convecção)</text>

  <rect x="350" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="495" y="92" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">Osmose (peritoneal, M30)</text>
  <text x="366" y="118" font-size="11" fill="#e7eef4">a água é PUXADA pela glicose</text>
  <text x="366" y="140" font-size="11" fill="#cdd9e3">no líquido peritoneal hipertônico</text>
  <text x="366" y="168" font-size="11" fill="#e7eef4">o peritônio é a membrana</text>
  <text x="366" y="196" font-size="10" fill="#9fb1c0">gradiente OSMÓTICO</text>
  <text x="366" y="218" font-size="9" fill="#e8a13a">a glicose absorvida limita a UF com o tempo</text>

  <text x="340" y="276" text-anchor="middle" font-size="10" fill="#9fb1c0">a física é a mesma do M0 (osmose) e do néfron — aqui, posta a serviço da máquina</text>
</svg>

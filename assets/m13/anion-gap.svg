<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O ânion gap — os ânions "invisíveis"</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">AG = Na⁺ − (Cl⁻ + HCO₃⁻) ≈ 12; sobe quando um ácido fixo consome HCO₃⁻ e deixa seu ânion</text>

  <!-- coluna normal -->
  <text x="180" y="70" text-anchor="middle" font-size="11" fill="#9fe3ec">Normal (AG ~12)</text>
  <rect x="120" y="80" width="50" height="150" fill="#3a7bd5" fill-opacity="0.4" stroke="#3a7bd5"/>
  <text x="145" y="245" text-anchor="middle" font-size="9" fill="#9bbef0">Na⁺ 140</text>
  <rect x="190" y="80" width="50" height="105" fill="#39c0c8" fill-opacity="0.4" stroke="#39c0c8"/>
  <text x="215" y="200" text-anchor="middle" font-size="8" fill="#9fe3ec">Cl⁻ 104</text>
  <rect x="190" y="185" width="50" height="25" fill="#52c08a" fill-opacity="0.5" stroke="#52c08a"/>
  <text x="215" y="245" text-anchor="middle" font-size="8" fill="#9fb1c0">HCO₃ 24</text>
  <rect x="190" y="210" width="50" height="13" fill="#e8a13a" fill-opacity="0.6" stroke="#e8a13a"/>
  <text x="265" y="220" font-size="9" fill="#f0c078">AG ~12</text>

  <!-- coluna AG alto -->
  <text x="480" y="70" text-anchor="middle" font-size="11" fill="#e08a96">AG alto (ácido fixo)</text>
  <rect x="420" y="80" width="50" height="150" fill="#3a7bd5" fill-opacity="0.4" stroke="#3a7bd5"/>
  <text x="445" y="245" text-anchor="middle" font-size="9" fill="#9bbef0">Na⁺ 140</text>
  <rect x="490" y="80" width="50" height="105" fill="#39c0c8" fill-opacity="0.4" stroke="#39c0c8"/>
  <text x="515" y="200" text-anchor="middle" font-size="8" fill="#9fe3ec">Cl⁻ 104</text>
  <rect x="490" y="185" width="50" height="10" fill="#52c08a" fill-opacity="0.5" stroke="#52c08a"/>
  <text x="515" y="245" text-anchor="middle" font-size="8" fill="#9fb1c0">HCO₃ ↓</text>
  <rect x="490" y="195" width="50" height="35" fill="#e0556b" fill-opacity="0.6" stroke="#e0556b"/>
  <text x="565" y="218" font-size="9" fill="#e08a96">AG ↑↑</text>

  <text x="340" y="272" text-anchor="middle" font-size="11" fill="#e8a13a">o ácido (lactato, cetona) doa H⁺ que gasta HCO₃⁻; seu ânion ocupa o "gap"</text>
  <text x="340" y="290" text-anchor="middle" font-size="9" fill="#9fb1c0">AG normal (hiperclorêmica): perde HCO₃⁻ e o Cl⁻ sobe no lugar (diarreia, ATR)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Henderson–Hasselbalch — o pH é uma RAZÃO</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o que importa não é o HCO₃⁻ nem o PaCO₂ sozinhos, mas a relação entre eles</text>

  <text x="340" y="96" text-anchor="middle" font-size="20" fill="#e7eef4">pH = 6,1 + log₁₀ ( HCO₃⁻ / (0,03 · PaCO₂) )</text>

  <rect x="80" y="130" width="240" height="100" rx="10" fill="#10202c" stroke="#52c08a"/>
  <text x="200" y="156" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">HCO₃⁻ — o numerador</text>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#cdd9e3">regulado pelo RIM (lento)</text>
  <text x="200" y="202" text-anchor="middle" font-size="11" fill="#cdd9e3">↑ HCO₃ → pH↑ (alcalose)</text>
  <text x="200" y="220" text-anchor="middle" font-size="10" fill="#9fb1c0">componente metabólico</text>

  <rect x="360" y="130" width="240" height="100" rx="10" fill="#10202c" stroke="#3a7bd5"/>
  <text x="480" y="156" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">PaCO₂ — o denominador</text>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="#cdd9e3">regulado pelo PULMÃO (rápido)</text>
  <text x="480" y="202" text-anchor="middle" font-size="11" fill="#cdd9e3">↑ PaCO₂ → pH↓ (acidose)</text>
  <text x="480" y="220" text-anchor="middle" font-size="10" fill="#9fb1c0">componente respiratório</text>

  <text x="340" y="262" text-anchor="middle" font-size="11" fill="#e8a13a">compensar = mover o outro termo na mesma direção para devolver a RAZÃO ao normal</text>
  <text x="340" y="282" text-anchor="middle" font-size="9" fill="#9fb1c0">por isso pH normal NÃO exclui distúrbio: dois erros opostos mantêm a razão</text>
</svg>

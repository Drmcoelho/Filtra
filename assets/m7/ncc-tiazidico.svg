<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Tiazídico — a chave do NCC (uma porta menor que a do NKCC2)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">hidroclorotiazida 12,5–50 mg · clortalidona 12,5–25 mg · indapamida 1,5–2,5 mg</text>

  <circle cx="120" cy="150" r="40" fill="#16202a" stroke="#39c0c8" stroke-width="2"/>
  <text x="120" y="146" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">NCC</text>
  <text x="120" y="162" text-anchor="middle" font-size="9" fill="#e08a96">bloqueado</text>
  <line x1="98" y1="128" x2="142" y2="172" stroke="#e0556b" stroke-width="3"/>

  <g font-size="11" fill="#e7eef4">
    <rect x="200" y="84" width="440" height="34" rx="6" fill="#10202c" stroke="#52c08a"/><text x="216" y="106">natriurese de TETO BAIXO → 1ª linha na hipertensão</text>
    <rect x="200" y="124" width="440" height="34" rx="6" fill="#10202c" stroke="#d0c08a"/><text x="216" y="146">RETÉM Ca²⁺ (hipocalciúria) → litíase cálcica, osteoporose</text>
    <rect x="200" y="164" width="440" height="34" rx="6" fill="#10202c" stroke="#e8a13a"/><text x="216" y="186">hipoK, hipoNa, hiperCa leve, hiperuricemia, hiperglicemia</text>
    <rect x="200" y="204" width="440" height="34" rx="6" fill="#10202c" stroke="#e0556b"/><text x="216" y="226">perde eficácia na TFG &lt; 30 (≠ diurético de alça)</text>
  </g>
  <text x="120" y="240" text-anchor="middle" font-size="9" fill="#9fb1c0">clortalidona: meia-vida longa, mais potente</text>
</svg>

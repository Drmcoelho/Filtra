<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Potência ≠ eficácia — os três diuréticos de alça</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">mesmo teto (eficácia); doses diferentes (potência): a curva só desliza na horizontal</text>

  <g font-size="11" fill="#e7eef4">
    <rect x="40" y="66" width="600" height="62" rx="8" fill="#10202c" stroke="#3a7bd5"/>
    <text x="56" y="90" font-weight="bold" fill="#9bbef0">Furosemida</text>
    <text x="56" y="112" fill="#cdd9e3">20–80 mg (até 200+ na insuficiência renal) · referência 1× · meia-vida curta</text>

    <rect x="40" y="136" width="600" height="62" rx="8" fill="#10202c" stroke="#52c08a"/>
    <text x="56" y="160" font-weight="bold" fill="#8fe0b0">Bumetanida</text>
    <text x="56" y="182" fill="#cdd9e3">0,5–2 mg · ≈40× mais potente · boa absorção oral (útil se a furosemida falha)</text>

    <rect x="40" y="206" width="600" height="62" rx="8" fill="#10202c" stroke="#e8a13a"/>
    <text x="56" y="230" font-weight="bold" fill="#f0c078">Torasemida</text>
    <text x="56" y="252" fill="#cdd9e3">10–20 mg · ≈2–3× a furosemida · meia-vida maior (dose única diária)</text>
  </g>
</svg>

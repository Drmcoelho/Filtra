<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A compensação esperada — a fórmula de Winter</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">na acidose metabólica: PaCO₂ esperado = 1,5 · HCO₃⁻ + 8 (±2). Comparar com o medido revela o misto</text>

  <text x="340" y="86" text-anchor="middle" font-size="18" fill="#e7eef4">PaCO₂ esperado = 1,5 · HCO₃⁻ + 8</text>

  <rect x="40" y="112" width="195" height="140" rx="10" fill="#10202c" stroke="#f0c078"/>
  <text x="137" y="136" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">PaCO₂ &gt; esperado</text>
  <text x="137" y="164" text-anchor="middle" font-size="11" fill="#e7eef4">não baixou o CO₂</text>
  <text x="137" y="184" text-anchor="middle" font-size="11" fill="#e7eef4">o quanto deveria</text>
  <text x="137" y="214" text-anchor="middle" font-size="11" fill="#cdd9e3">→ acidose respiratória</text>
  <text x="137" y="232" text-anchor="middle" font-size="11" fill="#cdd9e3">SOMADA</text>

  <rect x="243" y="112" width="195" height="140" rx="10" fill="#0c2a30" stroke="#52c08a"/>
  <text x="340" y="136" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">PaCO₂ ≈ esperado</text>
  <text x="340" y="168" text-anchor="middle" font-size="11" fill="#e7eef4">o pulmão compensou</text>
  <text x="340" y="188" text-anchor="middle" font-size="11" fill="#e7eef4">adequadamente</text>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#cdd9e3">→ acidose metabólica</text>
  <text x="340" y="238" text-anchor="middle" font-size="11" fill="#cdd9e3">simples</text>

  <rect x="446" y="112" width="195" height="140" rx="10" fill="#10202c" stroke="#3a7bd5"/>
  <text x="543" y="136" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">PaCO₂ &lt; esperado</text>
  <text x="543" y="164" text-anchor="middle" font-size="11" fill="#e7eef4">baixou o CO₂</text>
  <text x="543" y="184" text-anchor="middle" font-size="11" fill="#e7eef4">mais que o esperado</text>
  <text x="543" y="214" text-anchor="middle" font-size="11" fill="#cdd9e3">→ alcalose respiratória</text>
  <text x="543" y="232" text-anchor="middle" font-size="11" fill="#cdd9e3">SOMADA</text>

  <text x="340" y="282" text-anchor="middle" font-size="10" fill="#e8a13a">o engine calcula o Winter e aponta o componente respiratório somado (ex.: sepse com lactato + taquipneia)</text>
</svg>

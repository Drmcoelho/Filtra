<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A barreira filtra por TAMANHO e por CARGA</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">duas peneiras em série: o poro (tamanho) e o glicocálice aniônico (carga)</text>

  <!-- peneira de tamanho -->
  <rect x="40" y="64" width="290" height="232" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="185" y="88" text-anchor="middle" font-size="13" fill="#9bbef0" font-weight="bold">TAMANHO (o poro)</text>
  <circle cx="90" cy="130" r="7" fill="#52c08a"/><text x="120" y="134" font-size="11" fill="#e7eef4">pequena (inulina) → passa</text>
  <circle cx="90" cy="170" r="14" fill="#e8a13a"/><text x="120" y="174" font-size="11" fill="#e7eef4">média (albumina) → limítrofe</text>
  <circle cx="90" cy="214" r="22" fill="#e0556b"/><text x="130" y="218" font-size="11" fill="#e7eef4">grande (IgG) → barrada</text>
  <text x="185" y="270" text-anchor="middle" font-size="10" fill="#9fb1c0">dano (podócito/MBG) → poros maiores</text>
  <text x="185" y="284" text-anchor="middle" font-size="10" fill="#9fb1c0">→ vaza o grande (não-seletiva)</text>

  <!-- peneira de carga -->
  <rect x="350" y="64" width="290" height="232" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="495" y="88" text-anchor="middle" font-size="13" fill="#e08a96" font-weight="bold">CARGA (o glicocálice −)</text>
  <line x1="380" y1="110" x2="380" y2="270" stroke="#e0556b" stroke-width="3"/>
  <text x="392" y="116" font-size="10" fill="#e08a96">parede aniônica (−)</text>
  <circle cx="430" cy="150" r="11" fill="#e0556b"/><text x="430" y="154" text-anchor="middle" font-size="9" fill="#fff">−</text><text x="455" y="154" font-size="11" fill="#e7eef4">ânion (albumina) → repelido</text>
  <circle cx="430" cy="200" r="11" fill="#9fb1c0"/><text x="455" y="204" font-size="11" fill="#e7eef4">neutro → passa pelo tamanho</text>
  <circle cx="430" cy="250" r="11" fill="#3a7bd5"/><text x="430" y="254" text-anchor="middle" font-size="9" fill="#fff">+</text><text x="455" y="254" font-size="11" fill="#e7eef4">cátion → atraído (passa +)</text>
  <text x="495" y="284" text-anchor="middle" font-size="10" fill="#e8a13a">perder a carga → albumina vaza (seletiva)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Síndrome NEFRÓTICA × NEFRÍTICA</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">vazamento da barreira (proteína) × inflamação do glomérulo (sangue)</text>

  <rect x="24" y="60" width="312" height="216" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="180" y="84" text-anchor="middle" font-size="13" fill="#f0c078" font-weight="bold">NEFRÓTICA (a barreira vaza)</text>
  <text x="40" y="112" font-size="11" fill="#e7eef4">• proteinúria maciça (&gt; 3,5 g/dia)</text>
  <text x="40" y="136" font-size="11" fill="#e7eef4">• hipoalbuminemia → edema</text>
  <text x="40" y="160" font-size="11" fill="#e7eef4">• hiperlipidemia · lipidúria</text>
  <text x="40" y="184" font-size="11" fill="#e7eef4">• sedimento "limpo" (sem sangue)</text>
  <text x="40" y="212" font-size="10" fill="#9fb1c0">ex.: lesão mínima, GESF, membranosa</text>
  <text x="40" y="240" font-size="10" fill="#9fb1c0">mecanismo: perda de carga/tamanho</text>

  <rect x="344" y="60" width="312" height="216" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="500" y="84" text-anchor="middle" font-size="13" fill="#e08a96" font-weight="bold">NEFRÍTICA (o glomérulo inflama)</text>
  <text x="360" y="112" font-size="11" fill="#e7eef4">• hematúria (cilindros hemáticos)</text>
  <text x="360" y="136" font-size="11" fill="#e7eef4">• proteinúria leve/moderada</text>
  <text x="360" y="160" font-size="11" fill="#e7eef4">• hipertensão + oligúria</text>
  <text x="360" y="184" font-size="11" fill="#e7eef4">• TFG↓ (Kf↓ pela inflamação)</text>
  <text x="360" y="212" font-size="10" fill="#9fb1c0">ex.: GN pós-infecciosa, IgA</text>
  <text x="360" y="240" font-size="10" fill="#9fb1c0">mecanismo: proliferação/crescentes</text>
</svg>

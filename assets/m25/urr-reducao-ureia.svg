<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0f1620" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <rect x="20" y="16" width="56" height="24" rx="4" fill="#39c0c8"/>
  <text x="48" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#05181a">M25</text>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#9fb1c0">URR = (1 − R)·100 — a queda da ureia na sessão</text>
  <!-- pre bar -->
  <rect x="120" y="70" width="90" height="180" rx="4" fill="#e0556b" fill-opacity="0.5" stroke="#e0556b"/>
  <text x="165" y="265" text-anchor="middle" font-size="12" fill="#9fb1c0">ureia PRÉ</text>
  <text x="165" y="60" text-anchor="middle" font-size="12" fill="#e7eef4">150 mg/dL</text>
  <!-- post bar (R=0.32) -->
  <rect x="350" y="192" width="90" height="58" rx="4" fill="#52c08a" fill-opacity="0.5" stroke="#52c08a"/>
  <text x="395" y="265" text-anchor="middle" font-size="12" fill="#9fb1c0">ureia PÓS</text>
  <text x="395" y="182" text-anchor="middle" font-size="12" fill="#e7eef4">48 mg/dL</text>
  <!-- arrow -->
  <line x1="225" y1="160" x2="335" y2="160" stroke="#39c0c8" stroke-width="2"/>
  <polygon points="335,160 322,153 322,167" fill="#39c0c8"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#39c0c8">difusão</text>
  <!-- R + URR -->
  <text x="490" y="120" font-size="13" fill="#9fb1c0">R = pós/pré = 0,32</text>
  <text x="490" y="150" font-size="16" font-weight="bold" fill="#52c08a">URR = 68%</text>
  <text x="490" y="178" font-size="11" fill="#9fb1c0">alvo ≥ 65%</text>
  <text x="490" y="210" font-size="11" fill="#9fb1c0">leitura crua,</text>
  <text x="490" y="226" font-size="11" fill="#9fb1c0">sem cálculo;</text>
  <text x="490" y="242" font-size="11" fill="#9fb1c0">anda junto do Kt/V</text>
</svg>

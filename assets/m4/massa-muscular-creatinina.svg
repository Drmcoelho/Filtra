<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A mentira da massa: creatinina "normal" com TFG baixa</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a creatinina vem do músculo; pouca massa → pouca produção → Pcr baixa</text>

  <!-- jovem musculoso -->
  <rect x="40" y="64" width="290" height="210" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="185" y="88" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">Jovem musculoso</text>
  <text x="185" y="118" text-anchor="middle" font-size="11" fill="#e7eef4">muita massa → produção alta</text>
  <text x="185" y="146" text-anchor="middle" font-size="11" fill="#e7eef4">TFG normal (120)</text>
  <text x="185" y="178" text-anchor="middle" font-size="13" fill="#cfe0ff" font-weight="bold">creatinina ~1,1 mg/dL</text>
  <text x="185" y="210" text-anchor="middle" font-size="10" fill="#9fb1c0">"levemente alta", mas TFG ótima</text>
  <text x="185" y="244" text-anchor="middle" font-size="10" fill="#9fb1c0">→ não confundir com doença renal</text>

  <!-- idoso sarcopênico -->
  <rect x="350" y="64" width="290" height="210" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="495" y="88" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">Idoso sarcopênico</text>
  <text x="495" y="118" text-anchor="middle" font-size="11" fill="#e7eef4">pouca massa → produção baixa</text>
  <text x="495" y="146" text-anchor="middle" font-size="11" fill="#e7eef4">TFG BAIXA (40)</text>
  <text x="495" y="178" text-anchor="middle" font-size="13" fill="#ffd0d6" font-weight="bold">creatinina ~1,0 mg/dL</text>
  <text x="495" y="210" text-anchor="middle" font-size="10" fill="#f0c078">"normal" — mas a TFG é só 40!</text>
  <text x="495" y="244" text-anchor="middle" font-size="10" fill="#9fb1c0">a creatinina MENTE → use eGFR/cistatina</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Inulina — o padrão-ouro da TFG (e a fórmula do clearance)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">livremente filtrada, NÃO secretada nem reabsorvida → clearance = TFG exata</text>

  <rect x="180" y="60" width="320" height="34" rx="6" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="83" text-anchor="middle" font-size="15" fill="#e7eef4">C = (U · V̇) / P</text>

  <rect x="40" y="110" width="190" height="80" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="135" y="134" text-anchor="middle" font-size="12" fill="#8fe0b0" font-weight="bold">filtra 100%</text>
  <text x="135" y="156" text-anchor="middle" font-size="10" fill="#cdd9e3">pequena, neutra</text>
  <text x="135" y="174" text-anchor="middle" font-size="10" fill="#9fb1c0">(θ ≈ 1, ver M3)</text>

  <rect x="245" y="110" width="190" height="80" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="340" y="134" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">não secreta</text>
  <text x="340" y="156" text-anchor="middle" font-size="10" fill="#cdd9e3">não reabsorve</text>
  <text x="340" y="174" text-anchor="middle" font-size="10" fill="#9fb1c0">o que filtra = o que sai</text>

  <rect x="450" y="110" width="190" height="80" rx="8" fill="#10202c" stroke="#39c0c8"/>
  <text x="545" y="134" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">C = TFG exata</text>
  <text x="545" y="156" text-anchor="middle" font-size="10" fill="#cdd9e3">o "padrão-ouro"</text>
  <text x="545" y="174" text-anchor="middle" font-size="10" fill="#9fb1c0">(pesquisa; pouco prático)</text>

  <text x="340" y="222" text-anchor="middle" font-size="11" fill="#e7eef4">U = conc. urinária · V̇ = fluxo urinário (mL/min) · P = conc. plasmática</text>
  <text x="340" y="250" text-anchor="middle" font-size="10" fill="#9fb1c0">na prática usa-se a creatinina (coleta 24 h) — mais fácil, mas com as três mentiras</text>
  <text x="340" y="276" text-anchor="middle" font-size="10" fill="#9fb1c0">alternativas: iohexol, ⁵¹Cr-EDTA (também filtrados e não secretados)</text>
</svg>

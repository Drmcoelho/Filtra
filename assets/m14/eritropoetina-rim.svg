    <style>
      .t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eef5f4}.dim{fill:#aac0c4}.h{font-weight:800}.title{font-size:46px}.sub{font-size:21px}.m{font-size:24px}.s{font-size:18px}.xs{font-size:15px}.panel{fill:#101d27;stroke:#36505f;stroke-width:2}.panel2{fill:#152631;stroke:#36505f;stroke-width:2}.flow{fill:none;stroke:#55cbd3;stroke-width:4;marker-end:url(#arrow-cyan)}.goldflow{fill:none;stroke:#e3ad4f;stroke-width:4;marker-end:url(#arrow-gold)}.redflow{fill:none;stroke:#e26464;stroke-width:4;marker-end:url(#arrow-red)}.greenflow{fill:none;stroke:#68c58a;stroke-width:4;marker-end:url(#arrow-green)}
    </style>

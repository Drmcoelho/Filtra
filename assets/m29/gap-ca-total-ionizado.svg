<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0d1b16" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a7a4a" stroke-width="2"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#bfe9cf">O gap Ca total / Ca ionizado — a pista do acúmulo</text>
  <!-- normal -->
  <g>
    <text x="160" y="62" text-anchor="middle" font-size="13" fill="#8fe0b0">NORMAL (razão ~2,0)</text>
    <rect x="110" y="80" width="100" height="36" fill="#52c08a" fill-opacity="0.35" stroke="#52c08a"/><text x="160" y="103" text-anchor="middle" font-size="11" fill="#cfe9da">total 2,3</text>
    <rect x="120" y="130" width="80" height="36" fill="#39c08a" fill-opacity="0.5" stroke="#39c08a"/><text x="160" y="153" text-anchor="middle" font-size="11" fill="#0d1b16">ioniz. 1,15</text>
  </g>
  <!-- acúmulo -->
  <g>
    <text x="470" y="62" text-anchor="middle" font-size="13" fill="#e0556b">ACÚMULO (razão > 2,5)</text>
    <rect x="410" y="80" width="120" height="48" fill="#e0556b" fill-opacity="0.35" stroke="#e0556b"/><text x="470" y="108" text-anchor="middle" font-size="11" fill="#f0c5cf">total 3,2 ↑</text>
    <rect x="438" y="142" width="64" height="28" fill="#a04a5a" fill-opacity="0.6" stroke="#e0556b"/><text x="470" y="161" text-anchor="middle" font-size="11" fill="#f0c5cf">ioniz. 0,9 ↓</text>
  </g>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#f0c98a">citrato preso ao Ca conta no TOTAL, mas o IONIZADO cai</text>
  <text x="320" y="248" text-anchor="middle" font-size="13" fill="#e0556b">razão total/ionizado > 2,5 = ALARME de acúmulo de citrato</text>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="#6fae8a">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Kf tem dois fatores — e derruba a TFG sem tocar nas pressões</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">Kf = permeabilidade hidráulica (k) × superfície de filtração (S)</text>

  <!-- equação central -->
  <rect x="160" y="60" width="360" height="34" rx="6" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="83" text-anchor="middle" font-size="14" fill="#e7eef4">TFG = Kf · (P_GC − P_BC − π_GC) = Kf · NFP</text>

  <!-- k -->
  <rect x="60" y="110" width="250" height="80" rx="8" fill="#10202c" stroke="#39c0c8"/>
  <text x="185" y="134" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">k · permeabilidade</text>
  <text x="185" y="156" text-anchor="middle" font-size="10" fill="#cdd9e3">porosidade da barreira por área</text>
  <text x="185" y="174" text-anchor="middle" font-size="10" fill="#9fb1c0">(fenestras + MBG + fendas)</text>

  <!-- S -->
  <rect x="370" y="110" width="250" height="80" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="495" y="134" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">S · superfície</text>
  <text x="495" y="156" text-anchor="middle" font-size="10" fill="#cdd9e3">área total de capilar disponível</text>
  <text x="495" y="174" text-anchor="middle" font-size="10" fill="#9fb1c0">o MESÂNGIO contrai/relaxa → muda S</text>

  <rect x="120" y="214" width="440" height="62" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="340" y="236" text-anchor="middle" font-size="11" fill="#e7eef4">Glomerulonefrite, contração mesangial, perda de néfrons → S↓ (ou k↓)</text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#f0c078">→ Kf↓ → TFG↓ com P_GC, P_BC e π_GC INALTERADAS</text>
  <text x="340" y="272" text-anchor="middle" font-size="9" fill="#9fb1c0">a quarta alavanca da TFG, além das três pressões (M1)</text>
</svg>

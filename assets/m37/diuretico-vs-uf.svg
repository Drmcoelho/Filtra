<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Arial,sans-serif">
  <rect width="640" height="360" fill="#0d141b"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Diurético × UF mecânica — quando o túbulo falha</text>
  <rect x="50" y="60" width="250" height="250" rx="10" fill="#52c08a" fill-opacity="0.08" stroke="#52c08a"/>
  <text x="175" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#52c08a">DIURÉTICO (1ª linha)</text>
  <text x="70" y="120" font-size="12" fill="#e7eef4">• age PELO néfron (alça/NKCC2)</text>
  <text x="70" y="146" font-size="12" fill="#e7eef4">• depende da entrega + resposta</text>
  <text x="70" y="172" font-size="12" fill="#e7eef4">• ajusta eletrólitos (faz o rim)</text>
  <text x="70" y="198" font-size="12" fill="#e8a13a">• FALHA na resistência/refratário</text>
  <text x="70" y="224" font-size="12" fill="#9fb1c0">• sem acesso/anticoagulação</text>
  <text x="175" y="270" text-anchor="middle" font-size="11" fill="#52c08a">curva desloca à direita → teto</text>
  <defs><marker id="g1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#e8a13a"/></marker></defs>
  <line x1="305" y1="185" x2="338" y2="185" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#g1)"/>
  <text x="322" y="175" text-anchor="middle" font-size="10" fill="#e8a13a">falhou</text>
  <rect x="345" y="60" width="250" height="250" rx="10" fill="#39c0c8" fill-opacity="0.08" stroke="#39c0c8"/>
  <text x="470" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#39c0c8">UF MECÂNICA (resgate)</text>
  <text x="365" y="120" font-size="12" fill="#e7eef4">• remove volume DIRETO (TMP)</text>
  <text x="365" y="146" font-size="12" fill="#e7eef4">• taxa fixa mL/h, independe túbulo</text>
  <text x="365" y="172" font-size="12" fill="#e8a13a">• NÃO ajusta eletrólitos finos</text>
  <text x="365" y="198" font-size="12" fill="#e0556b">• exige acesso + anticoagulação</text>
  <text x="365" y="224" font-size="12" fill="#9fb1c0">• UF deve ficar &lt; refilling</text>
  <text x="470" y="270" text-anchor="middle" font-size="11" fill="#39c0c8">resgata, mas não substitui o rim</text>
  <text x="320" y="340" text-anchor="middle" font-size="10" fill="#5f7384">FILTRA · DIALISA · M37 — diuréticos × UF (ponte M23/M24/M38)</text>
</svg>

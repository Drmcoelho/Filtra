<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O ramo espesso é o "segmento diluidor"</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">tira NaCl mas não a água → o fluido que segue fica DILUÍDO (hipotônico)</text>

  <!-- tubo com osmolaridade caindo -->
  <rect x="60" y="120" width="560" height="40" rx="8" fill="#3a214a" fill-opacity="0.3" stroke="#a06ad0"/>
  <text x="90" y="110" font-size="10" fill="#9fb1c0">entra (~300, isosmótico)</text>
  <text x="560" y="110" font-size="10" fill="#9fb1c0">sai (~100, hipotônico)</text>
  <g fill="#39c0c8"><text x="120" y="145" font-size="11">NaCl</text><text x="260" y="145" font-size="11">NaCl</text><text x="400" y="145" font-size="11">NaCl</text></g>
  <g stroke="#e0556b" stroke-width="2"><line x1="140" y1="120" x2="140" y2="96"/><line x1="280" y1="120" x2="280" y2="96"/><line x1="420" y1="120" x2="420" y2="96"/></g>
  <text x="280" y="90" text-anchor="middle" font-size="9" fill="#e08a96">NaCl sai (NKCC2) · água NÃO</text>

  <rect x="120" y="190" width="440" height="80" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="214" text-anchor="middle" font-size="11" fill="#e7eef4">Por isso o diurético de alça impede a DILUIÇÃO máxima</text>
  <text x="340" y="236" text-anchor="middle" font-size="11" fill="#e8a13a">(e a concentração também) → urina tende à isostenúria (~300)</text>
  <text x="340" y="258" text-anchor="middle" font-size="10" fill="#9fb1c0">risco: hiponatremia menos comum que com tiazídico (que age no diluidor distal, M7)</text>
</svg>

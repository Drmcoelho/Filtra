<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,Segoe UI,Arial">
  <rect width="480" height="300" fill="#0a1016"/>
  <text x="240" y="24" fill="#39c0c8" font-size="15" font-weight="bold" text-anchor="middle">Mesma dose, menos estresse por hora</text>
  <!-- HDI gradient drop steep -->
  <text x="125" y="56" fill="#52c08a" font-size="12" font-weight="bold" text-anchor="middle">HDI</text>
  <line x1="50" y1="80" x2="200" y2="80" stroke="#3a4a58"/>
  <line x1="50" y1="80" x2="50" y2="210" stroke="#3a4a58"/>
  <path d="M50 90 Q 70 200 200 205" stroke="#52c08a" stroke-width="2.5" fill="none"/>
  <text x="125" y="228" fill="#9fb1c0" font-size="9" text-anchor="middle">soluto despenca rápido</text>
  <text x="60" y="100" fill="#e0556b" font-size="9">estresse osmótico ALTO</text>
  <!-- SLED gradient drop gentle -->
  <text x="355" y="56" fill="#39c0c8" font-size="12" font-weight="bold" text-anchor="middle">SLED</text>
  <line x1="280" y1="80" x2="455" y2="80" stroke="#3a4a58"/>
  <line x1="280" y1="80" x2="280" y2="210" stroke="#3a4a58"/>
  <path d="M280 90 Q 360 150 455 200" stroke="#39c0c8" stroke-width="2.5" fill="none"/>
  <text x="368" y="228" fill="#9fb1c0" font-size="9" text-anchor="middle">soluto desce devagar</text>
  <text x="300" y="100" fill="#52c08a" font-size="9">estresse osmótico BAIXO</text>
  <!-- shared endpoint -->
  <text x="240" y="258" fill="#e8a13a" font-size="11" text-anchor="middle">ambas chegam ao MESMO ponto final (Kt total igual)</text>
  <text x="240" y="278" fill="#9fb1c0" font-size="10" text-anchor="middle">a SLED só evita o gradiente abrupto entre sangue e cérebro</text>
</svg>

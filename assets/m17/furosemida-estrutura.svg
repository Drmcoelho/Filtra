<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">As classes e suas potências — equivalências de dose</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">dentro da classe da alça, a potência difere; a curva dose-resposta é a mesma forma, deslocada</text>

  <g font-size="11">
    <rect x="24" y="60" width="632" height="28" fill="#10202c" stroke="#283642"/>
    <text x="40" y="79" fill="#9fb1c0">Fármaco (alça)</text><text x="300" y="79" fill="#9fb1c0">Dose VO típica</text><text x="500" y="79" fill="#9fb1c0">Potência relativa</text>

    <rect x="24" y="88" width="632" height="30" fill="#0c2330"/>
    <text x="40" y="108" fill="#9fe3ec">furosemida</text><text x="300" y="108" fill="#e7eef4">20–80 mg</text><text x="500" y="108" fill="#e7eef4">1×</text>
    <rect x="24" y="118" width="632" height="30" fill="#10202c"/>
    <text x="40" y="138" fill="#9fe3ec">bumetanida</text><text x="300" y="138" fill="#e7eef4">0,5–2 mg</text><text x="500" y="138" fill="#e7eef4">≈ 40×</text>
    <rect x="24" y="148" width="632" height="30" fill="#0c2330"/>
    <text x="40" y="168" fill="#9fe3ec">torasemida</text><text x="300" y="168" fill="#e7eef4">10–20 mg</text><text x="500" y="168" fill="#e7eef4">≈ 2–4× · meia-vida longa</text>
  </g>

  <rect x="40" y="190" width="600" height="62" rx="8" fill="#10202c" stroke="#39c0c8"/>
  <text x="56" y="212" font-size="11" fill="#9fe3ec">biodisponibilidade VO: furosemida ~50% (variável) · bumetanida/torasemida ~80–100%</text>
  <text x="56" y="232" font-size="10" fill="#cdd9e3">por isso a conversão VO→IV importa: ~2:1 na furosemida (40 mg VO ≈ 20 mg IV)</text>
  <text x="56" y="248" font-size="9" fill="#9fb1c0">todas agem no NKCC2 do ramo espesso (mesmo alvo, potências/PK diferentes)</text>

  <text x="340" y="284" text-anchor="middle" font-size="9" fill="#e8a13a">"trocar de alça" raramente resolve resistência — entender a curva e a entrega resolve</text>
</svg>

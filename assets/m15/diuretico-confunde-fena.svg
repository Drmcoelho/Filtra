<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0556b"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O diurético engana a FE_Na — use a FE_ureia</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o diurético força natriurese; a FE_Na sobe mesmo numa pré-renal verdadeira</text>

  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#9fe3ec">pré-renal SEM diurético</text>
  <rect x="90" y="90" width="160" height="40" rx="6" fill="#10202c" stroke="#52c08a"/>
  <text x="170" y="115" text-anchor="middle" font-size="12" fill="#9fe3ec">FE_Na 0,4% ✓ (pré-renal)</text>

  <text x="510" y="78" text-anchor="middle" font-size="11" fill="#e08a96">a MESMA pré-renal COM diurético</text>
  <rect x="430" y="90" width="160" height="40" rx="6" fill="#10202c" stroke="#e0556b"/>
  <text x="510" y="115" text-anchor="middle" font-size="12" fill="#e08a96">FE_Na 2,2% ✗ (parece NTA!)</text>
  <line x1="250" y1="110" x2="430" y2="110" stroke="#e0556b" stroke-width="2" marker-end="url(#a)"/>
  <text x="340" y="104" text-anchor="middle" font-size="9" fill="#f0c078">o diurético empurra a FE_Na para cima</text>

  <rect x="120" y="160" width="440" height="70" rx="10" fill="#0c2330" stroke="#39c0c8"/>
  <text x="340" y="184" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">A solução: FE_ureia</text>
  <text x="340" y="206" text-anchor="middle" font-size="11" fill="#e7eef4">a ureia é reabsorvida no proximal — o diurético (que age depois) não a confunde</text>
  <text x="340" y="224" text-anchor="middle" font-size="11" fill="#9fe3ec">FE_ureia &lt; 35% → continua dizendo pré-renal, mesmo sob diurético</text>

  <text x="340" y="262" text-anchor="middle" font-size="11" fill="#e8a13a">no Lab, ligue o "diurético" e veja a FE_Na disparar enquanto a FE_ureia se mantém baixa</text>
  <text x="340" y="284" text-anchor="middle" font-size="9" fill="#9fb1c0">o engine troca automaticamente o índice de decisão para a FE_ureia quando há diurético</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Uma chave para cada fechadura — os alvos no néfron</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#9fb1c0">cada classe age num segmento e num transportador; as doses vêm com unidade e mecanismo</text>

  <!-- túbulo estilizado -->
  <path d="M70,70 H300 a40,40 0 0 1 0,80 H140 a40,40 0 0 0 0,80 H610" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <line x1="80" y1="70" x2="100" y2="70" stroke="#39c0c8" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="10">
    <rect x="70" y="250" width="150" height="58" rx="6" fill="#10202c" stroke="#52c08a"/>
    <text x="80" y="268" fill="#9fe3ec" font-weight="bold">TCP · anidrase carbônica</text>
    <text x="80" y="284" fill="#e7eef4">acetazolamida 250–500 mg</text>
    <text x="80" y="300" fill="#9fb1c0">(+ SGLT2i, manitol)</text>

    <rect x="228" y="250" width="150" height="58" rx="6" fill="#10202c" stroke="#39c0c8"/>
    <text x="238" y="268" fill="#9fe3ec" font-weight="bold">alça · NKCC2</text>
    <text x="238" y="284" fill="#e7eef4">furosemida 20–80 mg</text>
    <text x="238" y="300" fill="#9fb1c0">bumetanida / torasemida</text>

    <rect x="386" y="250" width="140" height="58" rx="6" fill="#10202c" stroke="#e8a13a"/>
    <text x="396" y="268" fill="#f0c078" font-weight="bold">TCD · NCC</text>
    <text x="396" y="284" fill="#e7eef4">HCTZ 12,5–50 mg</text>
    <text x="396" y="300" fill="#9fb1c0">clortalidona / indapamida</text>

    <rect x="534" y="250" width="120" height="58" rx="6" fill="#10202c" stroke="#e0556b"/>
    <text x="544" y="268" fill="#e08a96" font-weight="bold">ducto · ENaC/MR</text>
    <text x="544" y="284" fill="#e7eef4">amilorida 5–10 mg</text>
    <text x="544" y="300" fill="#9fb1c0">espironolactona 25–100 mg</text>
  </g>

  <!-- conectores -->
  <line x1="150" y1="150" x2="150" y2="250" stroke="#52c08a" stroke-dasharray="3 3"/>
  <line x1="300" y1="105" x2="300" y2="250" stroke="#39c0c8" stroke-dasharray="3 3"/>
  <line x1="450" y1="230" x2="450" y2="250" stroke="#e8a13a" stroke-dasharray="3 3"/>
  <line x1="590" y1="230" x2="590" y2="250" stroke="#e0556b" stroke-dasharray="3 3"/>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#e8a13a">65% do Na sai no TCP; a alça é o teto alto; o distal faz o ajuste fino</text>
</svg>

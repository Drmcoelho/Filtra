<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Georgia,serif">
  <rect width="640" height="360" fill="#0a1016"/>
  <rect x="2" y="2" width="636" height="356" rx="6" fill="none" stroke="#283642" stroke-width="2"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Metanol e etilenoglicol: a via tóxica e o duplo bloqueio</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#9fb1c0">o álcool-pai é pouco tóxico; o metabólito mata — fomepizol trava a enzima, HD remove tudo</text>
  <defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb1c0"/></marker></defs>

  <!-- linha metanol -->
  <rect x="40" y="90" width="120" height="46" rx="8" fill="#39c0c8" opacity="0.12" stroke="#39c0c8"/>
  <text x="100" y="112" text-anchor="middle" font-size="13" fill="#39c0c8" font-weight="bold">METANOL</text>
  <text x="100" y="128" text-anchor="middle" font-size="9" fill="#9fb1c0">PM 32 · Vd 0,6</text>
  <line x1="160" y1="113" x2="240" y2="113" stroke="#9fb1c0" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="9" fill="#e8a13a">ADH</text>
  <rect x="244" y="90" width="130" height="46" rx="8" fill="#e0556b" opacity="0.12" stroke="#e0556b"/>
  <text x="309" y="112" text-anchor="middle" font-size="13" fill="#e0556b" font-weight="bold">FORMATO</text>
  <text x="309" y="128" text-anchor="middle" font-size="9" fill="#9fb1c0">cegueira · acidose</text>

  <!-- linha etilenoglicol -->
  <rect x="40" y="160" width="120" height="46" rx="8" fill="#39c0c8" opacity="0.12" stroke="#39c0c8"/>
  <text x="100" y="182" text-anchor="middle" font-size="12" fill="#39c0c8" font-weight="bold">ETILENO-</text>
  <text x="100" y="197" text-anchor="middle" font-size="11" fill="#39c0c8" font-weight="bold">GLICOL</text>
  <line x1="160" y1="183" x2="240" y2="183" stroke="#9fb1c0" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="9" fill="#e8a13a">ADH</text>
  <rect x="244" y="160" width="130" height="46" rx="8" fill="#e0556b" opacity="0.12" stroke="#e0556b"/>
  <text x="309" y="182" text-anchor="middle" font-size="13" fill="#e0556b" font-weight="bold">OXALATO</text>
  <text x="309" y="197" text-anchor="middle" font-size="9" fill="#9fb1c0">cristais → LRA</text>

  <!-- fomepizol bloqueio -->
  <rect x="180" y="232" width="60" height="40" rx="6" fill="#e8a13a" opacity="0.18" stroke="#e8a13a"/>
  <text x="210" y="252" text-anchor="middle" font-size="11" fill="#e8a13a" font-weight="bold">FOMEP.</text>
  <text x="210" y="266" text-anchor="middle" font-size="9" fill="#9fb1c0">bloqueia ADH</text>
  <line x1="200" y1="232" x2="200" y2="135" stroke="#e8a13a" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="200" y1="232" x2="200" y2="205" stroke="#e8a13a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="150" text-anchor="middle" font-size="13" fill="#e8a13a">✕</text>

  <!-- HD -->
  <rect x="430" y="120" width="160" height="120" rx="10" fill="#52c08a" opacity="0.10" stroke="#52c08a"/>
  <text x="510" y="150" text-anchor="middle" font-size="14" fill="#52c08a" font-weight="bold">HEMODIÁLISE</text>
  <text x="510" y="174" text-anchor="middle" font-size="10" fill="#9fb1c0">remove o álcool-PAI</text>
  <text x="510" y="190" text-anchor="middle" font-size="10" fill="#9fb1c0">remove o METABÓLITO</text>
  <text x="510" y="206" text-anchor="middle" font-size="10" fill="#9fb1c0">corrige a ACIDOSE</text>
  <text x="510" y="226" text-anchor="middle" font-size="10" fill="#52c08a">clearance alto → rápido</text>
  <line x1="374" y1="113" x2="428" y2="150" stroke="#52c08a" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="374" y1="183" x2="428" y2="190" stroke="#52c08a" stroke-width="2" marker-end="url(#ar2)"/>

  <text x="320" y="306" text-anchor="middle" font-size="11" fill="#e7eef4">fomepizol fecha a fábrica do veneno; a HD esvazia o tanque (tóxico + ácido)</text>
  <text x="320" y="330" text-anchor="middle" font-size="10" fill="#9fb1c0">o gap osmolar denuncia o álcool-pai; o ânion-gap, o metabólito</text>
  <text x="320" y="350" text-anchor="middle" font-size="9" fill="#9fb1c0" opacity="0.6">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>

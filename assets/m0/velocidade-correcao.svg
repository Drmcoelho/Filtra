<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A velocidade importa tanto quanto o alvo</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o neurônio se adapta na cronicidade; corrigir rápido demais o lesa</text>

  <!-- crânio helper: três cérebros -->
  <g>
    <text x="130" y="80" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">hipoNa AGUDA</text>
    <ellipse cx="130" cy="140" rx="62" ry="44" fill="none" stroke="#9fb1c0" stroke-width="3"/>
    <ellipse cx="130" cy="140" rx="58" ry="40" fill="#e0556b" fill-opacity="0.5" stroke="#e0556b"/>
    <text x="130" y="200" text-anchor="middle" font-size="10" fill="#e08a96">água entra → edema → hérnia</text>

    <text x="340" y="80" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">hipoNa CRÔNICA (adaptada)</text>
    <ellipse cx="340" cy="140" rx="62" ry="44" fill="none" stroke="#9fb1c0" stroke-width="3"/>
    <ellipse cx="340" cy="140" rx="44" ry="32" fill="#52c08a" fill-opacity="0.45" stroke="#52c08a"/>
    <text x="340" y="200" text-anchor="middle" font-size="10" fill="#8fe0b0">expulsou osmólitos → tamanho normal</text>

    <text x="550" y="80" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">correção RÁPIDA demais</text>
    <ellipse cx="550" cy="140" rx="62" ry="44" fill="none" stroke="#9fb1c0" stroke-width="3"/>
    <ellipse cx="550" cy="140" rx="34" ry="24" fill="#e8a13a" fill-opacity="0.5" stroke="#e8a13a"/>
    <text x="550" y="200" text-anchor="middle" font-size="10" fill="#f0c078">murcha/desmieliniza → mielinólise</text>
  </g>

  <rect x="120" y="232" width="440" height="56" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="340" y="256" text-anchor="middle" font-size="12" fill="#e7eef4">Limite de segurança na correção do Na⁺:</text>
  <text x="340" y="276" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">≤ ~6–8 mmol/L por dia (detalhe e cálculo no M10)</text>
</svg>

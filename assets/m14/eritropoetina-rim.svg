<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">ERITROPOETINA — o rim que sente O₂</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">fibroblastos intersticiais sentem hipóxia (HIF) e mandam fazer hemácias</text>

  <!-- rim sensor -->
  <path d="M70 110 q-34 50 0 100 q44 26 70 -10 q-20 -40 0 -80 q-26 -36 -70 -10 Z" fill="#1b242d" stroke="#e0556b" stroke-width="2"/>
  <text x="96" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#e0556b">RIM</text>
  <circle cx="92" cy="172" r="5" fill="#e8a13a"/>
  <text x="96" y="200" text-anchor="middle" font-size="9" fill="#9fb1c0">fibroblasto</text>
  <text x="96" y="213" text-anchor="middle" font-size="9" fill="#9fb1c0">intersticial</text>

  <!-- sensor O2 -->
  <rect x="160" y="120" width="160" height="60" rx="8" fill="#141b22" stroke="#39c0c8"/>
  <text x="240" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#39c0c8">sensor de O₂ (HIF)</text>
  <text x="240" y="160" text-anchor="middle" font-size="10" fill="#cfdbe6">O₂ baixo (anemia,</text>
  <text x="240" y="174" text-anchor="middle" font-size="10" fill="#cfdbe6">altitude, hipóxia) → liga</text>
  <line x1="126" y1="150" x2="158" y2="150" stroke="#39c0c8" stroke-width="2" marker-end="url(#a)"/>

  <!-- EPO -->
  <line x1="320" y1="150" x2="386" y2="150" stroke="#39c0c8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="388" y="120" width="100" height="60" rx="8" fill="#19303a" stroke="#39c0c8" stroke-width="2"/>
  <text x="438" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#39c0c8">EPO</text>
  <text x="438" y="164" text-anchor="middle" font-size="9" fill="#9fb1c0">hormônio</text>

  <!-- medula -->
  <line x1="488" y1="150" x2="540" y2="150" stroke="#39c0c8" stroke-width="2" marker-end="url(#a)"/>
  <ellipse cx="586" cy="150" rx="40" ry="46" fill="#141b22" stroke="#e0556b"/>
  <text x="586" y="142" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e0556b">medula</text>
  <text x="586" y="156" text-anchor="middle" font-size="9.5" fill="#e0556b">óssea</text>
  <circle cx="574" cy="172" r="6" fill="#e0556b"/><circle cx="592" cy="176" r="6" fill="#e0556b"/>
  <text x="586" y="206" text-anchor="middle" font-size="9" fill="#9fb1c0">hemácias ↑</text>

  <!-- DRC -->
  <rect x="40" y="250" width="560" height="78" rx="8" fill="#1d1116" stroke="#e0556b"/>
  <text x="320" y="272" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e0556b">PÉROLA — anemia da DRC = perda da FÁBRICA de EPO</text>
  <text x="320" y="292" text-anchor="middle" font-size="10.5" fill="#cfdbe6">o rim doente perde os fibroblastos → produz pouca EPO → a medula não recebe ordem → anemia.</text>
  <text x="320" y="310" text-anchor="middle" font-size="10.5" fill="#9fb1c0">trata-se com EPO/ESA exógena (ferro junto). Não é "falta de ferro" — é falta do hormônio (M18).</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#39c0c8"/></marker>
  </defs>
</svg>

  <circle cx="80" cy="100" r="10" fill="#39c0c8"/><text x="80" y="125" text-anchor="middle" font-size="9" fill="#39c0c8">reposição</text>
  <rect x="120" y="78" width="40" height="120" rx="6" fill="#141b22" stroke="#52c08a" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8a13a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Secreção tubular — por que o clearance de creatinina SUPERESTIMA a TFG</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a creatinina é filtrada E secretada; a inulina, só filtrada</text>

  <!-- glomérulo + túbulo -->
  <circle cx="130" cy="150" r="34" fill="#0f3540" stroke="#39c0c8" stroke-width="2"/><text x="130" y="154" text-anchor="middle" font-size="9" fill="#9fe3ec">glomérulo</text>
  <path d="M164,150 q120,0 200,0 q120,0 180,0" fill="none" stroke="#c9a0e0" stroke-width="14" stroke-linecap="round"/>
  <text x="380" y="186" text-anchor="middle" font-size="10" fill="#c9a0e0">túbulo</text>
  <text x="560" y="140" font-size="10" fill="#9fb1c0">urina →</text>

  <!-- filtração -->
  <text x="130" y="100" text-anchor="middle" font-size="10" fill="#52c08a">filtra (inulina + creatinina)</text>
  <line x1="130" y1="116" x2="130" y2="132" stroke="#52c08a" stroke-width="2" marker-end="url(#s)"/>
  <!-- secreção extra de creatinina -->
  <line x1="300" y1="210" x2="300" y2="162" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="380" y1="210" x2="380" y2="162" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="340" y="232" text-anchor="middle" font-size="10" fill="#e8a13a">+ secreção de creatinina (~10–15%)</text>

  <rect x="120" y="252" width="440" height="40" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="270" text-anchor="middle" font-size="11" fill="#e7eef4">Ccr = TFG + secreção ≈ TFG × 1,1–1,15 → Ccr &gt; TFG verdadeira</text>
  <text x="340" y="286" text-anchor="middle" font-size="9" fill="#9fb1c0">(a inulina não é secretada → clearance da inulina = TFG exata)</text>
</svg>

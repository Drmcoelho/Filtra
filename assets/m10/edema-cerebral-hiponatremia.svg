<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">Edema cerebral — o perigo da hiponatremia AGUDA</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">esquema didático (não é TC/RM): plasma hipotônico → água entra no cérebro → ele incha dentro do crânio rígido</text>

  <!-- cranio -->
  <ellipse cx="320" cy="180" rx="150" ry="118" fill="none" stroke="#9fb1c0" stroke-width="6"/>
  <text x="320" y="78" text-anchor="middle" font-size="10" fill="#9fb1c0">crânio (caixa RÍGIDA — não expande)</text>

  <!-- cerebro normal (tracejado) vs inchado -->
  <ellipse cx="320" cy="186" rx="104" ry="84" fill="none" stroke="#52c08a" stroke-dasharray="4 4" stroke-width="1.5"/>
  <ellipse cx="320" cy="186" rx="126" ry="100" fill="#e0556b" fill-opacity="0.16" stroke="#e0556b" stroke-width="2"/>
  <text x="320" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#e0556b">cérebro INCHADO</text>
  <text x="320" y="196" text-anchor="middle" font-size="10" fill="#cfdbe6">tamanho normal (verde tracejado)</text>

  <!-- setas de agua entrando -->
  <line x1="200" y1="140" x2="244" y2="160" stroke="#39c0c8" stroke-width="2" marker-end="url(#c)"/>
  <line x1="200" y1="230" x2="244" y2="212" stroke="#39c0c8" stroke-width="2" marker-end="url(#c)"/>
  <line x1="440" y1="140" x2="396" y2="160" stroke="#39c0c8" stroke-width="2" marker-end="url(#c)"/>
  <line x1="440" y1="230" x2="396" y2="212" stroke="#39c0c8" stroke-width="2" marker-end="url(#c)"/>
  <text x="320" y="232" text-anchor="middle" font-size="9.5" fill="#39c0c8">água entra (osmose) — plasma HIPOtônico</text>

  <!-- explicacao -->
  <rect x="34" y="304" width="572" height="36" rx="8" fill="#141b22" stroke="#e0556b"/>
  <text x="50" y="320" font-size="10.5" fill="#cfdbe6">queda RÁPIDA do Na (&lt;48h) → o cérebro não teve tempo de extruir osmólitos → água entra → herniação.</text>
  <text x="50" y="335" font-size="10.5" fill="#52c08a">conduta: salina hipertônica (NaCl 3%) eleva o Na e puxa a água de volta — a urgência é o EDEMA, não o número.</text>
  <defs>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#39c0c8"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="380" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">Volume × Tonicidade — dois eixos ORTOGONAIS</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o Na TOTAL governa o tamanho da ECF; a NATREMIA é problema de água</text>

  <!-- eixos -->
  <line x1="320" y1="70" x2="320" y2="330" stroke="#3a4a58" stroke-width="1.5"/>
  <line x1="70" y1="200" x2="600" y2="200" stroke="#3a4a58" stroke-width="1.5"/>
  <text x="610" y="204" font-size="11" font-weight="700" fill="#39c0c8" text-anchor="end">VOLUME →</text>
  <text x="100" y="216" font-size="9.5" fill="#9fb1c0">Na TOTAL ↓ (ECF pequena)</text>
  <text x="430" y="216" font-size="9.5" fill="#9fb1c0">Na TOTAL ↑ (ECF grande / edema)</text>
  <text x="330" y="82" font-size="11" font-weight="700" fill="#e8a13a">TONICIDADE ↑</text>
  <text x="330" y="94" font-size="9.5" fill="#9fb1c0">água ↓ → Na sérico ↑ (hiper)</text>
  <text x="330" y="320" font-size="9.5" fill="#9fb1c0">água ↑ → Na sérico ↓ (hipo)</text>

  <!-- quadrantes com exemplos -->
  <rect x="86" y="106" width="216" height="80" rx="8" fill="#141b22" stroke="#283642"/>
  <text x="194" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e8a13a">hipovolemia + hipernatremia</text>
  <text x="194" y="146" text-anchor="middle" font-size="9.5" fill="#cfdbe6">perda de água &gt; sal</text>
  <text x="194" y="162" text-anchor="middle" font-size="9.5" fill="#9fb1c0">desidratação, DI</text>
  <text x="194" y="178" text-anchor="middle" font-size="9" fill="#9fb1c0">VCE↓ e água↓</text>

  <rect x="338" y="106" width="216" height="80" rx="8" fill="#141b22" stroke="#283642"/>
  <text x="446" y="128" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e8a13a">hipervolemia + hipernatremia</text>
  <text x="446" y="146" text-anchor="middle" font-size="9.5" fill="#cfdbe6">ganho de Na &gt; água</text>
  <text x="446" y="162" text-anchor="middle" font-size="9.5" fill="#9fb1c0">salina hipertônica</text>
  <text x="446" y="178" text-anchor="middle" font-size="9" fill="#9fb1c0">ECF↑ e água↓</text>

  <rect x="86" y="214" width="216" height="80" rx="8" fill="#141b22" stroke="#283642"/>
  <text x="194" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#39c0c8">hipovolemia + hiponatremia</text>
  <text x="194" y="254" text-anchor="middle" font-size="9.5" fill="#cfdbe6">perda de sal &gt; água</text>
  <text x="194" y="270" text-anchor="middle" font-size="9.5" fill="#9fb1c0">diurético, perda GI</text>
  <text x="194" y="286" text-anchor="middle" font-size="9" fill="#9fb1c0">VCE↓ e água relativa↑</text>

  <rect x="338" y="214" width="216" height="80" rx="8" fill="#141b22" stroke="#283642"/>
  <text x="446" y="236" text-anchor="middle" font-size="10.5" font-weight="700" fill="#39c0c8">hipervolemia + hiponatremia</text>
  <text x="446" y="254" text-anchor="middle" font-size="9.5" fill="#cfdbe6">ganho de água &gt; sal</text>
  <text x="446" y="270" text-anchor="middle" font-size="9.5" fill="#9fb1c0">ICC, cirrose, SIADH</text>
  <text x="446" y="286" text-anchor="middle" font-size="9" fill="#9fb1c0">ECF↑ e água↑↑</text>

  <text x="320" y="324" text-anchor="middle" font-size="10.5" fill="#52c08a">o mesmo "Na 130" pode estar em QUALQUER coluna — natremia não diz o volume</text>
  <text x="320" y="356" text-anchor="middle" font-size="9.5" fill="#cfdbe6">tratar o NÚMERO Na é erro: corrigir a ÁGUA (eixo vertical, M10), avaliar o VOLUME à parte</text>
  <text x="320" y="374" text-anchor="middle" font-size="9" fill="#5b6b78">FILTRA · M9 — volume (horizontal) e tonicidade (vertical) movem-se de forma independente</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0f1620" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <rect x="20" y="16" width="56" height="24" rx="4" fill="#39c0c8"/>
  <text x="48" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#05181a">M25</text>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#9fb1c0">Kt/V × tempo — sobe e satura; o custo do intermitente</text>
  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="270" stroke="#3a4a58" stroke-width="1.5"/>
  <line x1="70" y1="270" x2="600" y2="270" stroke="#3a4a58" stroke-width="1.5"/>
  <text x="40" y="160" font-size="11" fill="#9fb1c0" transform="rotate(-90 40 160)">Kt/V</text>
  <text x="340" y="295" text-anchor="middle" font-size="11" fill="#9fb1c0">tempo de sessão (h)</text>
  <!-- target line Kt/V 1.2 -->
  <line x1="70" y1="150" x2="600" y2="150" stroke="#52c08a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="595" y="144" text-anchor="end" font-size="11" fill="#52c08a">alvo 1,2</text>
  <!-- curve: rises and saturates -->
  <path d="M70 270 Q 180 130 300 110 T 600 80" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <!-- operating point at 4h above target -->
  <circle cx="300" cy="110" r="6" fill="#52c08a"/>
  <text x="300" y="98" text-anchor="middle" font-size="10" fill="#52c08a">4 h → adequado</text>
  <!-- short session subdose -->
  <circle cx="150" cy="180" r="6" fill="#e0556b"/>
  <text x="150" y="200" text-anchor="middle" font-size="10" fill="#e0556b">2 h → subdose</text>
  <text x="150" y="265" text-anchor="middle" font-size="10" fill="#9fb1c0">2</text>
  <text x="300" y="265" text-anchor="middle" font-size="10" fill="#9fb1c0">4</text>
  <text x="450" y="265" text-anchor="middle" font-size="10" fill="#9fb1c0">6</text>
</svg>

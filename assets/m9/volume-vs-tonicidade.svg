<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Dois eixos distintos: VOLUME (Na) × TONICIDADE (água)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">não confundir — são regulados por sistemas diferentes e tratados de formas diferentes</text>

  <rect x="40" y="70" width="290" height="180" rx="8" fill="#10202c" stroke="#39c0c8"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">VOLUME (este módulo, M9)</text>
  <text x="60" y="122" font-size="11" fill="#e7eef4">• determinado pelo CONTEÚDO de Na⁺</text>
  <text x="60" y="146" font-size="11" fill="#e7eef4">• sensor: VCE (baro/mácula densa)</text>
  <text x="60" y="170" font-size="11" fill="#e7eef4">• reguladores: RAAS, SNS, ANP</text>
  <text x="60" y="196" font-size="11" fill="#e7eef4">• distúrbio: edema / hipovolemia</text>
  <text x="60" y="224" font-size="10" fill="#9fb1c0">trata-se com Na/diuréticos (volume)</text>

  <rect x="350" y="70" width="290" height="180" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">TONICIDADE (M10)</text>
  <text x="370" y="122" font-size="11" fill="#e7eef4">• determinada pela ÁGUA livre</text>
  <text x="370" y="146" font-size="11" fill="#e7eef4">• sensor: osmorreceptores</text>
  <text x="370" y="170" font-size="11" fill="#e7eef4">• reguladores: ADH, sede</text>
  <text x="370" y="196" font-size="11" fill="#e7eef4">• distúrbio: dis/hipernatremia</text>
  <text x="370" y="224" font-size="10" fill="#9fb1c0">trata-se com ÁGUA (M10)</text>

  <text x="340" y="276" text-anchor="middle" font-size="11" fill="#e8a13a">o Na⁺ sérico (concentração) é problema de ÁGUA; o Na⁺ corporal (conteúdo) é o volume</text>
</svg>

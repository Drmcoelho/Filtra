<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0f1620" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#39c0c8" stroke-width="2"/>
  <rect x="20" y="16" width="56" height="24" rx="4" fill="#39c0c8"/>
  <text x="48" y="33" text-anchor="middle" font-size="12" font-weight="bold" fill="#05181a">M25</text>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#9fb1c0">Cinética da ureia — queda exponencial R = e^(−K·t/V)</text>
  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="270" stroke="#3a4a58" stroke-width="1.5"/>
  <line x1="70" y1="270" x2="600" y2="270" stroke="#3a4a58" stroke-width="1.5"/>
  <text x="40" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 40 170)">ureia (mg/dL)</text>
  <text x="340" y="295" text-anchor="middle" font-size="11" fill="#9fb1c0">tempo na sessão (h)</text>
  <!-- exponential decay curve -->
  <path d="M70 80 Q 200 200 340 235 T 600 258" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <circle cx="70" cy="80" r="5" fill="#e0556b"/>
  <text x="95" y="78" font-size="11" fill="#e0556b">PRÉ 150</text>
  <circle cx="340" cy="235" r="5" fill="#52c08a"/>
  <text x="350" y="228" font-size="11" fill="#52c08a">PÓS 48 (4 h)</text>
  <!-- R bracket -->
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#9fb1c0">a inclinação = K/V</text>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#9fb1c0">o tempo encolhe R</text>
  <text x="70" y="265" text-anchor="middle" font-size="10" fill="#9fb1c0">0</text>
  <text x="340" y="265" text-anchor="middle" font-size="10" fill="#9fb1c0">4</text>
</svg>

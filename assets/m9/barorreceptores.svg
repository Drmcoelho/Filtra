<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Os sensores de volume — onde o VCE é "medido"</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">três postos de escuta convertem enchimento em sinal hormonal/nervoso</text>

  <g font-size="11" fill="#e7eef4">
    <rect x="40" y="70" width="600" height="44" rx="8" fill="#10202c" stroke="#e0556b"/>
    <text x="56" y="90" font-weight="bold" fill="#e08a96">1) Baro ARTERIAL (carótida, arco aórtico, arteríola aferente)</text>
    <text x="56" y="108" fill="#cdd9e3">PA/enchimento↓ → SNS↑ e renina↑ → retém Na</text>

    <rect x="40" y="124" width="600" height="44" rx="8" fill="#10202c" stroke="#e8a13a"/>
    <text x="56" y="144" font-weight="bold" fill="#f0c078">2) Mácula densa (aparelho justaglomerular, M1)</text>
    <text x="56" y="162" fill="#cdd9e3">menos NaCl distal (VCE baixo) → renina↑ (RAAS)</text>

    <rect x="40" y="178" width="600" height="44" rx="8" fill="#10202c" stroke="#3a7bd5"/>
    <text x="56" y="198" font-weight="bold" fill="#9bbef0">3) Baro de BAIXA pressão (átrios, grandes veias)</text>
    <text x="56" y="216" fill="#cdd9e3">estiramento atrial (volume↑) → ANP/BNP → natriurese</text>
  </g>
  <text x="340" y="252" text-anchor="middle" font-size="10" fill="#9fb1c0">o rim integra esses sinais e decide reter ou eliminar Na — defendendo o VCE</text>
  <text x="340" y="272" text-anchor="middle" font-size="10" fill="#9fb1c0">por isso "volume" e "pressão" conversam (ponte com o Choca)</text>
</svg>

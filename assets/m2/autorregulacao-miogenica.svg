<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Autorregulação miogênica da arteríola aferente</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a pressão que estira a parede dispara a contração — o fluxo a jusante quase não muda</text>

  <!-- estado normal -->
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">PAM normal</text>
  <rect x="70" y="96" width="200" height="40" rx="20" fill="#0c2230" stroke="#e0556b" stroke-width="3"/>
  <rect x="70" y="106" width="200" height="20" fill="#7a2330"/>
  <text x="170" y="156" text-anchor="middle" font-size="11" fill="#9fb1c0">lúmen amplo · fluxo normal</text>

  <!-- estado pressão alta -->
  <text x="170" y="196" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">PAM ↑</text>
  <rect x="70" y="214" width="200" height="40" rx="20" fill="#0c2230" stroke="#e0556b" stroke-width="7"/>
  <rect x="120" y="226" width="100" height="16" fill="#7a2330"/>
  <text x="170" y="274" text-anchor="middle" font-size="11" fill="#9fb1c0">parede contraída · fluxo mantido</text>

  <!-- fluxo da lógica -->
  <g font-size="12" fill="#e7eef4">
    <rect x="340" y="92" width="300" height="30" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="356" y="112">1) PAM↑ estira a parede da aferente</text>
    <rect x="340" y="130" width="300" height="30" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="356" y="150">2) o músculo liso responde contraindo</text>
    <rect x="340" y="168" width="300" height="30" rx="6" fill="#10202c" stroke="#3a4a58"/><text x="356" y="188">3) a resistência aferente sobe</text>
    <rect x="340" y="206" width="300" height="30" rx="6" fill="#0f3540" stroke="#39c0c8"/><text x="356" y="226" fill="#9fe3ec">4) P_GC e TFG ficam ~constantes (platô)</text>
  </g>
  <text x="490" y="256" text-anchor="middle" font-size="10" fill="#9fb1c0">+ feedback tubuloglomerular (mácula densa) afina o ajuste</text>
</svg>

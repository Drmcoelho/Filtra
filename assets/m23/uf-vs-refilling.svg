<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#eef6f7" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a6f7a" stroke-width="2"/>
  <rect x="20" y="14" width="56" height="24" rx="4" fill="#2a6f7a"/>
  <text x="48" y="31" text-anchor="middle" font-size="12" font-weight="bold" fill="white">M23</text>
  <text x="360" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#13434a">② A DESIGUALDADE CENTRAL — UF rate × refilling</text>
  <!-- vaso (plasma) -->
  <rect x="70" y="80" width="150" height="170" rx="10" fill="#c0392b" fill-opacity="0.18" stroke="#b8402f" stroke-width="2"/>
  <text x="145" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8402f">① PLASMA</text>
  <text x="145" y="122" text-anchor="middle" font-size="10" fill="#b8402f">(intravascular)</text>
  <!-- intersticio -->
  <rect x="420" y="80" width="150" height="170" rx="10" fill="#2a7a3a" fill-opacity="0.16" stroke="#2a7a3a" stroke-width="2"/>
  <text x="495" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a7a3a">② INTERSTÍCIO</text>
  <text x="495" y="122" text-anchor="middle" font-size="10" fill="#2a7a3a">(reservatório)</text>
  <!-- UF: saida do plasma para a maquina -->
  <line x1="70" y1="165" x2="20" y2="165" stroke="#b8402f" stroke-width="4" marker-end="url(#a1)"/>
  <text x="45" y="155" text-anchor="middle" font-size="10" fill="#b8402f">③ UF</text>
  <!-- refilling: intersticio -> plasma -->
  <line x1="420" y1="165" x2="225" y2="165" stroke="#2a7a3a" stroke-width="4" marker-end="url(#a2)"/>
  <text x="320" y="155" text-anchor="middle" font-size="11" fill="#2a7a3a">④ refilling (com atraso)</text>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#b8402f"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2a7a3a"/></marker>
  </defs>
  <text x="320" y="278" text-anchor="middle" font-size="12" fill="#13434a">UF ≤ refilling → RBV estável (tolerado) · UF &gt; refilling → RBV cai → hipotensão</text>
  <text x="360" y="306" text-anchor="middle" font-size="9" fill="#13434a" opacity="0.55">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O TCP ao microscópio — esquema do corte</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">células cuboides eosinofílicas, luz "felpuda" pela borda em escova, núcleos basais</text>

  <!-- corte de túbulo: anel de células ao redor de uma luz -->
  <circle cx="250" cy="170" r="100" fill="#0c1620" stroke="#3a4a58"/>
  <circle cx="250" cy="170" r="46" fill="#10202c" stroke="#a06ad0"/>
  <text x="250" y="174" text-anchor="middle" font-size="10" fill="#c9a0e0">luz</text>
  <!-- borda em escova (felpa para dentro) -->
  <g stroke="#39c0c8" stroke-width="3" stroke-linecap="round">
    <line x1="250" y1="124" x2="250" y2="138"/><line x1="284" y1="136" x2="276" y2="148"/><line x1="296" y1="170" x2="282" y2="170"/>
    <line x1="284" y1="204" x2="276" y2="192"/><line x1="250" y1="216" x2="250" y2="202"/><line x1="216" y1="204" x2="224" y2="192"/>
    <line x1="204" y1="170" x2="218" y2="170"/><line x1="216" y1="136" x2="224" y2="148"/>
  </g>
  <!-- núcleos basais -->
  <g fill="#5aa0e0"><circle cx="250" cy="92" r="6"/><circle cx="320" cy="120" r="6"/><circle cx="338" cy="200" r="6"/><circle cx="290" cy="244" r="6"/><circle cx="205" cy="246" r="6"/><circle cx="165" cy="200" r="6"/><circle cx="182" cy="118" r="6"/></g>

  <rect x="390" y="80" width="260" height="170" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="520" y="104" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">Como reconhecer</text>
  <text x="406" y="132" font-size="11" fill="#cdd9e3">• luz com aspecto "felpudo" (borda em escova)</text>
  <text x="406" y="160" font-size="11" fill="#cdd9e3">• citoplasma rosa (muitas mitocôndrias)</text>
  <text x="406" y="188" font-size="11" fill="#cdd9e3">• núcleos na base da célula</text>
  <text x="406" y="220" font-size="10" fill="#9fb1c0">contrasta com o TCD (luz lisa, mais células por corte)</text>
</svg>

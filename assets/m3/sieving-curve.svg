<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A curva de peneiramento (θ) por raio molecular</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">θ = fração filtrada (1 = livre, 0 = barrada); cai com o tamanho</text>

  <!-- eixos -->
  <line x1="70" y1="270" x2="640" y2="270" stroke="#3a4a58"/>
  <line x1="70" y1="70" x2="70" y2="270" stroke="#3a4a58"/>
  <text x="355" y="296" text-anchor="middle" font-size="11" fill="#9fb1c0">raio molecular (Å) →</text>
  <text x="30" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 30 170)">θ (0 → 1)</text>
  <text x="64" y="78" text-anchor="end" font-size="9" fill="#9fb1c0">1</text>
  <text x="64" y="270" text-anchor="end" font-size="9" fill="#9fb1c0">0</text>

  <!-- curva neutra (tamanho) -->
  <path d="M70,76 C150,78 230,90 300,150 C350,195 420,255 520,266 L640,269" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <text x="560" y="120" font-size="10" fill="#39c0c8">neutra (só tamanho)</text>
  <!-- curva aniônica (deslocada para baixo: repelida) -->
  <path d="M70,80 C150,90 220,140 280,210 C330,255 420,266 520,268 L640,269" fill="none" stroke="#e0556b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="430" y="240" font-size="10" fill="#e08a96">aniônica (− repelida → θ menor)</text>

  <!-- marcadores -->
  <circle cx="120" cy="80" r="4" fill="#52c08a"/><text x="120" y="70" text-anchor="middle" font-size="9" fill="#8fe0b0">inulina (~14 Å) θ≈1</text>
  <circle cx="300" cy="200" r="4" fill="#e8a13a"/><text x="300" y="190" text-anchor="middle" font-size="9" fill="#f0c078">albumina (~36 Å)</text>
  <circle cx="470" cy="266" r="4" fill="#e0556b"/><text x="470" y="256" text-anchor="middle" font-size="9" fill="#e08a96">IgG (~55 Å) θ≈0</text>

  <text x="340" y="312" text-anchor="middle" font-size="9" fill="#9fb1c0">dano à barreira → a curva sobe (poros maiores); perder a carga → a curva vermelha sobe até a azul</text>
</svg>

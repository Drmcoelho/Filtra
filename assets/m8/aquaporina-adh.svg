<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="q" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3a7bd5"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">ADH e a aquaporina-2 — a torneira da água</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o ADH (V2) insere aquaporina-2 na membrana; a água sai usando o gradiente medular (M6)</text>

  <!-- sem ADH -->
  <text x="180" y="74" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">Sem ADH</text>
  <rect x="100" y="86" width="160" height="40" rx="6" fill="#3a214a" fill-opacity="0.4" stroke="#a06ad0"/>
  <rect x="100" y="126" width="160" height="50" fill="#10202c" stroke="#3a4a58"/>
  <text x="180" y="156" text-anchor="middle" font-size="10" fill="#9fb1c0">membrana impermeável → urina diluída</text>

  <!-- com ADH -->
  <text x="500" y="74" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">Com ADH (V2)</text>
  <rect x="420" y="86" width="160" height="40" rx="6" fill="#3a214a" fill-opacity="0.4" stroke="#a06ad0"/>
  <rect x="420" y="126" width="160" height="50" fill="#10202c" stroke="#3a4a58"/>
  <g stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#q)"><line x1="460" y1="100" x2="460" y2="150"/><line x1="500" y1="100" x2="500" y2="150"/><line x1="540" y1="100" x2="540" y2="150"/></g>
  <text x="500" y="156" text-anchor="middle" font-size="10" fill="#9bbef0">aquaporina-2 → água sai → urina concentrada</text>

  <rect x="120" y="200" width="440" height="68" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="224" text-anchor="middle" font-size="11" fill="#e7eef4">ADH é a alavanca da ÁGUA (independente da aldosterona, que é do Na/K)</text>
  <text x="340" y="246" text-anchor="middle" font-size="11" fill="#e8a13a">vaptano bloqueia o V2 → aquarese (perde água livre) → sobe o Na (SIADH)</text>
  <text x="340" y="262" text-anchor="middle" font-size="9" fill="#9fb1c0">precisa do gradiente do M6 para funcionar: sem gradiente, nem o ADH concentra</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0a1016"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O TCD no mapa do néfron — onde mora o ajuste fino</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#9fb1c0">glomérulo → TCP → alça → TCD → ducto coletor → urina</text>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#3a4a58"/></marker></defs>
  <!-- cadeia de segmentos -->
  <rect x="36" y="70" width="96" height="42" rx="6" fill="#1b242d" stroke="#283642"/>
  <text x="84" y="90" text-anchor="middle" font-size="11" fill="#e7eef4">TCP</text>
  <text x="84" y="104" text-anchor="middle" font-size="9" fill="#9fb1c0">65% do Na</text>
  <rect x="150" y="70" width="96" height="42" rx="6" fill="#1b242d" stroke="#283642"/>
  <text x="198" y="90" text-anchor="middle" font-size="11" fill="#e7eef4">alça (TAL)</text>
  <text x="198" y="104" text-anchor="middle" font-size="9" fill="#9fb1c0">25% · NKCC2</text>
  <rect x="264" y="66" width="112" height="50" rx="6" fill="#143038" stroke="#39c0c8" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#39c0c8">TCD</text>
  <text x="320" y="100" text-anchor="middle" font-size="9" fill="#9fb1c0">5–7% · NCC</text>
  <text x="320" y="112" text-anchor="middle" font-size="9" fill="#9fb1c0">diluidor</text>
  <rect x="394" y="70" width="116" height="42" rx="6" fill="#1b242d" stroke="#283642"/>
  <text x="452" y="90" text-anchor="middle" font-size="11" fill="#e7eef4">ducto coletor</text>
  <text x="452" y="104" text-anchor="middle" font-size="9" fill="#9fb1c0">ENaC · ajuste</text>
  <g stroke="#3a4a58" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M132 91 L150 91"/><path d="M246 91 L264 91"/><path d="M376 91 L394 91"/>
  </g>
  <!-- corte celular do TCD -->
  <text x="320" y="146" text-anchor="middle" font-size="12" fill="#9fb1c0">corte da célula do TCD — epitélio cúbico, mitocôndrias densas (transporte ativo intenso)</text>

    <line x1="245" y1="170" x2="385" y2="120" stroke="#e8a13a" stroke-width="2" stroke-dasharray="3 2"/>
    <line x1="245" y1="170" x2="105" y2="120" stroke="#e8a13a" stroke-width="2" stroke-dasharray="3 2"/>
  </g>
  <text x="320" y="225" text-anchor="middle" font-size="13" fill="#f0c98a">cada passo PRECISA de Ca²⁺ ionizado</text>

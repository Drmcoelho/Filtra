<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">"Soro fisiológico" não é fisiológico: iso-osmolar ≠ homeostático</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o SF 0,9% não move a célula (isotônico), mas seu Cl⁻ é suprafisiológico</text>

  <!-- eixo base -->
  <line x1="70" y1="250" x2="640" y2="250" stroke="#3a4a58"/>
  <text x="40" y="150" font-size="10" fill="#9fb1c0" transform="rotate(-90 40 150)">mEq/L</text>

  <!-- plasma -->
  <text x="200" y="80" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">PLASMA</text>
  <rect x="120" y="110" width="60" height="140" fill="#3a7bd5" fill-opacity="0.7"/><text x="150" y="104" text-anchor="middle" font-size="10" fill="#9bbef0">Na⁺ 140</text>
  <rect x="220" y="150" width="60" height="100" fill="#39c0c8" fill-opacity="0.7"/><text x="250" y="144" text-anchor="middle" font-size="10" fill="#9fe3ec">Cl⁻ ~100</text>

  <!-- SF -->
  <text x="480" y="80" text-anchor="middle" font-size="12" fill="#cdd9e3" font-weight="bold">SF 0,9%</text>
  <rect x="400" y="96" width="60" height="154" fill="#3a7bd5" fill-opacity="0.7"/><text x="430" y="90" text-anchor="middle" font-size="10" fill="#9bbef0">Na⁺ 154</text>
  <rect x="500" y="96" width="60" height="154" fill="#e0556b" fill-opacity="0.7"/><text x="530" y="90" text-anchor="middle" font-size="10" fill="#e08a96">Cl⁻ 154</text>

  <!-- destaque do excesso de Cl -->
  <line x1="280" y1="150" x2="500" y2="150" stroke="#e8a13a" stroke-dasharray="4 3"/>
  <text x="600" y="150" font-size="10" fill="#e8a13a">+54</text>
  <text x="530" y="270" text-anchor="middle" font-size="10" fill="#e8a13a">excesso de Cl⁻</text>

  <text x="340" y="298" text-anchor="middle" font-size="11" fill="#e8a13a">muito Cl⁻ desloca o HCO₃⁻ → acidose metabólica hiperclorêmica (em volume). Ringer ≈ mais perto do plasma.</text>
</svg>

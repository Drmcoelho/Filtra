<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc"><title id="title">Liddle × pseudo-hipoaldosteronismo</title><desc id="desc">Fenótipos opostos do ENaC: ganho de função retém sal; perda de função desperdiça sal.</desc><defs><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55cbd3"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e56666"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e4ae4f"/></marker><style>.t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eef5f4}.h{font-weight:800}.title{font-size:45px}.sub{font-size:20px}.m{font-size:25px}.s{font-size:18px}.xs{font-size:15px}.dim{fill:#a8bec4}.p{fill:#10212c;stroke:#355463;stroke-width:2}.p2{fill:#162b37;stroke:#355463;stroke-width:2}.fc{fill:none;stroke:#55cbd3;stroke-width:4;marker-end:url(#ac)}.fr{fill:none;stroke:#e56666;stroke-width:4;marker-end:url(#ar)}.fg{fill:none;stroke:#e4ae4f;stroke-width:4;marker-end:url(#ag)}</style></defs><rect width="1448" height="1086" fill="#071018"/><text x="42" y="64" class="t h title"><tspan fill="#55cbd3">FILTRA</tspan><tspan fill="#e4ae4f"> · Liddle × pseudo-hipoaldosteronismo</tspan></text><text x="44" y="101" class="t sub dim">Fenótipos opostos do ENaC: ganho de função retém sal; perda de função desperdiça sal.</text><g transform="translate(36 120)"><rect width="210" height="210" rx="20" class="p"/><path d="M95 28C48 22 32 70 42 115c9 42 41 71 76 61 21-6 20-30 8-51-10-18-6-36 8-50 20-21 1-42-39-47Z" fill="#a64148" stroke="#ef8b83" stroke-width="4"/><path d="M106 48c-24 9-32 36-27 61 5 24 20 41 37 42-9-20-8-42 6-62 10-14 5-31-16-41Z" fill="#e2a477" opacity=".72"/><circle cx="115" cy="91" r="13" fill="#55cbd3"/><path d="M128 91H178" class="fc"/><text x="105" y="198" text-anchor="middle" class="t h s">ENaC</text></g><g transform="translate(278 132)"><rect width="1134" height="830" rx="24" class="p"/>
<g transform="translate(44 62)"><rect width="500" height="632" rx="22" class="p2"/><text x="250" y="50" text-anchor="middle" class="t h m" fill="#e56666">SÍNDROME DE LIDDLE</text><text x="250" y="84" text-anchor="middle" class="t s">ENaC com ganho de função</text><rect x="34" y="124" width="92" height="290" rx="26" fill="#3b2847" stroke="#b58ae0" stroke-width="2"/><text x="80" y="158" text-anchor="middle" class="t h xs">LÚMEN</text><rect x="126" y="220" width="112" height="58" rx="16" fill="#17333d" stroke="#55cbd3" stroke-width="3"/><text x="182" y="257" text-anchor="middle" class="t h s">ENaC ↑↑</text><path d="M88 249H120" class="fc"/><circle cx="320" cy="249" r="32" fill="#5c9fe8"/><text x="320" y="256" text-anchor="middle" class="t h s">Na⁺</text><path d="M242 249H282" class="fc"/><text x="250" y="350" text-anchor="middle" class="t s">HAS · hipocalemia · alcalose</text><text x="250" y="390" text-anchor="middle" class="t h s">renina ↓ · aldosterona ↓</text><rect x="80" y="432" width="340" height="78" rx="18" fill="#17333d" stroke="#55cbd3"/><text x="250" y="464" text-anchor="middle" class="t h s">AMILORIDA/TRIAMTERENO</text><text x="250" y="494" text-anchor="middle" class="t xs dim">bloqueiam o canal causal</text><text x="250" y="560" text-anchor="middle" class="t xs dim">ARM tende a falhar: aldosterona já está suprimida</text></g>
<g transform="translate(590 62)"><rect width="500" height="632" rx="22" class="p2"/><text x="250" y="50" text-anchor="middle" class="t h m" fill="#69c78c">PSEUDO-HIPOALDO TIPO 1</text><text x="250" y="84" text-anchor="middle" class="t s">resistência ao MR ou perda de ENaC</text><rect x="34" y="124" width="92" height="290" rx="26" fill="#3b2847" stroke="#b58ae0" stroke-width="2"/><text x="80" y="158" text-anchor="middle" class="t h xs">LÚMEN</text><rect x="126" y="220" width="112" height="58" rx="16" fill="#17333d" stroke="#69c78c" stroke-width="3"/><text x="182" y="257" text-anchor="middle" class="t h s">ENaC ↓↓</text><line x1="116" y1="196" x2="252" y2="288" stroke="#e56666" stroke-width="10"/><text x="250" y="350" text-anchor="middle" class="t s">perda de sal · hipotensão/desidratação</text><text x="250" y="390" text-anchor="middle" class="t h s">hipercalemia · acidose</text><text x="250" y="430" text-anchor="middle" class="t h s">renina ↑ · aldosterona ↑</text><rect x="80" y="472" width="340" height="78" rx="18" fill="#28311f" stroke="#69c78c"/><text x="250" y="504" text-anchor="middle" class="t h s">REPOR SAL / TRATAR K⁺</text><text x="250" y="534" text-anchor="middle" class="t xs dim">manejo depende do subtipo e gravidade</text></g>
<rect x="44" y="742" width="1046" height="54" rx="14" fill="#0c171f"/><text x="567" y="777" text-anchor="middle" class="t s">O valor da aldosterona só faz sentido junto de pressão, K⁺, ácido-base e direção do transporte de Na⁺.</text></g><rect x="32" y="1018" width="1384" height="43" rx="14" fill="#0d1821" stroke="#355463"/><text x="724" y="1046" text-anchor="middle" class="t s"><tspan fill="#55cbd3">ENaC ↑: Liddle · ENaC/MR ↓: PHA1</tspan><tspan class="dim"> · M8 · ducto coletor</tspan></text></svg>
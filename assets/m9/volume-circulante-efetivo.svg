<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Volume circulante EFETIVO (VCE) — o que o rim realmente sente</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">não é o ECF total, mas o quanto o leito ARTERIAL está "cheio" e perfundindo</text>

  <rect x="40" y="70" width="600" height="44" rx="8" fill="#0c2330" stroke="#39c0c8"/>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#9fe3ec">ECF total = plasma + interstício (pode estar cheíssimo no edema)</text>
  <text x="340" y="108" text-anchor="middle" font-size="10" fill="#9fb1c0">↑ não é o que regula a retenção de Na</text>

  <rect x="180" y="130" width="320" height="44" rx="8" fill="#7a2330" fill-opacity="0.4" stroke="#e0556b"/>
  <text x="340" y="152" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">VCE = enchimento arterial efetivo</text>
  <text x="340" y="168" text-anchor="middle" font-size="10" fill="#9fb1c0">sentido por barorreceptores e mácula densa</text>

  <rect x="120" y="196" width="440" height="74" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#e7eef4">VCE baixo → RAAS/SNS → RETÉM Na (FENa baixa)</text>
  <text x="340" y="242" text-anchor="middle" font-size="11" fill="#e7eef4">VCE/átrio cheios → ANP/BNP → NATRIURESE</text>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="#e8a13a">por isso ICC/cirrose retêm Na mesmo com ECF total altíssimo (edema)</text>
</svg>

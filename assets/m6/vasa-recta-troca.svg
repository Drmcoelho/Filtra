<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="v" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8a13a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A vasa recta — troca contracorrente que PRESERVA o gradiente</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">os capilares medulares descem e sobem em alça → não "lavam" a pilha osmótica</text>

  <path d="M250,70 L250,250 Q250,282 300,282 Q350,282 350,250 L350,70" fill="none" stroke="#3a7bd5" stroke-width="12" stroke-linecap="round"/>
  <text x="232" y="64" text-anchor="end" font-size="10" fill="#9bbef0">descende ↓</text>
  <text x="368" y="64" text-anchor="start" font-size="10" fill="#9bbef0">ascende ↑</text>

  <!-- trocas -->
  <g stroke="#e8a13a" stroke-width="2" marker-end="url(#v)">
    <line x1="262" y1="120" x2="318" y2="120"/><line x1="318" y1="170" x2="262" y2="170"/><line x1="262" y1="220" x2="318" y2="220"/>
  </g>
  <text x="290" y="110" text-anchor="middle" font-size="9" fill="#e8a13a">solutos entram</text>
  <text x="290" y="162" text-anchor="middle" font-size="9" fill="#e8a13a">e saem</text>

  <rect x="400" y="90" width="250" height="150" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="525" y="114" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">Por que importa</text>
  <text x="416" y="142" font-size="11" fill="#cdd9e3">se o sangue passasse reto, levaria</text>
  <text x="416" y="158" font-size="11" fill="#cdd9e3">embora o gradiente (washout)</text>
  <text x="416" y="186" font-size="11" fill="#9fe3ec">a alça deixa o sangue entregar/retomar</text>
  <text x="416" y="202" font-size="11" fill="#9fe3ec">os solutos → o gradiente fica de pé</text>
  <text x="416" y="228" font-size="10" fill="#9fb1c0">(ponte com a hipóxia medular do M2)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Arial,sans-serif">
  <rect width="640" height="360" fill="#0d141b"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Resistência ao diurético — a curva desloca à DIREITA</text>
  <!-- eixos -->
  <line x1="80" y1="290" x2="600" y2="290" stroke="#3a4a58" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="290" stroke="#3a4a58" stroke-width="1.5"/>
  <text x="340" y="325" text-anchor="middle" font-size="12" fill="#9fb1c0">dose do diurético de alça (entrega ao néfron) →</text>
  <text x="30" y="175" text-anchor="middle" font-size="12" fill="#9fb1c0" transform="rotate(-90 30 175)">natriurese →</text>
  <!-- curva normal (esquerda, teto alto) -->
  <path d="M80 290 Q150 110 320 92 T600 86" fill="none" stroke="#52c08a" stroke-width="2.5"/>
  <text x="360" y="80" font-size="12" fill="#52c08a">rim que responde (EC50 baixo, teto alto)</text>
  <!-- curva resistente (direita, teto menor) -->
  <path d="M80 290 Q280 250 430 180 T600 150" fill="none" stroke="#e0556b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="430" y="205" font-size="12" fill="#e0556b">resistente: EC50↑, teto↓</text>
  <!-- seta de deslocamento -->
  <defs><marker id="sh" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#e8a13a"/></marker></defs>
  <line x1="210" y1="150" x2="330" y2="150" stroke="#e8a13a" stroke-width="2" marker-end="url(#sh)"/>
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#e8a13a">braking →</text>
  <text x="320" y="350" text-anchor="middle" font-size="11" fill="#9fb1c0">Mesma dose rende menos: precisa de MAIS dose para o mesmo efeito — e há TETO. (pérola partilhada M17)</text>
</svg>

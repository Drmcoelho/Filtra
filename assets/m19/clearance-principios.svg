<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Clearance na máquina — o que cada termo controla</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a depuração total soma os mecanismos, limitada pelo fluxo de sangue (Qb)</text>

  <text x="340" y="84" text-anchor="middle" font-size="15" fill="#e7eef4">K_total = K_difusivo + K_convectivo + K_adsortivo  (≤ Qb)</text>

  <g font-size="11" fill="#e7eef4">
    <rect x="40" y="106" width="600" height="34" rx="6" fill="#10202c" stroke="#39c0c8"/>
    <text x="56" y="128">K_difusivo ↑ com KoA (membrana), Qb e Qd (fluxos); ↓ com o tamanho</text>
    <rect x="40" y="146" width="600" height="34" rx="6" fill="#10202c" stroke="#52c08a"/>
    <text x="56" y="168">K_convectivo = Jv · sieving — sobe com a UF; remove bem as médias</text>
    <rect x="40" y="186" width="600" height="34" rx="6" fill="#10202c" stroke="#a06ad0"/>
    <text x="56" y="208">K_adsortivo: extra, saturável (depende da membrana)</text>
  </g>

  <text x="340" y="248" text-anchor="middle" font-size="11" fill="#e8a13a">o teto de tudo é o Qb: não se depura mais soluto do que o sangue entrega ao filtro</text>
  <text x="340" y="272" text-anchor="middle" font-size="9" fill="#9fb1c0">é o que o Instrumento computa: clearance × tamanho molecular, somando difusão e convecção</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs>
    <marker id="dd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker>
    <marker id="cc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52c08a"/></marker>
  </defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A membrana e os solutos — o que passa e o que fica</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">os poros deixam passar pequenas e médias; rejeitam as grandes (albumina) — é o sieving</text>

  <!-- membrana com poros -->
  <rect x="320" y="60" width="20" height="190" fill="#5a6b78"/>
  <g fill="#0f1720"><rect x="322" y="80" width="16" height="10"/><rect x="322" y="120" width="16" height="10"/><rect x="322" y="160" width="16" height="10"/><rect x="322" y="200" width="16" height="10"/></g>
  <text x="330" y="268" text-anchor="middle" font-size="9" fill="#9fb1c0">membrana (poros)</text>

  <text x="160" y="74" text-anchor="middle" font-size="10" fill="#e08a96">SANGUE</text>
  <text x="520" y="74" text-anchor="middle" font-size="10" fill="#9fe3ec">DIALISATO/EFLUENTE</text>

  <!-- pequena passa (difusão) -->
  <circle cx="150" cy="85" r="5" fill="#39c0c8"/><line x1="170" y1="85" x2="500" y2="85" stroke="#39c0c8" stroke-width="2" marker-end="url(#dd)"/>
  <text x="250" y="78" font-size="9" fill="#9fe3ec">pequena (ureia) — passa fácil (S≈1)</text>

  <!-- média passa (convecção) -->
  <circle cx="150" cy="165" r="8" fill="#e8a13a"/><line x1="172" y1="165" x2="500" y2="165" stroke="#52c08a" stroke-width="2" marker-end="url(#cc)"/>
  <text x="250" y="158" font-size="9" fill="#f0c078">média (β2-micro) — passa por convecção (S~0,7)</text>

  <!-- grande rejeitada -->
  <circle cx="150" cy="215" r="13" fill="#a06ad0"/><line x1="178" y1="215" x2="315" y2="215" stroke="#a06ad0" stroke-width="2"/>
  <line x1="318" y1="205" x2="300" y2="225" stroke="#e0556b" stroke-width="3"/>
  <text x="240" y="240" font-size="9" fill="#c9a0e0">grande (albumina) — REJEITADA (S=0)</text>

  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#e8a13a">sieving S: 1 = passa livre · 0 = barrada — o que define o que a convecção consegue remover</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">ANP / BNP — o contrapeso natriurético do RAAS</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">quando o volume SOBE, o coração estirado manda excretar Na</text>

  <!-- coração estirado -->
  <path d="M150 92 C150 76 124 76 124 96 C124 76 98 76 98 92 C98 112 124 128 124 128 C124 128 150 112 150 92 Z" fill="#1a1410" stroke="#e0556b" stroke-width="2"/>
  <text x="124" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#e0556b">① átrio estirado</text>
  <text x="124" y="165" text-anchor="middle" font-size="9.5" fill="#9fb1c0">enchimento ↑ (volume alto)</text>
  <text x="124" y="179" text-anchor="middle" font-size="9.5" fill="#9fb1c0">ANP (átrio) · BNP (ventrículo)</text>

  <line x1="170" y1="108" x2="248" y2="108" stroke="#52c08a" stroke-width="2" marker-end="url(#b)"/>
  <rect x="252" y="84" width="150" height="50" rx="8" fill="#102a2c" stroke="#52c08a" stroke-width="2"/>
  <text x="327" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#52c08a">② ANP / BNP ↑</text>
  <text x="327" y="123" text-anchor="middle" font-size="9.5" fill="#cfdbe6">liberados no sangue</text>
  <line x1="402" y1="108" x2="470" y2="108" stroke="#52c08a" stroke-width="2" marker-end="url(#b)"/>

  <!-- três ações -->
  <rect x="476" y="60" width="150" height="100" rx="8" fill="#141b22" stroke="#52c08a"/>
  <text x="551" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#52c08a">③ ações</text>
  <text x="490" y="102" font-size="9.5" fill="#cfdbe6">• natriurese (excreta Na)</text>
  <text x="490" y="118" font-size="9.5" fill="#cfdbe6">• ↑ TFG (dilata aferente)</text>
  <text x="490" y="134" font-size="9.5" fill="#cfdbe6">• vasodilatação (↓ PA)</text>
  <text x="490" y="150" font-size="9.5" fill="#cfdbe6">• inibe renina/aldosterona</text>

  <!-- gangorra contrapeso -->
  <line x1="120" y1="248" x2="520" y2="248" stroke="#283642" stroke-width="2"/>
  <polygon points="320,248 308,272 332,272" fill="#283642"/>
  <rect x="120" y="206" width="170" height="40" rx="8" fill="#1a1410" stroke="#e0556b"/>
  <text x="205" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#e0556b">RAAS/SNS — retém Na</text>
  <rect x="350" y="206" width="170" height="40" rx="8" fill="#101d22" stroke="#52c08a"/>
  <text x="435" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#52c08a">ANP/BNP — excreta Na</text>
  <text x="320" y="298" text-anchor="middle" font-size="11" fill="#cfdbe6">o ponto de equilíbrio define o tamanho final da ECF</text>
  <text x="320" y="316" text-anchor="middle" font-size="9.5" fill="#9fb1c0">na ICC, o BNP sobe MUITO — é marcador de estiramento/sobrecarga</text>

  <text x="320" y="352" text-anchor="middle" font-size="9" fill="#5b6b78">FILTRA · M9 — ANP/BNP é o freio natriurético que equilibra o acelerador do RAAS</text>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52c08a"/></marker>
  </defs>
</svg>

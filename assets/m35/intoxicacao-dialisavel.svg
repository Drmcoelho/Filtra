<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui,Segoe UI,sans-serif">
  <rect width="640" height="320" fill="#0f161d"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#e7eef4">I — Intoxicação: só dispara se a toxina for DIALISÁVEL</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#9fb1c0">PM baixo · ligação proteica baixa · Vd baixo · hidrossolúvel</text>
  <!-- membrana -->
  <rect x="300" y="70" width="14" height="210" fill="#39c0c8" opacity="0.5"/>
  <text x="307" y="298" text-anchor="middle" font-size="10" fill="#39c0c8">membrana</text>
  <text x="160" y="90" text-anchor="middle" font-size="11" fill="#9fb1c0">sangue</text>
  <text x="460" y="90" text-anchor="middle" font-size="11" fill="#9fb1c0">dialisato</text>
  <!-- dialisáveis (passam) -->
  <g>
    <circle cx="200" cy="120" r="9" fill="#52c08a"/><text x="220" y="124" font-size="11" fill="#e7eef4">lítio (PM 7, Vd 0,7)</text>
    <circle cx="200" cy="150" r="9" fill="#52c08a"/><text x="220" y="154" font-size="11" fill="#e7eef4">salicilato</text>
    <circle cx="200" cy="180" r="9" fill="#52c08a"/><text x="220" y="184" font-size="11" fill="#e7eef4">metanol / etilenoglicol</text>
    <path d="M250 150 H355" stroke="#52c08a" stroke-width="2" marker-end="url(#a)"/>
    <text x="400" y="146" font-size="11" fill="#52c08a">atravessa → removível</text>
  </g>
  <!-- não dialisável (bloqueado) -->
  <circle cx="200" cy="230" r="9" fill="#e0556b"/><text x="220" y="234" font-size="11" fill="#e7eef4">digoxina (Vd ~6 → blindada)</text>
  <path d="M250 230 H290" stroke="#e0556b" stroke-width="2"/>
  <line x1="293" y1="218" x2="305" y2="242" stroke="#e0556b" stroke-width="2.5"/>
  <line x1="305" y1="218" x2="293" y2="242" stroke="#e0556b" stroke-width="2.5"/>
  <text x="400" y="234" font-size="11" fill="#e0556b">não passa → não indica TRS</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#52c08a"/></marker></defs>
  <text x="320" y="312" text-anchor="middle" font-size="11" fill="#9fb1c0">a dialisabilidade é um PORTÃO: por mais grave que seja, o Vd alto blinda a droga da máquina</text>
</svg>

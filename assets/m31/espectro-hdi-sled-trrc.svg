<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,Segoe UI,Arial" fill="none">
  <rect width="480" height="300" fill="#0a1016"/>
  <text x="240" y="26" fill="#39c0c8" font-size="15" font-weight="bold" text-anchor="middle">O espectro: eficiência × tempo × tolerância</text>
  <!-- axis -->
  <line x1="40" y1="240" x2="450" y2="240" stroke="#3a4a58" stroke-width="1.5"/>
  <text x="50" y="262" fill="#9fb1c0" font-size="11">curto / rápido</text>
  <text x="370" y="262" fill="#9fb1c0" font-size="11">longo / lento</text>
  <text x="245" y="282" fill="#9fb1c0" font-size="12" text-anchor="middle">tempo de sessão  →</text>
  <!-- HDI -->
  <circle cx="95" cy="160" r="34" fill="#52c08a" fill-opacity="0.18" stroke="#52c08a" stroke-width="2"/>
  <text x="95" y="156" fill="#52c08a" font-size="15" font-weight="bold" text-anchor="middle">HDI</text>
  <text x="95" y="173" fill="#9fb1c0" font-size="9" text-anchor="middle">3–4 h</text>
  <line x1="95" y1="194" x2="95" y2="240" stroke="#52c08a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="95" y="124" fill="#9fb1c0" font-size="9" text-anchor="middle">eficiência/h ALTA</text>
  <!-- SLED -->
  <circle cx="240" cy="150" r="44" fill="#39c0c8" fill-opacity="0.22" stroke="#39c0c8" stroke-width="3"/>
  <text x="240" y="146" fill="#39c0c8" font-size="17" font-weight="bold" text-anchor="middle">SLED</text>
  <text x="240" y="164" fill="#cfe6e8" font-size="9" text-anchor="middle">6–12 h</text>
  <line x1="240" y1="194" x2="240" y2="240" stroke="#39c0c8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="104" fill="#39c0c8" font-size="10" text-anchor="middle" font-weight="bold">o meio-termo</text>
  <!-- TRRC -->
  <circle cx="400" cy="160" r="34" fill="#e8a13a" fill-opacity="0.18" stroke="#e8a13a" stroke-width="2"/>
  <text x="400" y="156" fill="#e8a13a" font-size="14" font-weight="bold" text-anchor="middle">TRRC</text>
  <text x="400" y="173" fill="#9fb1c0" font-size="9" text-anchor="middle">24 h</text>
  <line x1="400" y1="194" x2="400" y2="240" stroke="#e8a13a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="400" y="124" fill="#9fb1c0" font-size="9" text-anchor="middle">eficiência/h BAIXA</text>
  <!-- tolerance arrow -->
  <path d="M70 70 L 430 70" stroke="#9fb1c0" stroke-width="1" marker-end="url(#a)"/>
  <text x="250" y="62" fill="#9fb1c0" font-size="11" text-anchor="middle">tolerância hemodinâmica  →</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#9fb1c0"/></marker></defs>
</svg>

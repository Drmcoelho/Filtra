<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">Vitamina D: ativação renal e eixo mineral</title><desc id="desc">O túbulo proximal converte 25-OH-D em calcitriol por CYP27B1 sob controle de PTH, fósforo e FGF23.</desc><defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55cbd3"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e3ad4f"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e26464"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#68c58a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eef5f4}.dim{fill:#aac0c4}.h{font-weight:800}.title{font-size:46px}.sub{font-size:21px}.m{font-size:24px}.s{font-size:18px}.xs{font-size:15px}.panel{fill:#101d27;stroke:#36505f;stroke-width:2}.panel2{fill:#152631;stroke:#36505f;stroke-width:2}.flow{fill:none;stroke:#55cbd3;stroke-width:4;marker-end:url(#arrow-cyan)}.goldflow{fill:none;stroke:#e3ad4f;stroke-width:4;marker-end:url(#arrow-gold)}.redflow{fill:none;stroke:#e26464;stroke-width:4;marker-end:url(#arrow-red)}.greenflow{fill:none;stroke:#68c58a;stroke-width:4;marker-end:url(#arrow-green)}
    </style>
  </defs>
  <rect width="1448" height="1086" fill="#071018"/>
  <text x="42" y="64" class="t h title"><tspan fill="#55cbd3">FILTRA</tspan><tspan fill="#e3ad4f"> · Vitamina D: ativação renal e eixo mineral</tspan></text>
  <text x="44" y="101" class="t sub dim">O túbulo proximal converte 25-OH-D em calcitriol por CYP27B1 sob controle de PTH, fósforo e FGF23.</text>
  <g transform="translate(36 118)">
    <rect width="210" height="206" rx="20" class="panel"/>
    <path d="M95 28C48 22 32 70 42 115c9 42 41 71 76 61 21-6 20-30 8-51-10-18-6-36 8-50 20-21 1-42-39-47Z" fill="#a64148" stroke="#ef8b83" stroke-width="4"/>
    <path d="M106 48c-24 9-32 36-27 61 5 24 20 41 37 42-9-20-8-42 6-62 10-14 5-31-16-41Z" fill="#e2a477" opacity=".72"/>
    <circle cx="114" cy="88" r="13" fill="#55cbd3"/><path d="M126 88H176" class="flow"/>
    <text x="20" y="190" class="t h s">Túbulo proximal</text>
    <text x="112" y="116" text-anchor="middle" class="t xs">CYP27B1</text>
  </g>
  <g transform="translate(278 132)"><rect width="1134" height="830" rx="24" class="panel" filter="url(#shadow)"/>
    <g transform="translate(44 70)">
      <rect width="210" height="120" rx="20" class="panel2"/><text x="105" y="44" text-anchor="middle" class="t h m">PELE/DIETA</text><text x="105" y="80" text-anchor="middle" class="t s">D₃ / D₂</text>
      <path d="M222 60H326" class="goldflow"/>
      <rect x="338" width="210" height="120" rx="20" fill="#30251a" stroke="#e3ad4f" stroke-width="3"/><text x="443" y="44" text-anchor="middle" class="t h m">FÍGADO</text><text x="443" y="80" text-anchor="middle" class="t s">25-OH-D · calcidiol</text>
      <path d="M560 60H664" class="flow"/>
      <rect x="676" width="324" height="120" rx="20" fill="#17313a" stroke="#55cbd3" stroke-width="3"/><text x="838" y="39" text-anchor="middle" class="t h m">TCP · CYP27B1</text><text x="838" y="73" text-anchor="middle" class="t s">1α-hidroxilase</text><text x="838" y="101" text-anchor="middle" class="t h s" fill="#55cbd3">1,25-(OH)₂-D · CALCITRIOL</text>
    </g>
    <rect x="44" y="250" width="500" height="226" rx="22" class="panel2"/><text x="70" y="292" class="t h m" fill="#68c58a">ATIVAM CYP27B1</text><text x="78" y="338" class="t s">PTH ↑</text><text x="78" y="378" class="t s">fosfato baixo</text><text x="78" y="418" class="t s">calcitriol baixo</text><text x="280" y="338" class="t xs dim">necessidade de Ca/P</text>
    <rect x="590" y="250" width="500" height="226" rx="22" class="panel2"/><text x="616" y="292" class="t h m" fill="#e26464">INIBEM CYP27B1</text><text x="624" y="338" class="t s">FGF23 ↑ + Klotho</text><text x="624" y="378" class="t s">fosfato alto</text><text x="624" y="418" class="t s">calcitriol alto</text><text x="826" y="338" class="t xs dim">feedback do eixo</text>
    <path d="M838 194V520" class="goldflow"/>
    <g transform="translate(44 540)">
      <rect width="310" height="150" rx="20" class="panel2"/><text x="155" y="42" text-anchor="middle" class="t h m">INTESTINO</text><text x="28" y="82" class="t s">absorção de Ca²⁺ e PO₄³⁻ ↑</text><text x="28" y="118" class="t xs dim">principal efeito sistêmico</text>
      <rect x="370" width="310" height="150" rx="20" class="panel2"/><text x="525" y="42" text-anchor="middle" class="t h m">PARATIREOIDE</text><text x="398" y="82" class="t s">síntese de PTH ↓</text><text x="398" y="118" class="t xs dim">feedback negativo</text>
      <rect x="740" width="310" height="150" rx="20" class="panel2"/><text x="895" y="42" text-anchor="middle" class="t h m">OSSO/RIM</text><text x="768" y="82" class="t s">mineralização depende de oferta</text><text x="768" y="118" class="t xs dim">efeito contextual, não unidirecional</text>
    </g>
    <rect x="44" y="728" width="1050" height="70" rx="18" fill="#281d1d" stroke="#e26464"/><text x="70" y="770" class="t h s" fill="#e26464">DRC:</text><text x="142" y="770" class="t s">massa tubular/CYP27B1 ↓ + retenção de P/FGF23 ↑ → calcitriol ↓ → hiperPTH secundário.</text>
  </g>
  <rect x="32" y="1015" width="1384" height="45" rx="14" fill="#0d1821" stroke="#36505f"/>
  <text x="724" y="1045" text-anchor="middle" class="t s"><tspan fill="#55cbd3">25-OH-D → CYP27B1 renal → calcitriol</tspan><tspan class="dim"> · M14 · endocrinologia renal</tspan></text>
  </svg>
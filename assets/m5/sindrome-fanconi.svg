<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Síndrome de Fanconi — disfunção GLOBAL do TCP</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">se o proximal falha, tudo o que ele reabsorve vaza na urina</text>

  <rect x="40" y="64" width="600" height="44" rx="8" fill="#3a214a" fill-opacity="0.4" stroke="#a06ad0"/>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#c9a0e0">TCP doente (cistinose, drogas como tenofovir/ifosfamida, mieloma)</text>

  <g font-size="11" fill="#e7eef4">
    <text x="60" y="140">• glicosúria com glicemia NORMAL (o SGLT não funciona)</text>
    <text x="60" y="168">• bicarbonatúria → acidose tubular renal tipo 2 (proximal)</text>
    <text x="60" y="196">• fosfatúria → hipofosfatemia → raquitismo/osteomalácia</text>
    <text x="60" y="224">• aminoacidúria, uricosúria, perda de potássio</text>
  </g>

  <rect x="40" y="244" width="600" height="40" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="340" y="269" text-anchor="middle" font-size="11" fill="#f0c078">a pista: glicosúria sem hiperglicemia = pense em defeito proximal, não em diabetes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img"><rect width="440" height="300" fill="#0a1016"/><text x="220" y="24" fill="#e7eef4" font-size="14" font-family="system-ui,Segoe UI,Arial" text-anchor="middle" font-weight="bold">DIFUSÃO × CONVECÇÃO — duas físicas, dois alvos</text><rect x="30" y="45" width="180" height="200" rx="8" fill="#10171e" stroke="#52c08a"/><text x="120" y="68" fill="#52c08a" font-size="13" font-family="system-ui,Segoe UI,Arial" text-anchor="middle" font-weight="bold">DIFUSÃO</text><text x="120" y="90" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">gradiente de C</text><text x="120" y="130" fill="#e7eef4" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">→ PEQUENOS</text><text x="120" y="150" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">(ureia, K⁺, Cr)</text><text x="120" y="185" fill="#e0556b" font-size="11" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">cai com o PM</text><text x="120" y="220" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">HD intermitente</text><rect x="230" y="45" width="180" height="200" rx="8" fill="#10171e" stroke="#e8a13a"/><text x="320" y="68" fill="#e8a13a" font-size="13" font-family="system-ui,Segoe UI,Arial" text-anchor="middle" font-weight="bold">CONVECÇÃO</text><text x="320" y="90" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">arraste pela água</text><text x="320" y="130" fill="#e7eef4" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">→ MÉDIOS</text><text x="320" y="150" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">(β2-m, citocinas)</text><text x="320" y="185" fill="#52c08a" font-size="11" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">plana até cutoff</text><text x="320" y="220" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">HF / CVVH</text><text x="220" y="272" fill="#39c0c8" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="middle" font-weight="bold">HDF = difusão + convecção (soma os dois)</text><text x="220" y="290" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="middle">ambas removem SOLUTO; a UF remove VOLUME</text></svg>

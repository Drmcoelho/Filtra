<g transform="translate(44 582)"><rect width="324" height="166" rx="20" class="p2"/><text x="24" y="42" class="t h s">AUMENTAM K⁺ URINÁRIO</text><text x="24" y="82" class="t s">Na distal ↑ · fluxo ↑</text><text x="24" y="118" class="t s">aldosterona ↑ · ENaC ↑</text><text x="24" y="148" class="t xs dim">BK ganha importância com fluxo alto</text><rect x="362" width="324" height="166" rx="20" class="p2"/><text x="386" y="42" class="t h s">REDUZEM K⁺ URINÁRIO</text><text x="386" y="82" class="t s">amilorida/triamtereno</text><text x="386" y="118" class="t s">ARM · baixo fluxo/Na distal</text><text x="386" y="148" class="t xs dim">risco de hipercalemia</text><rect x="724" width="324" height="166" rx="20" class="p2"/><text x="748" y="42" class="t h s">DISTINÇÃO</text><text x="748" y="82" class="t s">Na⁺ entra pelo ENaC</text><text x="748" y="118" class="t s">K⁺ sai por ROMK/BK</text><text x="748" y="148" class="t xs dim">não é uma troca 1:1 no mesmo canal</text></g></g><rect x="32" y="1018" width="1384" height="43" rx="14" fill="#0d1821" stroke="#355463"/><text x="724" y="1046" text-anchor="middle" class="t s"><tspan fill="#55cbd3">Na⁺ entra · lúmen negativo · K⁺ sai</tspan><tspan class="dim"> · M8 · ducto coletor</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A curva de titulação da glicose — filtrada, reabsorvida, excretada</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">abaixo do limiar não há glicosúria; acima do Tm, tudo o que filtra a mais é excretado</text>
  <line x1="70" y1="270" x2="640" y2="270" stroke="#3a4a58"/>
  <line x1="70" y1="64" x2="70" y2="270" stroke="#3a4a58"/>
  <text x="355" y="296" text-anchor="middle" font-size="11" fill="#9fb1c0">glicemia (mg/dL) →</text>
  <text x="28" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 28 170)">mg/min</text>
  <!-- filtrada: linear -->
  <line x1="70" y1="270" x2="620" y2="80" stroke="#3a7bd5" stroke-width="2.5"/>
  <text x="560" y="76" font-size="10" fill="#9bbef0">filtrada</text>
  <!-- reabsorvida: sobe e satura no Tm -->
  <path d="M70,270 L360,176 L620,176" fill="none" stroke="#52c08a" stroke-width="2.5"/>
  <text x="500" y="170" font-size="10" fill="#8fe0b0">reabsorvida (satura no Tm)</text>
  <line x1="70" y1="176" x2="360" y2="176" stroke="#52c08a" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  <text x="74" y="172" font-size="9" fill="#8fe0b0">Tm</text>
  <!-- excretada: zero até limiar, depois sobe -->
  <path d="M70,270 L300,270 L620,128" fill="none" stroke="#e0556b" stroke-width="2.5"/>
  <text x="560" y="120" font-size="10" fill="#e08a96">excretada (glicosúria)</text>
  <line x1="300" y1="64" x2="300" y2="270" stroke="#e8a13a" stroke-dasharray="3 3"/>
  <text x="300" y="60" text-anchor="middle" font-size="9" fill="#e8a13a">limiar (~180–200)</text>
  <text x="340" y="312" text-anchor="middle" font-size="9" fill="#9fb1c0">o "splay" (curvatura) reflete néfrons com Tm diferentes; SGLT2i e Fanconi derrubam o Tm</text>
</svg>

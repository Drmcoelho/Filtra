<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A vasopressina tem dois chapéus — V2 (água) e V1 (vaso)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o mesmo hormônio liga a homeostasia da água (rim) à da pressão (vaso) — ponte com o Choca</text>

  <circle cx="340" cy="90" r="26" fill="#3a214a" fill-opacity="0.7" stroke="#a06ad0"/>
  <text x="340" y="94" text-anchor="middle" font-size="10" fill="#c9a0e0">ADH</text>

  <rect x="60" y="150" width="280" height="110" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="200" y="174" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">V2 — rim (ESTE módulo)</text>
  <text x="76" y="200" font-size="11" fill="#e7eef4">aquaporina-2 → reabsorve água</text>
  <text x="76" y="224" font-size="11" fill="#e7eef4">concentra a urina; recicla ureia</text>
  <text x="76" y="248" font-size="10" fill="#9fb1c0">alvo do vaptano (aquarese)</text>
  <line x1="320" y1="112" x2="220" y2="150" stroke="#3a7bd5" stroke-width="2"/>

  <rect x="350" y="150" width="280" height="110" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="490" y="174" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">V1 — vaso (Choca)</text>
  <text x="366" y="200" font-size="11" fill="#e7eef4">vasoconstrição (↑RVS, ↑PA)</text>
  <text x="366" y="224" font-size="11" fill="#e7eef4">vasopressina no choque distributivo</text>
  <text x="366" y="248" font-size="10" fill="#9fb1c0">a "outra face" do mesmo hormônio</text>
  <line x1="360" y1="112" x2="460" y2="150" stroke="#e0556b" stroke-width="2"/>
</svg>

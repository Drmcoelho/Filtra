<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Fração de filtração (FF) e o paradoxo do eferente</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">FF = TFG / FPR · eferente fechada preserva a TFG enquanto o fluxo cai → FF ↑</text>

  <!-- equação -->
  <rect x="210" y="58" width="260" height="30" rx="6" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="78" text-anchor="middle" font-size="14" fill="#e7eef4">FF = TFG ÷ FPR  (normal ~0,20)</text>

  <!-- barras: FPR cai, TFG mantida -->
  <text x="190" y="116" text-anchor="middle" font-size="11" fill="#cdd9e3">FPR (fluxo plasmático)</text>
  <rect x="120" y="130" width="140" height="26" fill="#3a7bd5" fill-opacity="0.35" stroke="#3a7bd5"/><text x="190" y="148" text-anchor="middle" font-size="9" fill="#9bbef0">normal</text>
  <rect x="120" y="166" width="80" height="26" fill="#3a7bd5" fill-opacity="0.7" stroke="#3a7bd5"/><text x="160" y="184" text-anchor="middle" font-size="9" fill="#9bbef0">eferente↑ → FPR↓</text>

  <text x="500" y="116" text-anchor="middle" font-size="11" fill="#cdd9e3">TFG (filtração)</text>
  <rect x="430" y="130" width="120" height="26" fill="#39c0c8" fill-opacity="0.35" stroke="#39c0c8"/><text x="490" y="148" text-anchor="middle" font-size="9" fill="#9fe3ec">normal</text>
  <rect x="430" y="166" width="116" height="26" fill="#39c0c8" fill-opacity="0.7" stroke="#39c0c8"/><text x="488" y="184" text-anchor="middle" font-size="9" fill="#9fe3ec">eferente↑ → TFG mantida</text>

  <rect x="120" y="214" width="440" height="56" rx="8" fill="#10202c" stroke="#39c0c8"/>
  <text x="340" y="236" text-anchor="middle" font-size="12" fill="#9fe3ec">FPR cai e TFG fica → a FF SOBE</text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#cdd9e3">é assim que a Ang II protege a TFG; o IECA reverte (FF↓, creatinina↑ esperada)</text>
</svg>

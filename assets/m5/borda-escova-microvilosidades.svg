<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A borda em escova — superfície gigante para reabsorver</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">microvilosidades multiplicam a área apical; é onde moram os transportadores</text>

  <!-- célula -->
  <rect x="60" y="120" width="560" height="120" fill="#10202c" stroke="#3a4a58"/>
  <text x="80" y="200" font-size="11" fill="#9fb1c0">citoplasma do TCP</text>
  <!-- microvilosidades -->
  <g stroke="#39c0c8" stroke-width="5" stroke-linecap="round">
    <line x1="90" y1="120" x2="90" y2="80"/><line x1="110" y1="120" x2="110" y2="76"/><line x1="130" y1="120" x2="130" y2="82"/>
    <line x1="150" y1="120" x2="150" y2="78"/><line x1="170" y1="120" x2="170" y2="84"/><line x1="190" y1="120" x2="190" y2="78"/>
    <line x1="210" y1="120" x2="210" y2="82"/><line x1="230" y1="120" x2="230" y2="78"/><line x1="250" y1="120" x2="250" y2="84"/>
    <line x1="270" y1="120" x2="270" y2="80"/><line x1="290" y1="120" x2="290" y2="78"/><line x1="310" y1="120" x2="310" y2="82"/>
    <line x1="330" y1="120" x2="330" y2="78"/><line x1="350" y1="120" x2="350" y2="84"/><line x1="370" y1="120" x2="370" y2="80"/>
    <line x1="390" y1="120" x2="390" y2="78"/><line x1="410" y1="120" x2="410" y2="82"/><line x1="430" y1="120" x2="430" y2="78"/>
    <line x1="450" y1="120" x2="450" y2="84"/><line x1="470" y1="120" x2="470" y2="80"/><line x1="490" y1="120" x2="490" y2="78"/>
    <line x1="510" y1="120" x2="510" y2="82"/><line x1="530" y1="120" x2="530" y2="78"/><line x1="550" y1="120" x2="550" y2="84"/>
  </g>
  <text x="340" y="68" text-anchor="middle" font-size="10" fill="#9fe3ec">borda em escova (lado da LUZ tubular)</text>
  <!-- transportadores marcados -->
  <circle cx="150" cy="120" r="6" fill="#e8a13a"/><text x="150" y="252" text-anchor="middle" font-size="9" fill="#e8a13a">SGLT2</text>
  <circle cx="340" cy="120" r="6" fill="#e0556b"/><text x="340" y="252" text-anchor="middle" font-size="9" fill="#e08a96">NHE3 (Na/H)</text>
  <circle cx="510" cy="120" r="6" fill="#52c08a"/><text x="510" y="252" text-anchor="middle" font-size="9" fill="#8fe0b0">anidrase carbônica</text>
  <text x="340" y="282" text-anchor="middle" font-size="10" fill="#9fb1c0">muita membrana = muito transporte = muita energia (Na⁺/K⁺-ATPase basolateral)</text>
</svg>

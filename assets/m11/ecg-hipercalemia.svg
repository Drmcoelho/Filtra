<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">ECG da HIPERcalemia — a progressão que precede a parada</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">despolarização lenta + repolarização rápida: a sequência sobe com a caliemia</text>

  <!-- normal -->
  <text x="120" y="78" text-anchor="middle" font-size="11" fill="#9fe3ec">K 4 — normal</text>
  <path d="M40,130 h20 l8,-6 l6,12 l8,-40 l8,40 l6,-6 h12 q10,0 14,-14 q4,14 14,14 h20" fill="none" stroke="#52c08a" stroke-width="2"/>
  <!-- T apiculada -->
  <text x="300" y="78" text-anchor="middle" font-size="11" fill="#f0c078">K 6 — T apiculada</text>
  <path d="M220,130 h20 l8,-6 l6,12 l8,-40 l8,40 l6,-6 h10 q14,0 18,-34 q4,34 18,34 h16" fill="none" stroke="#e8a13a" stroke-width="2"/>
  <!-- QRS alargado -->
  <text x="480" y="78" text-anchor="middle" font-size="11" fill="#e08a96">K 7+ — QRS alargado</text>
  <path d="M400,130 q14,0 16,-8 q14,-30 26,30 q6,16 18,-22 q10,30 22,16 h12" fill="none" stroke="#e0556b" stroke-width="2"/>

  <!-- sine wave -->
  <text x="340" y="200" text-anchor="middle" font-size="11" fill="#e0556b" font-weight="bold">K muito alto — onda sinusoidal → parada</text>
  <path d="M60,235 q40,-40 80,0 q40,40 80,0 q40,-40 80,0 q40,40 80,0 q40,-40 80,0 q40,40 80,0 q40,-40 80,0" fill="none" stroke="#e0556b" stroke-width="2.5"/>
  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#9fb1c0">cálcio IV estabiliza a membrana (não baixa o K); depois shift (insulina/β) e remoção (diálise, M33/M35)</text>
</svg>

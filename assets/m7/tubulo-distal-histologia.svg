  <rect x="398" y="232" width="16" height="22" rx="3" fill="#e0556b"/>
  <text x="438" y="312" text-anchor="middle" font-size="9" fill="#e0556b">Na⁺/K⁺-ATPase</text>
  <text x="320" y="348" text-anchor="middle" font-size="9" fill="#9fb1c0" opacity="0.6">①lúmen ②mitocôndrias ③NCC apical ④sangue · FILTRA · CRM-SP 151.318 · Dr. Matheus M. Coelho</text>

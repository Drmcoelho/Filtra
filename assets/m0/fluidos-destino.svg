<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Para onde vai 1 L de cada fluido (ICF × ECF)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a tonicidade decide o destino — azul = ICF (célula), ciano = ECF</text>

  <!-- legenda -->
  <rect x="250" y="56" width="16" height="12" fill="#3a7bd5" fill-opacity="0.7"/><text x="272" y="66" font-size="10" fill="#9fb1c0">ICF</text>
  <rect x="330" y="56" width="16" height="12" fill="#39c0c8" fill-opacity="0.7"/><text x="352" y="66" font-size="10" fill="#9fb1c0">ECF</text>

  <!-- linhas: cada fluido uma barra de 1000 mL -->
  <g font-size="12" fill="#e7eef4">
    <text x="20" y="100">SG 5%</text>
    <rect x="120" y="86" width="347" height="20" fill="#3a7bd5" fill-opacity="0.7"/><rect x="467" y="86" width="173" height="20" fill="#39c0c8" fill-opacity="0.7"/>
    <text x="124" y="101" font-size="10" fill="#06121a">~2/3 ICF (água livre)</text>

    <text x="20" y="140">SF 0,9%</text>
    <rect x="120" y="126" width="0" height="20"/><rect x="120" y="126" width="520" height="20" fill="#39c0c8" fill-opacity="0.7"/>
    <text x="128" y="141" font-size="10" fill="#06121a">~todo no ECF (mas Cl⁻ alto → acidose)</text>

    <text x="20" y="180">Ringer</text>
    <rect x="120" y="166" width="520" height="20" fill="#39c0c8" fill-opacity="0.7"/>
    <text x="128" y="181" font-size="10" fill="#06121a">~todo no ECF (mais fisiológico)</text>

    <text x="20" y="220">Coloide</text>
    <rect x="120" y="206" width="520" height="20" fill="#2f8f96" fill-opacity="0.8"/>
    <text x="128" y="221" font-size="10" fill="#06121a">fica no ECF/plasma (oncótico)</text>

    <text x="20" y="262">NaCl 3%</text>
    <rect x="120" y="248" width="600" height="20" fill="#39c0c8" fill-opacity="0.7" transform="translate(0,0)"/>
    <rect x="120" y="248" width="80" height="20" fill="#e0556b" fill-opacity="0.6"/>
    <text x="128" y="263" font-size="10" fill="#06121a">expande o ECF e PUXA água da célula (ICF↓)</text>
  </g>
  <text x="340" y="296" text-anchor="middle" font-size="10" fill="#9fb1c0">reponha VOLUME (ECF) com cristaloide; reponha ÁGUA (ICF) com SG 5%</text>
</svg>

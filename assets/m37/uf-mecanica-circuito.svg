<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Arial,sans-serif">
  <rect width="640" height="360" fill="#0d141b"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Ultrafiltração mecânica — remove volume direto, sem o túbulo</text>
  <!-- paciente -->
  <circle cx="100" cy="180" r="40" fill="#39c0c8" fill-opacity="0.15" stroke="#39c0c8"/>
  <text x="100" y="184" text-anchor="middle" font-size="11" fill="#39c0c8">paciente</text>
  <!-- linha de saída -->
  <defs><marker id="fl" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#e7eef4"/></marker></defs>
  <line x1="140" y1="160" x2="240" y2="130" stroke="#e0556b" stroke-width="4" marker-end="url(#fl)"/>
  <!-- filtro -->
  <rect x="245" y="95" width="60" height="170" rx="8" fill="#1b242d" stroke="#9fb1c0" stroke-width="1.5"/>
  <text x="275" y="90" text-anchor="middle" font-size="11" fill="#9fb1c0">filtro</text>
  <line x1="252" y1="110" x2="298" y2="110" stroke="#5b8dd6" stroke-width="1"/>
  <line x1="252" y1="130" x2="298" y2="130" stroke="#5b8dd6" stroke-width="1"/>
  <line x1="252" y1="150" x2="298" y2="150" stroke="#5b8dd6" stroke-width="1"/>
  <line x1="252" y1="170" x2="298" y2="170" stroke="#5b8dd6" stroke-width="1"/>
  <!-- retorno -->
  <line x1="305" y1="220" x2="145" y2="200" stroke="#52c08a" stroke-width="4" marker-end="url(#fl)"/>
  <!-- ultrafiltrado removido -->
  <line x1="275" y1="265" x2="275" y2="320" stroke="#e8a13a" stroke-width="5" marker-end="url(#fl)"/>
  <text x="330" y="300" font-size="12" fill="#e8a13a">ultrafiltrado: TMP empurra água/plasma (mL/h)</text>
  <!-- texto explicativo direita -->
  <text x="360" y="120" font-size="12" fill="#52c08a">Taxa FIXA (mL/h) de remoção de volume.</text>
  <text x="360" y="142" font-size="12" fill="#9fb1c0">Independe da resposta tubular —</text>
  <text x="360" y="162" font-size="12" fill="#9fb1c0">resgata quando o diurético FALHA.</text>
  <text x="360" y="190" font-size="11" fill="#e0556b">Mas: acesso + anticoagulação;</text>
  <text x="360" y="208" font-size="11" fill="#e0556b">NÃO ajusta eletrólitos como o rim;</text>
  <text x="360" y="226" font-size="11" fill="#e0556b">UF deve ficar &lt; refilling (M23/M24).</text>
  <text x="320" y="350" text-anchor="middle" font-size="10" fill="#5f7384">FILTRA · DIALISA · M37</text>
</svg>

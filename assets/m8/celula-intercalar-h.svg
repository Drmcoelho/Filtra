<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="h" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0556b"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Células intercalares — o ajuste fino do ácido-base</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">α secreta H⁺ (gera novo HCO₃); β secreta HCO₃ — o rim escolhe conforme a necessidade</text>

  <!-- alfa -->
  <rect x="40" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">Intercalar α (acidose → excreta ácido)</text>
  <text x="60" y="122" font-size="11" fill="#e7eef4">• H⁺-ATPase secreta H⁺ na urina</text>
  <text x="60" y="148" font-size="11" fill="#e7eef4">• gera NOVO HCO₃ para o sangue</text>
  <text x="60" y="174" font-size="11" fill="#e7eef4">• tampões urinários: NH₄⁺ e fosfato</text>
  <text x="60" y="206" font-size="10" fill="#9fb1c0">defeito → acidose tubular renal distal (tipo 1)</text>
  <line x1="200" y1="220" x2="240" y2="220" stroke="#e0556b" stroke-width="2.5" marker-end="url(#h)"/><text x="252" y="224" font-size="10" fill="#e08a96">H⁺→urina</text>

  <!-- beta -->
  <rect x="350" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">Intercalar β (alcalose → excreta base)</text>
  <text x="370" y="122" font-size="11" fill="#e7eef4">• secreta HCO₃ na urina</text>
  <text x="370" y="148" font-size="11" fill="#e7eef4">• retém H⁺ (corrige a alcalose)</text>
  <text x="370" y="180" font-size="10" fill="#9fb1c0">a aldosterona favorece a secreção de H⁺ (α)</text>
  <text x="370" y="206" font-size="10" fill="#9fb1c0">→ hiperaldo dá alcalose; hipoaldo, acidose (tipo 4)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A fita reagente — barata, rápida, e o que ela NÃO vê</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">triagem útil, mas a dosagem quantitativa e a microscopia confirmam</text>

  <!-- fita -->
  <rect x="60" y="70" width="40" height="200" rx="6" fill="#1b242d" stroke="#3a4a58"/>
  <rect x="66" y="80" width="28" height="20" fill="#e8d24a"/><rect x="66" y="104" width="28" height="20" fill="#7ec07e"/>
  <rect x="66" y="128" width="28" height="20" fill="#c97e7e"/><rect x="66" y="152" width="28" height="20" fill="#7e9ec0"/>
  <rect x="66" y="176" width="28" height="20" fill="#c0a050"/><rect x="66" y="200" width="28" height="20" fill="#9e7ec0"/>

  <g font-size="11" fill="#e7eef4">
    <text x="120" y="95">pH (5–8) e densidade — concentração</text>
    <text x="120" y="119">proteína: detecta ALBUMINA (não cadeias leves!)</text>
    <text x="120" y="143">sangue: hemácias × mioglobina (não distingue)</text>
    <text x="120" y="167">glicose: limiar/SGLT2 (ponte M5)</text>
    <text x="120" y="191">leucócito-esterase / nitrito: infecção</text>
    <text x="120" y="215">cetonas: cetoacidose/jejum</text>
  </g>
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#e8a13a">armadilha: proteína "negativa" NÃO exclui mieloma (cadeias leves passam batido) → pedir relação proteína/Cr</text>
  <text x="340" y="276" text-anchor="middle" font-size="9" fill="#9fb1c0">sangue "positivo" sem hemácias na microscopia = mioglobina (rabdomiólise) ou hemoglobina</text>
</svg>

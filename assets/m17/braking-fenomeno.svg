<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O fenômeno do "braking" — a tolerância ao diurético</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o uso crônico hipertrofia o néfron distal → ele reabsorve mais → a mesma dose rende menos</text>

  <line x1="70" y1="250" x2="640" y2="250" stroke="#3a4a58"/>
  <line x1="70" y1="64" x2="70" y2="250" stroke="#3a4a58"/>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="#9fb1c0">dose →</text>
  <text x="30" y="160" font-size="11" fill="#9fb1c0" transform="rotate(-90 30 160)">natriurese</text>

  <path d="M80,242 C200,200 280,110 380,92 C480,82 580,80 630,79" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <text x="470" y="74" font-size="10" fill="#9fe3ec">resposta inicial</text>
  <path d="M80,246 C220,224 320,170 420,156 C500,148 580,146 630,145" fill="none" stroke="#e0556b" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="450" y="140" font-size="10" fill="#e08a96">após dias (braking): curva desce e desloca à direita</text>

  <rect x="120" y="170" width="300" height="56" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="270" y="192" text-anchor="middle" font-size="10" fill="#f0c078">causas: hipertrofia do TCD/ducto + ativação do RAAS</text>
  <text x="270" y="212" text-anchor="middle" font-size="10" fill="#9fb1c0">+ retenção pós-dose (rebote de Na quando o fármaco some)</text>

  <text x="340" y="296" text-anchor="middle" font-size="9" fill="#e8a13a">contramedidas: restrição de sal, dose mais frequente/contínua, e bloqueio sequencial (tiazídico)</text>
</svg>

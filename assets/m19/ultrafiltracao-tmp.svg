<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Ultrafiltração — remover VOLUME por pressão (TMP)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">Jv = Kuf · TMP: a água é empurrada através da membrana; independe da concentração</text>

  <text x="340" y="82" text-anchor="middle" font-size="16" fill="#e7eef4">Jv = Kuf · TMP</text>

  <!-- gráfico linear Jv x TMP -->
  <line x1="70" y1="250" x2="380" y2="250" stroke="#3a4a58"/>
  <line x1="70" y1="110" x2="70" y2="250" stroke="#3a4a58"/>
  <text x="225" y="270" text-anchor="middle" font-size="10" fill="#9fb1c0">TMP (mmHg) →</text>
  <text x="40" y="180" font-size="10" fill="#9fb1c0" transform="rotate(-90 40 180)">Jv (mL/min)</text>
  <line x1="70" y1="250" x2="360" y2="130" stroke="#3a7bd5" stroke-width="3"/>
  <text x="300" y="135" font-size="9" fill="#9bbef0">inclinação = Kuf</text>

  <g font-size="11" fill="#e7eef4">
    <text x="410" y="130">• TMP = pressão transmembrana (mmHg)</text>
    <text x="410" y="156">• Kuf = permeabilidade hidráulica</text>
    <text x="428" y="172" fill="#9fb1c0" font-size="9">(high-flux: Kuf alto; low-flux: baixo)</text>
    <text x="410" y="198">• define o BALANÇO de volume do paciente</text>
    <text x="410" y="224" fill="#e8a13a">a convecção pega carona no Jv</text>
    <text x="410" y="244" fill="#9fb1c0" font-size="9">(arrasta soluto junto com a água)</text>
  </g>
  <text x="340" y="290" text-anchor="middle" font-size="9" fill="#9fb1c0">UF excessiva → hipotensão intradialítica (M24): tirar água mais rápido que o refilling</text>
</svg>

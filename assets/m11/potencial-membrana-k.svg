<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O K⁺ define o potencial de repouso (Nernst) — por isso mata</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">Em ≈ −61 · log(K_dentro / K_fora): a caliemia FORA muda a excitabilidade da membrana</text>

  <line x1="70" y1="250" x2="640" y2="250" stroke="#3a4a58"/>
  <line x1="70" y1="66" x2="70" y2="250" stroke="#3a4a58"/>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="#9fb1c0">K⁺ plasmático (mEq/L) →</text>
  <text x="28" y="160" font-size="11" fill="#9fb1c0" transform="rotate(-90 28 160)">Em (mV)</text>
  <!-- Nernst: K baixo = Em mais negativo (baixo no eixo); K alto = menos negativo (alto) -->
  <path d="M90,235 C200,210 300,180 380,165 C470,148 560,130 620,120" fill="none" stroke="#39c0c8" stroke-width="3"/>
  <line x1="360" y1="66" x2="360" y2="250" stroke="#52c08a" stroke-dasharray="3 3"/>
  <text x="360" y="80" text-anchor="middle" font-size="9" fill="#9fb1c0">K⁺ 4 → Em ≈ −90 mV (normal)</text>
  <text x="150" y="220" font-size="10" fill="#9bbef0">hipocalemia: Em mais negativo</text>
  <text x="150" y="234" font-size="9" fill="#9fb1c0">(hiperpolariza → arritmia/U)</text>
  <text x="470" y="112" font-size="10" fill="#e08a96">hipercalemia: Em menos negativo</text>
  <text x="470" y="126" font-size="9" fill="#9fb1c0">(despolariza → inexcitável, parada)</text>
  <text x="340" y="296" text-anchor="middle" font-size="9" fill="#e8a13a">os DOIS extremos são fatais — esta é a mesma curva do Instrumento (computada pelo engine)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">FE_Na e FE_ureia — a fração do que é filtrado e excretado</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">"fração de excreção" = quanto do filtrado escapa; baixa = túbulo reabsorvendo avidamente</text>

  <rect x="40" y="64" width="600" height="40" rx="8" fill="#0c2330" stroke="#39c0c8"/>
  <text x="340" y="82" text-anchor="middle" font-size="13" fill="#9fe3ec">FE_Na = (U_Na · P_Cr) / (P_Na · U_Cr) × 100</text>
  <text x="340" y="98" text-anchor="middle" font-size="9" fill="#9fb1c0">corrige a concentração urinária usando a creatinina como referência do quanto se filtrou</text>

  <rect x="40" y="116" width="600" height="40" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="340" y="134" text-anchor="middle" font-size="13" fill="#f0c078">FE_ureia = (U_ureia · P_Cr) / (P_ureia · U_Cr) × 100</text>
  <text x="340" y="150" text-anchor="middle" font-size="9" fill="#9fb1c0">use quando o paciente está em DIURÉTICO — a FE_Na fica falsamente alta</text>

  <rect x="40" y="172" width="290" height="100" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="185" y="194" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">FE baixa → pré-renal</text>
  <text x="56" y="218" font-size="10" fill="#cdd9e3">FE_Na &lt; 1% · FE_ureia &lt; 35%</text>
  <text x="56" y="240" font-size="10" fill="#cdd9e3">o túbulo segura o Na (e a ureia)</text>
  <text x="56" y="262" font-size="9" fill="#9fb1c0">porque a perfusão caiu, não o túbulo</text>

  <rect x="350" y="172" width="290" height="100" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="495" y="194" text-anchor="middle" font-size="11" fill="#e08a96" font-weight="bold">FE alta → NTA</text>
  <text x="366" y="218" font-size="10" fill="#cdd9e3">FE_Na &gt; 2% · FE_ureia &gt; 50%</text>
  <text x="366" y="240" font-size="10" fill="#cdd9e3">o túbulo lesado não consegue reabsorver</text>
  <text x="366" y="262" font-size="9" fill="#9fb1c0">o Na escapa para a urina</text>
</svg>

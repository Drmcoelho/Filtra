<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0556b"/></marker></defs>
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O multiplicador contracorrente — como um pequeno passo vira uma grande pilha</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o TAL cria um gradiente horizontal de ~200; o fluxo em alça o "multiplica" na vertical</text>

  <!-- grampo com níveis -->
  <path d="M250,70 L250,250 Q250,282 300,282 Q350,282 350,250 L350,70" fill="none" stroke="#3a4a58" stroke-width="2"/>
  <g font-size="9" fill="#9fb1c0" text-anchor="middle">
    <text x="220" y="100">300</text><text x="380" y="100">100</text>
    <text x="220" y="160">600</text><text x="380" y="160">400</text>
    <text x="220" y="230">900</text><text x="380" y="230">700</text>
    <text x="300" y="276">1200 (interstício)</text>
  </g>
  <!-- setas do passo horizontal (TAL bombeia ~200) -->
  <g stroke="#e0556b" stroke-width="2" marker-end="url(#m)">
    <line x1="352" y1="110" x2="430" y2="110"/><line x1="352" y1="170" x2="430" y2="170"/><line x1="352" y1="230" x2="430" y2="230"/>
  </g>
  <text x="470" y="114" font-size="10" fill="#e08a96">passo único do TAL</text>
  <text x="470" y="174" font-size="10" fill="#e08a96">(~200 mOsm por nível)</text>
  <text x="470" y="234" font-size="10" fill="#e08a96">repetido ao longo da alça</text>
  <text x="170" y="120" font-size="10" fill="#9bbef0">descendente</text>
  <text x="170" y="240" font-size="10" fill="#9bbef0">(equilibra c/ interstício)</text>

  <text x="340" y="306" text-anchor="middle" font-size="10" fill="#e8a13a">resultado: gradiente vertical de 300 → 1200, muito maior que o passo único</text>
</svg>

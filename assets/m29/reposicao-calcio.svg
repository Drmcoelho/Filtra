<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0d1b16" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a7a4a" stroke-width="2"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#bfe9cf">Reposição de cálcio — dois alvos, dois pontos</text>
  <!-- eixo Ca²⁺ -->
  <line x1="80" y1="260" x2="80" y2="60" stroke="#7fb0c8" stroke-width="2"/>
  <text x="40" y="160" text-anchor="middle" font-size="12" fill="#9fc8d8" transform="rotate(-90 40 160)">Ca²⁺ ionizado (mmol/L)</text>
  <!-- faixa circuito alvo (baixa) -->
  <rect x="120" y="220" width="160" height="30" fill="#e8a13a" fill-opacity="0.25" stroke="#e8a13a"/>
  <text x="200" y="240" text-anchor="middle" font-size="12" fill="#f0c98a">circuito 0,25–0,35</text>
  <text x="200" y="270" text-anchor="middle" font-size="11" fill="#e8a13a">alvo BAIXO → anticoagula</text>
  <!-- faixa sistêmica alvo (normal) -->
  <rect x="360" y="110" width="160" height="30" fill="#52c08a" fill-opacity="0.25" stroke="#52c08a"/>
  <text x="440" y="130" text-anchor="middle" font-size="12" fill="#8fe0b0">sistêmico 1,1–1,3</text>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#52c08a">alvo NORMAL → seguro</text>
  <!-- seta de reposição -->
  <path d="M280 235 Q330 100 360 125" fill="none" stroke="#52c08a" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#52c08a"/></marker></defs>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#52c08a">repõe cálcio (mmol/h)</text>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="#6fae8a">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

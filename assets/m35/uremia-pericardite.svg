<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui,Segoe UI,sans-serif">
  <rect width="640" height="320" fill="#0f161d"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#e7eef4">U — Uremia SINTOMÁTICA (não o número da ureia)</text>
  <!-- coração com pericardite -->
  <g transform="translate(110,70)">
    <path d="M70 40 C70 20 100 18 100 42 C100 18 130 20 130 40 C130 70 100 95 100 100 C100 95 70 70 70 40 Z" fill="#e0556b" opacity="0.6" stroke="#e0556b"/>
    <ellipse cx="100" cy="62" rx="62" ry="58" fill="none" stroke="#e8a13a" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="100" y="150" text-anchor="middle" font-size="11" fill="#e8a13a">atrito pericárdico</text>
    <text x="100" y="166" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">pericardite urêmica</text>
  </g>
  <!-- cérebro com encefalopatia -->
  <g transform="translate(370,70)">
    <path d="M40 60 C20 40 40 18 70 26 C90 12 130 20 130 45 C150 50 145 80 120 86 C115 105 80 108 70 92 C45 98 35 80 40 60 Z" fill="#c879e0" opacity="0.45" stroke="#c879e0"/>
    <path d="M55 55 q15 -10 30 0 M70 75 q15 -8 28 2" fill="none" stroke="#c879e0" stroke-width="1.5"/>
    <text x="92" y="150" text-anchor="middle" font-size="11" fill="#c879e0">asterixis, confusão, coma</text>
    <text x="92" y="166" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">encefalopatia urêmica</text>
  </g>
  <!-- barra ureia -->
  <line x1="70" y1="220" x2="570" y2="220" stroke="#3a4a58"/>
  <text x="70" y="245" font-size="11" fill="#9fb1c0">ureia 180</text><text x="500" y="245" font-size="11" fill="#9fb1c0">ureia 300 mg/dL</text>
  <rect x="70" y="208" width="500" height="12" fill="#9fb1c0" opacity="0.12"/>
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#e7eef4">a ureia alta PREDISPÕE; o que DISPARA é o sintoma (pericardite/encefalopatia)</text>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#9fb1c0">ureia 250 assintomática NÃO indica; ureia 180 com pericardite indica</text>
</svg>

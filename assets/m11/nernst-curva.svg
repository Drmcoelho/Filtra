<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A janela estreita — por que tanto a alta quanto a baixa matam</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a faixa segura (3,5–5,0) é estreita; fora dela, a excitabilidade do miocárdio falha</text>

  <rect x="70" y="70" width="540" height="160" rx="6" fill="#0a1016" stroke="#283642"/>
  <!-- faixas -->
  <rect x="70" y="70" width="120" height="160" fill="#3a214a" fill-opacity="0.4"/>
  <rect x="470" y="70" width="140" height="160" fill="#7a2330" fill-opacity="0.4"/>
  <rect x="250" y="70" width="160" height="160" fill="#0f3a40" fill-opacity="0.5"/>
  <line x1="250" y1="70" x2="250" y2="230" stroke="#52c08a" stroke-dasharray="3 3"/>
  <line x1="410" y1="70" x2="410" y2="230" stroke="#52c08a" stroke-dasharray="3 3"/>

  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#c9a0e0" font-weight="bold">&lt; 2,5</text>
  <text x="130" y="170" text-anchor="middle" font-size="9" fill="#d7baf0">hipoK grave</text>
  <text x="130" y="184" text-anchor="middle" font-size="9" fill="#9fb1c0">U, TV/TdP</text>

  <text x="330" y="150" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">3,5 – 5,0</text>
  <text x="330" y="170" text-anchor="middle" font-size="9" fill="#cdd9e3">faixa segura</text>

  <text x="540" y="150" text-anchor="middle" font-size="11" fill="#e08a96" font-weight="bold">&gt; 6,0</text>
  <text x="540" y="170" text-anchor="middle" font-size="9" fill="#e8a8b2">hiperK grave</text>
  <text x="540" y="184" text-anchor="middle" font-size="9" fill="#9fb1c0">QRS, sinusoidal</text>

  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#e7eef4">o K⁺ plasmático mexe no potencial de repouso → na velocidade de condução</text>
  <text x="340" y="276" text-anchor="middle" font-size="9" fill="#e8a13a">o engine computa Em e o achado de ECG para cada caliemia (ver Instrumento)</text>
</svg>

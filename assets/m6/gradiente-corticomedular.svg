<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O gradiente corticomedular — de 300 (córtex) a 1200 (papila)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">é a "pilha" osmótica que o TAL carrega; sem ela não se concentra a urina</text>

  <!-- coluna com gradiente -->
  <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d4e74"/><stop offset="100%" stop-color="#7a2330"/></linearGradient></defs>
  <rect x="200" y="64" width="120" height="220" fill="url(#grad)" stroke="#3a4a58"/>
  <text x="260" y="84" text-anchor="middle" font-size="10" fill="#dcebff">CÓRTEX · 300</text>
  <text x="260" y="170" text-anchor="middle" font-size="10" fill="#e7eef4">medula · 600</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#ffd0d6">PAPILA · 1200 mOsm</text>

  <!-- escala -->
  <text x="180" y="70" text-anchor="end" font-size="9" fill="#9fb1c0">300</text>
  <text x="180" y="180" text-anchor="end" font-size="9" fill="#9fb1c0">600–900</text>
  <text x="180" y="284" text-anchor="end" font-size="9" fill="#9fb1c0">1200</text>

  <rect x="360" y="80" width="280" height="190" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="500" y="104" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">Quem mantém a pilha</text>
  <text x="376" y="132" font-size="11" fill="#cdd9e3">• TAL bombeia NaCl (NKCC2) → o motor</text>
  <text x="376" y="158" font-size="11" fill="#cdd9e3">• reciclagem de UREIA (ducto medular)</text>
  <text x="376" y="184" font-size="11" fill="#cdd9e3">• vasa recta: troca contracorrente preserva</text>
  <text x="376" y="216" font-size="11" fill="#e8a13a">diurético de alça → derruba a pilha →</text>
  <text x="376" y="236" font-size="11" fill="#e8a13a">isostenúria (urina ~300, nem concentra</text>
  <text x="376" y="252" font-size="11" fill="#e8a13a">nem dilui ao máximo)</text>
</svg>

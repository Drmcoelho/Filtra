<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A impressão digital: FE_Na × osmolalidade urinária</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#9fb1c0">um mapa de duas dimensões separa pré-renal (canto superior esquerdo) de NTA (inferior direito)</text>

  <line x1="70" y1="60" x2="70" y2="280" stroke="#3a4a58"/>
  <line x1="70" y1="280" x2="640" y2="280" stroke="#3a4a58"/>
  <text x="355" y="306" text-anchor="middle" font-size="11" fill="#9fb1c0">FE_Na (%) →</text>
  <text x="30" y="170" font-size="11" fill="#9fb1c0" transform="rotate(-90 30 170)">U_osm (mOsm/kg)</text>

  <!-- zona pré-renal (FENa baixo, Uosm alto) -->
  <rect x="70" y="70" width="120" height="90" fill="#52c08a" fill-opacity="0.18" stroke="#52c08a"/>
  <text x="130" y="100" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">pré-renal</text>
  <text x="130" y="118" text-anchor="middle" font-size="9" fill="#cdd9e3">FE_Na &lt;1</text>
  <text x="130" y="132" text-anchor="middle" font-size="9" fill="#cdd9e3">U_osm &gt;500</text>
  <circle cx="120" cy="95" r="5" fill="#52c08a"/>

  <!-- zona NTA (FENa alto, Uosm baixo) -->
  <rect x="360" y="200" width="280" height="80" fill="#e0556b" fill-opacity="0.16" stroke="#e0556b"/>
  <text x="500" y="232" text-anchor="middle" font-size="11" fill="#e08a96" font-weight="bold">NTA</text>
  <text x="500" y="250" text-anchor="middle" font-size="9" fill="#cdd9e3">FE_Na &gt;2 · U_osm ~iso</text>
  <circle cx="520" cy="255" r="5" fill="#e0556b"/>

  <!-- seta de progressão -->
  <path d="M150,110 Q330,170 500,245" fill="none" stroke="#e8a13a" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="330" y="160" text-anchor="middle" font-size="9" fill="#f0c078">a avidez tubular caindo move o ponto</text>

  <text x="340" y="300" text-anchor="middle" font-size="9" fill="#9fb1c0">é exatamente o Instrumento computado deste módulo (renalLayout, do engine)</text>
</svg>

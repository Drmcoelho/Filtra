<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs>
    <marker id="o1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0556b"/></marker>
    <marker id="i1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52c08a"/></marker>
  </defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O pH troca H⁺ por K⁺ na membrana</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a célula tampona o H⁺ entrando — e, para manter a carga, expele K⁺ (e vice-versa)</text>

  <rect x="40" y="70" width="290" height="150" rx="10" fill="#10202c" stroke="#e0556b"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">ACIDOSE (H⁺ alto)</text>
  <line x1="120" y1="130" x2="200" y2="130" stroke="#e8a13a" stroke-width="2" marker-end="url(#i1)"/>
  <text x="60" y="126" font-size="10" fill="#f0c078">H⁺ entra</text>
  <line x1="240" y1="160" x2="160" y2="160" stroke="#e0556b" stroke-width="2" marker-end="url(#o1)"/>
  <text x="250" y="164" font-size="10" fill="#e08a96">K⁺ sai</text>
  <text x="185" y="200" text-anchor="middle" font-size="11" fill="#e7eef4">→ caliemia ↑ (~0,4 / 0,1 pH)</text>

  <rect x="350" y="70" width="290" height="150" rx="10" fill="#10202c" stroke="#3a7bd5"/>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">ALCALOSE (H⁺ baixo)</text>
  <line x1="430" y1="130" x2="510" y2="130" stroke="#e8a13a" stroke-width="2" marker-end="url(#o1)"/>
  <text x="540" y="126" font-size="10" fill="#f0c078">H⁺ sai</text>
  <line x1="550" y1="160" x2="470" y2="160" stroke="#52c08a" stroke-width="2" marker-end="url(#i1)"/>
  <text x="560" y="164" font-size="10" fill="#9fe3ec">K⁺ entra</text>
  <text x="495" y="200" text-anchor="middle" font-size="11" fill="#e7eef4">→ caliemia ↓</text>

  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#e8a13a">por isso a acidose da CAD mostra K plasmático normal/alto com o ESTOQUE depletado</text>
  <text x="340" y="274" text-anchor="middle" font-size="9" fill="#9fb1c0">acidose metabólica mineral muda mais o K que a respiratória ou a por ácidos orgânicos</text>
</svg>

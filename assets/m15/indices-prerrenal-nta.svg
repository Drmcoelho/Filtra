<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A urina conta a história — pré-renal × NTA</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">na pré-renal o túbulo está ÍNTEGRO e ávido; na NTA está LESADO e não reabsorve</text>

  <g font-size="11">
    <rect x="24" y="60" width="632" height="28" fill="#10202c" stroke="#283642"/>
    <text x="40" y="79" fill="#9fb1c0">Índice</text><text x="320" y="79" fill="#9fe3ec">Pré-renal (íntegro)</text><text x="510" y="79" fill="#e08a96">NTA (lesado)</text>

    <rect x="24" y="88" width="632" height="30" fill="#0c2330"/>
    <text x="40" y="108" fill="#e7eef4">FE_Na</text><text x="320" y="108" fill="#9fe3ec">&lt; 1%</text><text x="510" y="108" fill="#e08a96">&gt; 2%</text>
    <rect x="24" y="118" width="632" height="30" fill="#10202c"/>
    <text x="40" y="138" fill="#e7eef4">FE_ureia (se diurético)</text><text x="320" y="138" fill="#9fe3ec">&lt; 35%</text><text x="510" y="138" fill="#e08a96">&gt; 50%</text>
    <rect x="24" y="148" width="632" height="30" fill="#0c2330"/>
    <text x="40" y="168" fill="#e7eef4">Na urinário</text><text x="320" y="168" fill="#9fe3ec">&lt; 20 mEq/L</text><text x="510" y="168" fill="#e08a96">&gt; 40 mEq/L</text>
    <rect x="24" y="178" width="632" height="30" fill="#10202c"/>
    <text x="40" y="198" fill="#e7eef4">Osmolalidade urinária</text><text x="320" y="198" fill="#9fe3ec">&gt; 500 (concentra)</text><text x="510" y="198" fill="#e08a96">~300 (iso)</text>
    <rect x="24" y="208" width="632" height="30" fill="#0c2330"/>
    <text x="40" y="228" fill="#e7eef4">U/P creatinina</text><text x="320" y="228" fill="#9fe3ec">&gt; 40</text><text x="510" y="228" fill="#e08a96">&lt; 20</text>
    <rect x="24" y="238" width="632" height="30" fill="#10202c"/>
    <text x="40" y="258" fill="#e7eef4">BUN:Cr</text><text x="320" y="258" fill="#9fe3ec">&gt; 20</text><text x="510" y="258" fill="#e08a96">10–15</text>
    <rect x="24" y="268" width="632" height="30" fill="#0c2330"/>
    <text x="40" y="288" fill="#e7eef4">Sedimento</text><text x="320" y="288" fill="#9fe3ec">cilindros hialinos</text><text x="510" y="288" fill="#e08a96">granulosos (muddy brown)</text>
  </g>
  <text x="340" y="312" text-anchor="middle" font-size="9" fill="#e8a13a">todos co-variam: é a mesma avidez tubular vista por ângulos diferentes (o engine os calcula juntos)</text>
</svg>

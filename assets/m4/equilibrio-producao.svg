<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Por que Pcr ∝ produção / TFG — o equilíbrio de massa</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">no estado estável, o que entra (músculo) = o que sai (rim): produção = TFG × Pcr</text>

  <!-- entrada -->
  <rect x="40" y="110" width="160" height="70" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="120" y="138" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">produção</text>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="#cdd9e3">músculo (constante)</text>
  <line x1="200" y1="145" x2="270" y2="145" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#e)"/>

  <!-- pool -->
  <circle cx="340" cy="145" r="52" fill="#0f3540" stroke="#39c0c8" stroke-width="2"/>
  <text x="340" y="142" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">Pcr</text>
  <text x="340" y="160" text-anchor="middle" font-size="9" fill="#cdd9e3">(pool plasmático)</text>

  <!-- saída -->
  <line x1="392" y1="145" x2="462" y2="145" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#e)"/>
  <rect x="462" y="110" width="180" height="70" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="552" y="138" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">excreção</text>
  <text x="552" y="160" text-anchor="middle" font-size="10" fill="#cdd9e3">= TFG × Pcr</text>

  <rect x="120" y="206" width="440" height="68" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="340" y="230" text-anchor="middle" font-size="13" fill="#e7eef4">estável: produção = TFG × Pcr  ⟹  Pcr = produção / TFG</text>
  <text x="340" y="252" text-anchor="middle" font-size="10" fill="#9fb1c0">TFG cai → a excreção cai → o pool sobe até reequilibrar (daí a hipérbole)</text>
  <text x="340" y="268" text-anchor="middle" font-size="10" fill="#f0c078">e o reequilíbrio leva DIAS (cinética) — por isso a creatinina atrasa</text>
</svg>

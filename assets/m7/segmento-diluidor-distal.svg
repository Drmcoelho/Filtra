<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0a1016"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O segmento diluidor distal — reabsorve soluto SEM água</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#9fb1c0">o NCC tira NaCl; a parede é impermeável à água → a urina fica AINDA mais diluída</text>
  <!-- tubo -->
  <rect x="60" y="80" width="520" height="120" rx="14" fill="#16222b" stroke="#283642"/>
  <text x="320" y="74" text-anchor="middle" font-size="10" fill="#9fb1c0">lúmen do TCD →</text>
  <!-- entrada: já diluído pela alça -->
  <text x="92" y="130" text-anchor="middle" font-size="11" fill="#e7eef4">entra</text>
  <text x="92" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#39c0c8">~100</text>
  <text x="92" y="164" text-anchor="middle" font-size="9" fill="#9fb1c0">mOsm</text>
  <!-- NCC tirando NaCl -->
  <g>
    <rect x="240" y="195" width="18" height="24" rx="3" fill="#39c0c8"/>
    <text x="249" y="238" text-anchor="middle" font-size="10" fill="#39c0c8">NCC</text>
    <text x="249" y="252" text-anchor="middle" font-size="9" fill="#9fb1c0">Na⁺ + Cl⁻ saem</text>
    <path d="M249 195 L249 175" stroke="#39c0c8" stroke-width="2" marker-end="url(#dh)"/>
  </g>
  <!-- água NÃO sai -->
  <g>
    <text x="380" y="150" text-anchor="middle" font-size="26" fill="#e0556b">H₂O</text>
    <line x1="350" y1="200" x2="410" y2="240" stroke="#e0556b" stroke-width="3"/>
    <text x="380" y="262" text-anchor="middle" font-size="10" fill="#e0556b">água PRESA (impermeável)</text>
  </g>
  <!-- saída: mais diluído -->
  <text x="548" y="130" text-anchor="middle" font-size="11" fill="#e7eef4">sai</text>
  <text x="548" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#52c08a">~60</text>
  <text x="548" y="164" text-anchor="middle" font-size="9" fill="#9fb1c0">mOsm</text>
  <defs><marker id="dh" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#39c0c8"/></marker></defs>
  <!-- seta de fluxo -->
  <path d="M130 140 L500 140" stroke="#3a4a58" stroke-width="2" fill="none" marker-end="url(#fh)" opacity="0.5"/>
  <defs><marker id="fh" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#3a4a58"/></marker></defs>
  <!-- conclusão -->
  <rect x="80" y="290" width="480" height="46" rx="8" fill="#143038" stroke="#39c0c8"/>
  <text x="320" y="312" text-anchor="middle" font-size="12" fill="#e7eef4">Bloquear o NCC (tiazídico) = perder o diluidor → menos água livre excretada</text>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#e8a13a">+ contração de volume → ADH → HIPONATREMIA clássica do tiazídico</text>
  <text x="320" y="352" text-anchor="middle" font-size="9" fill="#9fb1c0" opacity="0.6">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

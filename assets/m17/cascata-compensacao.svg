<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8a13a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A cascata e a compensação — por que um diurético só "decepciona"</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">cada segmento reabsorve uma FRAÇÃO do que recebe; bloquear um aumenta a entrega ao próximo</text>

  <!-- fluxo de Na 100 -->
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="120" width="90" height="50" rx="6" fill="#0c2330" stroke="#39c0c8"/><text x="85" y="142" fill="#9fe3ec">filtrado</text><text x="85" y="158" fill="#e7eef4">100</text>
    <line x1="130" y1="145" x2="160" y2="145" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="160" y="120" width="90" height="50" rx="6" fill="#10202c" stroke="#39c0c8"/><text x="205" y="138" fill="#9fb1c0">alça</text><text x="205" y="158" fill="#e7eef4">bloqueada</text>
    <line x1="250" y1="145" x2="280" y2="145" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="280" y="120" width="120" height="50" rx="6" fill="#10202c" stroke="#e8a13a"/><text x="340" y="138" fill="#f0c078">TCD recebe MUITO</text><text x="340" y="158" fill="#e7eef4">e reabsorve mais</text>
    <line x1="400" y1="145" x2="430" y2="145" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="430" y="120" width="100" height="50" rx="6" fill="#10202c" stroke="#52c08a"/><text x="480" y="138" fill="#9fe3ec">excretado</text><text x="480" y="158" fill="#e7eef4">menos do</text>
    <text x="480" y="170" fill="#e7eef4" font-size="8">que se esperava</text>
  </g>

  <rect x="120" y="196" width="440" height="44" rx="8" fill="#0c2330" stroke="#52c08a"/>
  <text x="340" y="218" text-anchor="middle" font-size="11" fill="#9fe3ec">a solução: bloquear TAMBÉM o TCD (tiazídico) → ele não compensa → o Na escapa</text>
  <text x="340" y="234" text-anchor="middle" font-size="9" fill="#9fb1c0">é a mesma cascata que o engine resolve segmento a segmento</text>

  <text x="340" y="270" text-anchor="middle" font-size="10" fill="#e8a13a">a "decepção" do diurético isolado é fisiologia — não falha de adesão</text>
</svg>

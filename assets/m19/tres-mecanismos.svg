<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img"><rect width="440" height="300" fill="#0a1016"/><text x="220" y="24" fill="#e7eef4" font-size="15" font-family="system-ui,Segoe UI,Arial" text-anchor="middle" font-weight="bold">AS QUATRO FÍSICAS DA DIÁLISE</text><rect x="30" y="50" width="380" height="68" rx="8" fill="#10171e" stroke="#52c08a"/><text x="45" y="72" fill="#52c08a" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="start" font-weight="bold">SOLUTO</text><text x="150" y="72" fill="#e7eef4" font-size="11" font-family="system-ui,Segoe UI,Arial" text-anchor="start">difusão (gradiente de C)</text><text x="150" y="92" fill="#e7eef4" font-size="11" font-family="system-ui,Segoe UI,Arial" text-anchor="start">+ convecção (arraste pelo solvente)</text><text x="45" y="108" fill="#9fb1c0" font-size="9" font-family="system-ui,Segoe UI,Arial" text-anchor="start">escórias, K⁺, ureia, β2-m</text><rect x="30" y="128" width="380" height="58" rx="8" fill="#10171e" stroke="#39c0c8"/><text x="45" y="150" fill="#39c0c8" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="start" font-weight="bold">VOLUME</text><text x="150" y="150" fill="#e7eef4" font-size="11" font-family="system-ui,Segoe UI,Arial" text-anchor="start">ultrafiltração (TMP = P_hidro − P_onc)</text><text x="150" y="170" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="start">Q_uf = Kuf · TMP</text><rect x="30" y="196" width="380" height="54" rx="8" fill="#10171e" stroke="#e8a13a"/><text x="45" y="218" fill="#e8a13a" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="start" font-weight="bold">ADSORÇÃO</text><text x="150" y="218" fill="#e7eef4" font-size="11" font-family="system-ui,Segoe UI,Arial" text-anchor="start">ligação à membrana (saturável)</text><text x="150" y="238" fill="#9fb1c0" font-size="10" font-family="system-ui,Segoe UI,Arial" text-anchor="start">q = cap·C/(Kd+C) — os sítios lotam</text><text x="220" y="274" fill="#e7eef4" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="middle" font-weight="bold">a diálise NÃO substitui o rim:</text><text x="220" y="292" fill="#39c0c8" font-size="12" font-family="system-ui,Segoe UI,Arial" text-anchor="middle" font-weight="bold">substitui FUNÇÕES por física</text></svg>

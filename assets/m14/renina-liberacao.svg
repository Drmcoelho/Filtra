<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">Os três gatilhos da renina</title><desc id="desc">O rim integra pressão aferente, NaCl tubular e tônus simpático na célula granular.</desc><defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55cbd3"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e3ad4f"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e26464"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#68c58a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#eef5f4}.dim{fill:#aac0c4}.h{font-weight:800}.title{font-size:46px}.sub{font-size:21px}.m{font-size:24px}.s{font-size:18px}.xs{font-size:15px}.panel{fill:#101d27;stroke:#36505f;stroke-width:2}.panel2{fill:#152631;stroke:#36505f;stroke-width:2}.flow{fill:none;stroke:#55cbd3;stroke-width:4;marker-end:url(#arrow-cyan)}.goldflow{fill:none;stroke:#e3ad4f;stroke-width:4;marker-end:url(#arrow-gold)}.redflow{fill:none;stroke:#e26464;stroke-width:4;marker-end:url(#arrow-red)}.greenflow{fill:none;stroke:#68c58a;stroke-width:4;marker-end:url(#arrow-green)}
    </style>
  </defs>
  <rect width="1448" height="1086" fill="#071018"/>
  <text x="42" y="64" class="t h title"><tspan fill="#55cbd3">FILTRA</tspan><tspan fill="#e3ad4f"> · Os três gatilhos da renina</tspan></text>
  <text x="44" y="101" class="t sub dim">O rim integra pressão aferente, NaCl tubular e tônus simpático na célula granular.</text>
  <g transform="translate(36 118)">
    <rect width="210" height="206" rx="20" class="panel"/>
    <path d="M95 28C48 22 32 70 42 115c9 42 41 71 76 61 21-6 20-30 8-51-10-18-6-36 8-50 20-21 1-42-39-47Z" fill="#a64148" stroke="#ef8b83" stroke-width="4"/>
    <path d="M106 48c-24 9-32 36-27 61 5 24 20 41 37 42-9-20-8-42 6-62 10-14 5-31-16-41Z" fill="#e2a477" opacity=".72"/>
    <circle cx="114" cy="88" r="13" fill="#55cbd3"/><path d="M126 88H176" class="flow"/>
    <text x="20" y="190" class="t h s">Polo vascular</text>
    <text x="112" y="116" text-anchor="middle" class="t xs">zoom no JGA</text>
  </g>
  <g transform="translate(276 132)">
    <rect width="1138" height="830" rx="24" class="panel" filter="url(#shadow)"/>
    <text x="38" y="52" class="t h m" fill="#e3ad4f">CÉLULA GRANULAR DA ARTERÍOLA AFERENTE</text>
    <rect x="34" y="84" width="330" height="250" rx="18" class="panel2"/><text x="58" y="120" class="t h m">1 · ↓ ESTIRAMENTO</text>
    <path d="M72 185H310" stroke="#e26464" stroke-width="34" stroke-linecap="round"/><path d="M86 185H296" stroke="#f3a0a0" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="58" y="246" class="t s dim">Pressão de perfusão aferente ↓</text><text x="58" y="277" class="t s">barossensor intrarrenal → renina ↑</text>
    <rect x="404" y="84" width="330" height="250" rx="18" class="panel2"/><text x="428" y="120" class="t h m">2 · ↓ NaCl NA MÁCULA</text>
    <rect x="444" y="152" width="248" height="62" rx="28" fill="#3b2746" stroke="#b58ae0" stroke-width="3"/><text x="568" y="191" text-anchor="middle" class="t h s">NKCC2 · sensor de NaCl</text>
    <text x="428" y="246" class="t s dim">COX-2 → PGE₂ → EP4/cAMP</text><text x="428" y="277" class="t s">sinal paracrino → renina ↑</text>
    <rect x="774" y="84" width="330" height="250" rx="18" class="panel2"/><text x="798" y="120" class="t h m">3 · ↑ SIMPÁTICO</text>
    <circle cx="854" cy="182" r="34" fill="#e88b4a"/><text x="854" y="190" text-anchor="middle" class="t h s">NE</text><path d="M892 182H1015" class="goldflow"/>
    <rect x="1016" y="151" width="61" height="62" rx="18" fill="#233449" stroke="#5d9ee8" stroke-width="3"/><text x="1047" y="190" text-anchor="middle" class="t h s">β1</text>
    <text x="798" y="246" class="t s dim">β1 → Gs → cAMP/PKA</text><text x="798" y="277" class="t s">exocitose de renina ↑</text>
    <path d="M199 356V430H555" class="flow"/><path d="M569 356V430" class="flow"/><path d="M939 356V430H583" class="flow"/>
    <circle cx="569" cy="478" r="90" fill="#342839" stroke="#e3ad4f" stroke-width="5"/><text x="569" y="467" text-anchor="middle" class="t h m">CÉLULA</text><text x="569" y="499" text-anchor="middle" class="t h m">GRANULAR</text><text x="569" y="531" text-anchor="middle" class="t s" fill="#e3ad4f">RENINA ↑</text>
    <rect x="56" y="620" width="1026" height="156" rx="20" fill="#0d171f" stroke="#36505f"/>
    <text x="84" y="661" class="t h m" fill="#68c58a">FREIOS</text><text x="84" y="703" class="t s">NaCl distal alto → adenosina/ATP · pressão/volume restaurados · Ang II em AT1 → feedback curto</text>
    <text x="84" y="742" class="t s dim">Renina é enzima e sinal: inicia a cascata, mas responde continuamente ao estado hemodinâmico.</text>
  </g>
  <rect x="32" y="1015" width="1384" height="45" rx="14" fill="#0d1821" stroke="#36505f"/>
  <text x="724" y="1045" text-anchor="middle" class="t s"><tspan fill="#55cbd3">pressão · mácula densa · β1 → renina</tspan><tspan class="dim"> · M14 · endocrinologia renal</tspan></text>
  </svg>
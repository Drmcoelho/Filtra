<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O uso principal — descongestionar (ICC, edema)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o diurético de alça é a ferramenta da sobrecarga de volume; ponte com o Choca e o M37</text>

  <rect x="40" y="70" width="290" height="120" rx="8" fill="#10202c" stroke="#e0556b"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#e08a96" font-weight="bold">Congestão</text>
  <text x="185" y="120" text-anchor="middle" font-size="11" fill="#e7eef4">ICC, edema pulmonar/periférico</text>
  <text x="185" y="144" text-anchor="middle" font-size="11" fill="#e7eef4">sobrecarga de volume no ECF</text>
  <text x="185" y="172" text-anchor="middle" font-size="10" fill="#9fb1c0">o coração não dá conta do retorno</text>

  <rect x="350" y="70" width="290" height="120" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#8fe0b0" font-weight="bold">Diurético de alça</text>
  <text x="495" y="120" text-anchor="middle" font-size="11" fill="#e7eef4">natriurese potente → ↓ volume</text>
  <text x="495" y="144" text-anchor="middle" font-size="11" fill="#e7eef4">venodilatação (alívio rápido)</text>
  <text x="495" y="172" text-anchor="middle" font-size="10" fill="#9fb1c0">IV na descompensação; VO na manutenção</text>

  <rect x="120" y="210" width="440" height="58" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="340" y="234" text-anchor="middle" font-size="11" fill="#e7eef4">dose-resposta: precisa ULTRAPASSAR um limiar para "abrir" a natriurese</text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#e8a13a">subdose não faz nada; acima do limiar, sobe rápido até o teto</text>
</svg>

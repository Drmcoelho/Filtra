<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#d0c08a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O manejo do cálcio no TCD — entra pelo TRPV5, sai pela troca Na/Ca</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o Ca²⁺ é reabsorvido aqui de forma ativa e regulada (PTH, vitamina D)</text>

  <rect x="40" y="74" width="600" height="40" rx="6" fill="#3a214a" fill-opacity="0.35" stroke="#a06ad0"/><text x="56" y="68" font-size="10" fill="#c9a0e0">LUZ (TCD)</text>
  <rect x="40" y="150" width="600" height="60" fill="#10202c" stroke="#3a4a58"/><text x="56" y="146" font-size="10" fill="#9fb1c0">CÉLULA do TCD</text>

  <rect x="180" y="100" width="70" height="60" rx="6" fill="#16202a" stroke="#d0c08a" stroke-width="2"/><text x="215" y="135" text-anchor="middle" font-size="11" fill="#e0d0a0" font-weight="bold">TRPV5</text>
  <line x1="215" y1="110" x2="215" y2="150" stroke="#d0c08a" stroke-width="2.5" marker-end="url(#c)"/><text x="215" y="96" text-anchor="middle" font-size="9" fill="#e0d0a0">Ca²⁺ entra</text>

  <rect x="430" y="150" width="80" height="60" rx="6" fill="#16202a" stroke="#3a7bd5" stroke-width="2"/><text x="470" y="185" text-anchor="middle" font-size="10" fill="#9bbef0" font-weight="bold">NCX (Na/Ca)</text>
  <line x1="470" y1="150" x2="470" y2="120" stroke="#d0c08a" stroke-width="2.5" marker-end="url(#c)"/><text x="470" y="110" text-anchor="middle" font-size="9" fill="#e0d0a0">Ca²⁺ → sangue</text>

  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#e8a13a">o NCX joga Ca²⁺ para o sangue trocando por Na — depende do Na intracelular BAIXO</text>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="#9fb1c0">é essa dependência do Na que cria o "paradoxo do cálcio" do tiazídico (figura ao lado)</text>
</svg>

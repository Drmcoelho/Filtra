<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A creatinina ATRASA — na LRA, o número subestima a lesão</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a TFG cai num instante; a creatinina leva dias para revelar (τ = Vd/clearance)</text>
  <line x1="70" y1="270" x2="640" y2="270" stroke="#3a4a58"/>
  <line x1="70" y1="64" x2="70" y2="270" stroke="#3a4a58"/>
  <text x="355" y="296" text-anchor="middle" font-size="11" fill="#9fb1c0">tempo (dias) →</text>
  <!-- TFG verdadeira: degrau para baixo em t0 -->
  <path d="M70,90 L200,90 L200,230 L640,230" fill="none" stroke="#52c08a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="120" y="82" font-size="10" fill="#8fe0b0">TFG verdadeira</text>
  <text x="250" y="222" font-size="10" fill="#8fe0b0">despenca já no dia 0</text>
  <!-- creatinina: sobe devagar -->
  <path d="M70,250 L200,250 C260,246 320,210 400,160 C470,120 540,100 640,92" fill="none" stroke="#e0556b" stroke-width="3"/>
  <text x="470" y="150" font-size="10" fill="#e08a96">creatinina (sobe em 2–4 dias)</text>
  <line x1="200" y1="64" x2="200" y2="270" stroke="#3a4a58" stroke-dasharray="3 3"/>
  <text x="200" y="60" text-anchor="middle" font-size="9" fill="#9fb1c0">lesão (t0)</text>
  <!-- janela de engano -->
  <rect x="200" y="240" width="120" height="30" fill="#e8a13a" fill-opacity="0.15"/>
  <text x="335" y="262" font-size="10" fill="#e8a13a">aqui a creatinina ainda "normal" → eGFR superestima</text>
</svg>

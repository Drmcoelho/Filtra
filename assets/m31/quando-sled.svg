<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui,Segoe UI,Arial">
  <rect width="480" height="300" fill="#0a1016"/>
  <text x="240" y="24" fill="#39c0c8" font-size="15" font-weight="bold" text-anchor="middle">Quando escolher a SLED</text>
  <!-- decision -->
  <rect x="160" y="46" width="160" height="40" rx="8" fill="#141b22" stroke="#9fb1c0"/>
  <text x="240" y="71" fill="#e7eef4" font-size="11" text-anchor="middle">tolera a HDI rápida?</text>
  <!-- yes -> HDI -->
  <path d="M180 86 L 100 130" stroke="#52c08a" stroke-width="1.5"/>
  <text x="118" y="112" fill="#52c08a" font-size="10">sim</text>
  <rect x="50" y="132" width="110" height="40" rx="8" fill="#52c08a" fill-opacity="0.15" stroke="#52c08a"/>
  <text x="105" y="157" fill="#52c08a" font-size="12" text-anchor="middle" font-weight="bold">HDI</text>
  <!-- no -> need 24h? -->
  <path d="M300 86 L 360 130" stroke="#e8a13a" stroke-width="1.5"/>
  <text x="342" y="112" fill="#e8a13a" font-size="10">não</text>
  <rect x="300" y="132" width="150" height="40" rx="8" fill="#141b22" stroke="#9fb1c0"/>
  <text x="375" y="157" fill="#e7eef4" font-size="10" text-anchor="middle">precisa de 24 h contínuas?</text>
  <!-- need 24h yes -> TRRC -->
  <path d="M430 172 L 430 210" stroke="#e8a13a" stroke-width="1.5"/>
  <text x="442" y="194" fill="#e8a13a" font-size="9">sim</text>
  <rect x="375" y="212" width="100" height="38" rx="8" fill="#e8a13a" fill-opacity="0.15" stroke="#e8a13a"/>
  <text x="425" y="236" fill="#e8a13a" font-size="12" text-anchor="middle" font-weight="bold">TRRC</text>
  <!-- need 24h no -> SLED -->
  <path d="M320 172 L 240 210" stroke="#39c0c8" stroke-width="2"/>
  <text x="262" y="194" fill="#39c0c8" font-size="9">não</text>
  <rect x="150" y="212" width="120" height="44" rx="8" fill="#39c0c8" fill-opacity="0.22" stroke="#39c0c8" stroke-width="2.5"/>
  <text x="210" y="234" fill="#39c0c8" font-size="14" text-anchor="middle" font-weight="bold">SLED</text>
  <text x="210" y="249" fill="#cfe6e8" font-size="8" text-anchor="middle">o meio-termo</text>
  <text x="240" y="284" fill="#9fb1c0" font-size="10" text-anchor="middle">instabilidade intermediária, sem o custo logístico da TRRC</text>
</svg>

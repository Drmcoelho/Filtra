<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">ECG da HIPOcalemia — a repolarização que se arrasta</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">T achatada, onda U proeminente, depressão de ST → risco de TV/torsades</text>

  <!-- normal -->
  <text x="170" y="90" text-anchor="middle" font-size="11" fill="#52c08a">K 4 — normal</text>
  <path d="M50,150 h24 l8,-6 l6,14 l9,-46 l9,46 l6,-6 h16 q12,0 16,-16 q4,16 16,16 h40" fill="none" stroke="#52c08a" stroke-width="2"/>
  <text x="150" y="138" font-size="9" fill="#9fb1c0">T normal</text>

  <!-- hypo: T achatada + U -->
  <text x="170" y="210" text-anchor="middle" font-size="11" fill="#f0c078">K 2,5 — T achatada + onda U</text>
  <path d="M50,255 h24 l8,-6 l6,14 l9,-46 l9,46 l6,-6 h16 q12,0 16,-6 q4,6 12,5 q10,-16 20,0 q10,16 20,0 h30" fill="none" stroke="#e8a13a" stroke-width="2"/>
  <text x="270" y="248" font-size="9" fill="#f0c078">onda U ↑</text>
  <text x="222" y="240" font-size="9" fill="#9fb1c0">T baixa</text>

  <rect x="430" y="110" width="210" height="150" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="535" y="134" text-anchor="middle" font-size="11" fill="#e7eef4" font-weight="bold">mecanismo</text>
  <text x="446" y="158" font-size="10" fill="#cdd9e3">K⁺ baixo → repolarização lenta</text>
  <text x="446" y="178" font-size="10" fill="#cdd9e3">→ QT/U prolongado</text>
  <text x="446" y="202" font-size="10" fill="#f0c078">corrigir K E magnésio</text>
  <text x="446" y="222" font-size="9" fill="#9fb1c0">(hipomagnesemia perpetua a perda renal)</text>
  <text x="446" y="244" font-size="9" fill="#9fb1c0">cuidado com digital → arritmia</text>
</svg>

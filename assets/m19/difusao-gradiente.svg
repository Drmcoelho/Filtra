<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="d" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Difusão — o soluto desce o gradiente de concentração</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">sangue (muito soluto) ⇄ dialisato (pouco): a ureia atravessa a membrana até equilibrar</text>

  <!-- compartimento sangue -->
  <rect x="50" y="70" width="240" height="170" rx="8" fill="#2a1414" stroke="#e0556b"/>
  <text x="170" y="92" text-anchor="middle" font-size="11" fill="#e08a96">SANGUE (alto soluto)</text>
  <g fill="#e0556b"><circle cx="90" cy="120" r="5"/><circle cx="130" cy="140" r="5"/><circle cx="170" cy="120" r="5"/><circle cx="210" cy="150" r="5"/><circle cx="250" cy="125" r="5"/><circle cx="110" cy="180" r="5"/><circle cx="160" cy="200" r="5"/><circle cx="220" cy="195" r="5"/><circle cx="190" cy="160" r="5"/></g>

  <!-- membrana -->
  <rect x="295" y="70" width="14" height="170" fill="#5a6b78"/>
  <text x="302" y="258" text-anchor="middle" font-size="9" fill="#9fb1c0">membrana</text>

  <!-- dialisato -->
  <rect x="314" y="70" width="240" height="170" rx="8" fill="#0c2330" stroke="#39c0c8"/>
  <text x="434" y="92" text-anchor="middle" font-size="11" fill="#9fe3ec">DIALISATO (baixo soluto)</text>
  <g fill="#39c0c8"><circle cx="360" cy="160" r="5"/><circle cx="430" cy="190" r="5"/></g>

  <!-- setas de difusão -->
  <line x1="270" y1="130" x2="350" y2="130" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#d)"/>
  <line x1="270" y1="175" x2="350" y2="175" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#d)"/>

  <text x="600" y="150" font-size="11" fill="#e7eef4" text-anchor="middle">fluxo</text>
  <text x="600" y="166" font-size="9" fill="#9fb1c0" text-anchor="middle">∝ gradiente</text>
  <text x="600" y="180" font-size="9" fill="#9fb1c0" text-anchor="middle">× KoA</text>

  <text x="340" y="280" text-anchor="middle" font-size="10" fill="#e8a13a">contracorrente (sangue × dialisato em sentidos opostos) mantém o gradiente ao longo do filtro</text>
</svg>

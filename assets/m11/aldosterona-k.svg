<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="k" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8a13a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O balanço EXTERNO — a secreção distal de K⁺ (célula principal, M8)</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a aldosterona abre o ENaC; o Na⁺ que entra cria a voltagem que SECRETA K⁺ pelo ROMK</text>

  <rect x="60" y="70" width="560" height="120" rx="10" fill="#0c2330" stroke="#39c0c8"/>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">lúmen do ducto coletor ← célula principal</text>
  <line x1="200" y1="130" x2="120" y2="130" stroke="#3a7bd5" stroke-width="2.5"/>
  <text x="240" y="134" font-size="11" fill="#9bbef0">Na⁺ entra (ENaC, aldosterona↑)</text>
  <line x1="420" y1="160" x2="500" y2="160" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="250" y="164" font-size="11" fill="#f0c078">K⁺ secretado (ROMK) → urina</text>
  <text x="340" y="184" text-anchor="middle" font-size="9" fill="#9fb1c0">a reabsorção de Na⁺ deixa o lúmen negativo → empurra K⁺ para fora</text>

  <g font-size="11" fill="#e7eef4">
    <rect x="60" y="206" width="270" height="64" rx="8" fill="#10202c" stroke="#52c08a"/>
    <text x="76" y="228">aldosterona↑ → mais ENaC → secreta mais K⁺</text>
    <text x="76" y="248" fill="#9fb1c0" font-size="9">hiperaldosteronismo → hipocalemia</text>
    <text x="76" y="263" fill="#9fb1c0" font-size="9">ARM (espironolactona) → poupa K⁺</text>
    <rect x="350" y="206" width="270" height="64" rx="8" fill="#10202c" stroke="#e8a13a"/>
    <text x="366" y="228" fill="#f0c078">também precisa de APORTE DISTAL de Na⁺/fluxo</text>
    <text x="366" y="248" fill="#9fb1c0" font-size="9">oligúria / baixo aporte distal → secreta pouco</text>
    <text x="366" y="263" fill="#9fb1c0" font-size="9">→ hipercalemia mesmo com aldo alta</text>
  </g>
</svg>

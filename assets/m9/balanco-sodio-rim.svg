<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O balanço de sódio — o rim é a única saída regulada</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a ingesta de Na varia muito; o rim ajusta a excreção para manter o conteúdo (e o volume)</text>

  <rect x="40" y="110" width="160" height="60" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="120" y="138" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">ingesta de Na</text>
  <text x="120" y="158" text-anchor="middle" font-size="10" fill="#cdd9e3">dieta (muito variável)</text>
  <line x1="200" y1="140" x2="270" y2="140" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#b)"/>

  <circle cx="340" cy="140" r="44" fill="#0c2330" stroke="#39c0c8" stroke-width="2"/>
  <text x="340" y="138" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">Na corporal</text>
  <text x="340" y="154" text-anchor="middle" font-size="9" fill="#cdd9e3">= volume do ECF</text>

  <line x1="384" y1="140" x2="454" y2="140" stroke="#39c0c8" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="454" y="110" width="186" height="60" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="547" y="138" text-anchor="middle" font-size="12" fill="#9bbef0" font-weight="bold">excreção renal</text>
  <text x="547" y="158" text-anchor="middle" font-size="10" fill="#cdd9e3">ajustada ao VCE</text>

  <text x="340" y="210" text-anchor="middle" font-size="11" fill="#e7eef4">estável: excreção = ingesta. Se o rim retém mais que se ingere → o volume sobe (edema).</text>
  <text x="340" y="234" text-anchor="middle" font-size="10" fill="#9fb1c0">a FENa (fração de Na excretada) é o termômetro: baixa = retendo; alta = eliminando</text>
  <text x="340" y="258" text-anchor="middle" font-size="10" fill="#e8a13a">perdas extrarrenais (suor, TGI) existem, mas não são reguladas finamente</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Efetivo ≠ total — a dissociação que confunde</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o ECF total pode estar alto (edema) enquanto o VCE está baixo (rim retém)</text>

  <!-- barras: ECF total vs VCE em 3 estados -->
  <g font-size="10" fill="#9fb1c0" text-anchor="middle">
    <text x="160" y="70">Hipovolemia</text><text x="340" y="70">Normal</text><text x="520" y="70">ICC/cirrose/nefrótica</text>
  </g>
  <!-- hipovolemia -->
  <rect x="120" y="160" width="34" height="70" fill="#39c0c8" fill-opacity="0.5" stroke="#39c0c8"/><text x="137" y="244" font-size="8" fill="#9fe3ec" text-anchor="middle">ECF</text>
  <rect x="166" y="170" width="34" height="60" fill="#e0556b" fill-opacity="0.5" stroke="#e0556b"/><text x="183" y="244" font-size="8" fill="#e08a96" text-anchor="middle">VCE</text>
  <!-- normal -->
  <rect x="300" y="120" width="34" height="110" fill="#39c0c8" fill-opacity="0.5" stroke="#39c0c8"/><text x="317" y="244" font-size="8" fill="#9fe3ec" text-anchor="middle">ECF</text>
  <rect x="346" y="120" width="34" height="110" fill="#e0556b" fill-opacity="0.5" stroke="#e0556b"/><text x="363" y="244" font-size="8" fill="#e08a96" text-anchor="middle">VCE</text>
  <!-- ICC: ECF alto, VCE baixo -->
  <rect x="480" y="86" width="34" height="144" fill="#39c0c8" fill-opacity="0.5" stroke="#39c0c8"/><text x="497" y="244" font-size="8" fill="#9fe3ec" text-anchor="middle">ECF↑</text>
  <rect x="526" y="176" width="34" height="54" fill="#e0556b" fill-opacity="0.5" stroke="#e0556b"/><text x="543" y="244" font-size="8" fill="#e08a96" text-anchor="middle">VCE↓</text>

  <text x="340" y="276" text-anchor="middle" font-size="11" fill="#e8a13a">é o VCE (vermelho) que governa a retenção de Na — não o ECF total (ciano)</text>
</svg>

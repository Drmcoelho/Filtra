<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Arial,sans-serif">
  <rect width="640" height="360" fill="#0d141b"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Tipos de síndrome cardiorrenal — quem falha primeiro</text>
  <!-- 4 painéis -->
  <g>
    <rect x="40" y="55" width="270" height="120" rx="8" fill="#e0556b" fill-opacity="0.08" stroke="#e0556b"/>
    <text x="55" y="80" font-size="13" font-weight="bold" fill="#e0556b">Tipo 1 — CRS agudo</text>
    <text x="55" y="102" font-size="11" fill="#e7eef4">coração agudo (IC descompensada)</text>
    <text x="55" y="122" font-size="11" fill="#e7eef4">→ LRA: DC↓ + PVC↑ (congestão)</text>
    <text x="55" y="148" font-size="11" fill="#9fb1c0">o foco deste módulo</text>
  </g>
  <g>
    <rect x="330" y="55" width="270" height="120" rx="8" fill="#e8a13a" fill-opacity="0.08" stroke="#e8a13a"/>
    <text x="345" y="80" font-size="13" font-weight="bold" fill="#e8a13a">Tipo 2 — CRS crônico</text>
    <text x="345" y="102" font-size="11" fill="#e7eef4">IC crônica → doença renal crônica</text>
    <text x="345" y="122" font-size="11" fill="#e7eef4">hipoperfusão + congestão de longo prazo</text>
  </g>
  <g>
    <rect x="40" y="190" width="270" height="120" rx="8" fill="#39c0c8" fill-opacity="0.08" stroke="#39c0c8"/>
    <text x="55" y="215" font-size="13" font-weight="bold" fill="#39c0c8">Tipo 3 — renocardíaco agudo</text>
    <text x="55" y="237" font-size="11" fill="#e7eef4">LRA → coração (sobrecarga, K⁺↑,</text>
    <text x="55" y="257" font-size="11" fill="#e7eef4">acidose, uremia afetam o miocárdio)</text>
  </g>
  <g>
    <rect x="330" y="190" width="270" height="120" rx="8" fill="#5b8dd6" fill-opacity="0.10" stroke="#5b8dd6"/>
    <text x="345" y="215" font-size="13" font-weight="bold" fill="#5b8dd6">Tipo 4 — renocardíaco crônico</text>
    <text x="345" y="237" font-size="11" fill="#e7eef4">DRC → cardiopatia (HVE, anemia,</text>
    <text x="345" y="257" font-size="11" fill="#e7eef4">distúrbio mineral, sobrecarga crônica)</text>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="11" fill="#52c08a">Em todos: o VOLUME é a ponte. Tipo 5 = causa sistêmica (sepse) atinge os dois juntos.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">NKCC2 — o cotransportador Na⁺/K⁺/2Cl⁻ do ramo espesso</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">é o alvo dos diuréticos de alça; reabsorve NaCl sem deixar a água passar</text>

  <rect x="40" y="70" width="600" height="40" rx="6" fill="#3a214a" fill-opacity="0.4" stroke="#a06ad0"/><text x="56" y="64" font-size="10" fill="#c9a0e0">LUZ (ramo espesso)</text>
  <rect x="40" y="150" width="600" height="60" fill="#10202c" stroke="#3a4a58"/><text x="56" y="146" font-size="10" fill="#9fb1c0">CÉLULA do TAL</text>

  <rect x="280" y="100" width="120" height="60" rx="6" fill="#16202a" stroke="#39c0c8" stroke-width="2"/>
  <text x="340" y="135" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">NKCC2</text>
  <g stroke="#39c0c8" stroke-width="2.2" marker-end="url(#k)">
    <line x1="300" y1="110" x2="300" y2="150"/><line x1="320" y1="110" x2="320" y2="150"/><line x1="360" y1="110" x2="360" y2="150"/><line x1="380" y1="110" x2="380" y2="150"/>
  </g>
  <text x="295" y="96" font-size="9" fill="#9fe3ec">Na⁺</text><text x="315" y="96" font-size="9" fill="#9fe3ec">K⁺</text><text x="362" y="96" font-size="9" fill="#9fe3ec">2Cl⁻</text>

  <!-- diurético de alça bloqueando -->
  <line x1="296" y1="116" x2="384" y2="144" stroke="#e0556b" stroke-width="3"/>
  <text x="470" y="130" font-size="11" fill="#e08a96" font-weight="bold">diurético de alça</text>
  <text x="470" y="146" font-size="10" fill="#cdd9e3">furosemida/bumetanida/torasemida</text>

  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#e8a13a">o K⁺ reciclado deixa a luz positiva → puxa Ca²⁺ e Mg²⁺ paracelular</text>
  <text x="340" y="262" text-anchor="middle" font-size="10" fill="#9fb1c0">por isso bloquear o NKCC2 também perde Ca²⁺ e Mg²⁺ (≠ tiazídico)</text>
</svg>

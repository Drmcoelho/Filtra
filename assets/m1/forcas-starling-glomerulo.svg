<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Georgia, serif">
  <rect width="680" height="420" fill="#fafaf8"/>
  <!-- Título -->
  <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Forças de Starling no Glomérulo</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#555">TFG = K_f · (ΔP_hidrostática − Δπ_oncótica)</text>

  <!-- Capilar glomerular (retangulo arredondado) -->
  <rect x="60" y="90" width="560" height="120" rx="18" ry="18" fill="#ffe0e0" stroke="#cc3333" stroke-width="2.5"/>
  <text x="340" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc2200">Capilar Glomerular</text>

  <!-- Espaço de Bowman -->
  <rect x="100" y="260" width="480" height="90" rx="14" ry="14" fill="#e0f0ff" stroke="#3366cc" stroke-width="2"/>
  <text x="340" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a44aa">Espaço de Bowman</text>

  <!-- Seta P_GC (para baixo — favorece filtração) -->
  <line x1="200" y1="212" x2="200" y2="258" stroke="#cc3333" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="200" y="200" text-anchor="middle" font-size="12" fill="#cc3333" font-weight="bold">P_GC</text>
  <text x="200" y="215" text-anchor="middle" font-size="10" fill="#cc3333">~55 mmHg</text>
  <text x="200" y="244" text-anchor="middle" font-size="10" fill="#888">↓ favorece filtração</text>

  <!-- Seta π_GC (para cima — opõe filtração) -->
  <line x1="340" y1="256" x2="340" y2="214" stroke="#994400" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="340" y="268" text-anchor="middle" font-size="12" fill="#994400" font-weight="bold">π_GC</text>
  <text x="340" y="283" text-anchor="middle" font-size="10" fill="#994400">~30 mmHg</text>
  <text x="340" y="208" text-anchor="middle" font-size="10" fill="#888">↑ opõe filtração</text>

  <!-- Seta P_BC (para cima — opõe filtração) -->
  <line x1="480" y1="258" x2="480" y2="214" stroke="#3366cc" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="480" y="269" text-anchor="middle" font-size="12" fill="#3366cc" font-weight="bold">P_BC</text>
  <text x="480" y="284" text-anchor="middle" font-size="10" fill="#3366cc">~15 mmHg</text>
  <text x="480" y="208" text-anchor="middle" font-size="10" fill="#888">↑ opõe filtração</text>

  <!-- Resultado líquido -->
  <rect x="180" y="365" width="320" height="42" rx="8" fill="#e8ffe8" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="340" y="382" text-anchor="middle" font-size="12" fill="#1a5c1a" font-weight="bold">Pressão de Filtração Líquida</text>
  <text x="340" y="398" text-anchor="middle" font-size="12" fill="#1a5c1a">55 − 30 − 15 = <tspan font-weight="bold">10 mmHg</tspan></text>

  <!-- Defs: setas -->
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#cc3333"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#994400"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3366cc"/>
    </marker>
  </defs>
</svg>

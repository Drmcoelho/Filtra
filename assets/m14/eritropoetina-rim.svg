  <rect width="1448" height="1086" fill="#071018"/>
  <text x="42" y="64" class="t h title"><tspan fill="#55cbd3">FILTRA</tspan><tspan fill="#e3ad4f"> · Eritropoetina: o sensor renal de oxigênio</tspan></text>
  <text x="44" y="101" class="t sub dim">Células intersticiais peritubulares estabilizam HIF-2α na hipóxia e sinalizam à medula óssea.</text>
  <g transform="translate(36 118)">
    <rect width="210" height="206" rx="20" class="panel"/>
    <path d="M95 28C48 22 32 70 42 115c9 42 41 71 76 61 21-6 20-30 8-51-10-18-6-36 8-50 20-21 1-42-39-47Z" fill="#a64148" stroke="#ef8b83" stroke-width="4"/>
    <path d="M106 48c-24 9-32 36-27 61 5 24 20 41 37 42-9-20-8-42 6-62 10-14 5-31-16-41Z" fill="#e2a477" opacity=".72"/>
    <circle cx="114" cy="88" r="13" fill="#55cbd3"/><path d="M126 88H176" class="flow"/>
    <text x="20" y="190" class="t h s">Córtex/medula externa</text>
    <text x="112" y="116" text-anchor="middle" class="t xs">célula REP</text>
  </g>
  <g transform="translate(278 132)"><rect width="1134" height="830" rx="24" class="panel" filter="url(#shadow)"/>
    <rect x="42" y="58" width="492" height="302" rx="22" class="panel2"/><text x="68" y="101" class="t h m">NORMÓXIA</text>
    <circle cx="150" cy="184" r="46" fill="#20344a" stroke="#5d9ee8" stroke-width="3"/><text x="150" y="192" text-anchor="middle" class="t h s">HIF-2α</text>
    <path d="M204 184H300" class="flow"/><rect x="310" y="145" width="150" height="78" rx="18" fill="#2d3222" stroke="#68c58a"/><text x="385" y="177" text-anchor="middle" class="t h s">PHD + O₂</text><text x="385" y="204" text-anchor="middle" class="t xs">hidroxilação</text>
    <path d="M385 230V280" class="greenflow"/><text x="385" y="315" text-anchor="middle" class="t s dim">VHL → degradação → EPO basal</text>
    <rect x="600" y="58" width="492" height="302" rx="22" class="panel2"/><text x="626" y="101" class="t h m">HIPÓXIA</text>
    <circle cx="710" cy="184" r="46" fill="#2d1d38" stroke="#b58ae0" stroke-width="3"/><text x="710" y="192" text-anchor="middle" class="t h s">HIF-2α</text>
    <text x="798" y="176" class="t s">PHD inativa</text><text x="798" y="207" class="t s dim">HIF estabiliza e entra no núcleo</text><path d="M756 184H930" class="goldflow"/>
    <circle cx="974" cy="184" r="48" fill="#33291a" stroke="#e3ad4f" stroke-width="3"/><text x="974" y="192" text-anchor="middle" class="t h s">DNA EPO</text>
    <text x="846" y="296" text-anchor="middle" class="t h m" fill="#e3ad4f">TRANSCRIÇÃO DE EPO ↑</text>
    <path d="M846 370V448" class="goldflow"/>
    <rect x="42" y="438" width="1050" height="224" rx="22" class="panel2"/><text x="68" y="480" class="t h m" fill="#55cbd3">EIXO RIM → MEDULA → OXIGÊNIO</text>
    <g transform="translate(88 518)"><rect width="210" height="100" rx="18" fill="#202c35" stroke="#55cbd3"/><text x="105" y="45" text-anchor="middle" class="t h s">EPO circulante</text><text x="105" y="75" text-anchor="middle" class="t xs dim">receptor EPOR</text>
      <path d="M220 50H330" class="flow"/><rect x="342" width="220" height="100" rx="18" fill="#30252f" stroke="#b58ae0"/><text x="452" y="45" text-anchor="middle" class="t h s">Medula óssea</text><text x="452" y="75" text-anchor="middle" class="t xs dim">CFU-E sobrevive/prolifera</text>
      <path d="M572 50H682" class="redflow"/><rect x="694" width="220" height="100" rx="18" fill="#351c22" stroke="#e26464"/><text x="804" y="45" text-anchor="middle" class="t h s">Hemácias ↑</text><text x="804" y="75" text-anchor="middle" class="t xs dim">entrega de O₂ ↑</text></g>
    <rect x="42" y="704" width="1050" height="94" rx="18" fill="#281d1d" stroke="#e26464"/><text x="68" y="742" class="t h s" fill="#e26464">DRC</text><text x="132" y="742" class="t s">fibrose transforma/perde células produtoras de EPO → resposta inadequadamente baixa à anemia.</text><text x="68" y="775" class="t xs dim">Ferro continua necessário, mas deficiência de EPO não é corrigida apenas oferecendo ferro.</text>
  </g>
  <rect x="32" y="1015" width="1384" height="45" rx="14" fill="#0d1821" stroke="#36505f"/>
  <text x="724" y="1045" text-anchor="middle" class="t s"><tspan fill="#55cbd3">hipóxia → HIF-2α → EPO → eritropoiese</tspan><tspan class="dim"> · M14 · endocrinologia renal</tspan></text>
  </svg>
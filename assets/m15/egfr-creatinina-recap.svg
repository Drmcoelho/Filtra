<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">eGFR e creatinina — recap do M4 aplicado à urina</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o número estima a função; a urina diz o MECANISMO. Os dois juntos fecham o raciocínio</text>

  <!-- hipérbole creatinina x TFG -->
  <line x1="70" y1="60" x2="70" y2="220" stroke="#3a4a58"/>
  <line x1="70" y1="220" x2="360" y2="220" stroke="#3a4a58"/>
  <path d="M84,76 C110,150 160,200 350,212" fill="none" stroke="#39c0c8" stroke-width="2.5"/>
  <text x="215" y="244" text-anchor="middle" font-size="10" fill="#9fb1c0">TFG →</text>
  <text x="40" y="140" font-size="10" fill="#9fb1c0" transform="rotate(-90 40 140)">creatinina</text>
  <text x="200" y="120" font-size="9" fill="#e8a13a">faixa cega: TFG cai muito antes de a Cr subir</text>

  <rect x="390" y="64" width="270" height="170" rx="10" fill="#10202c" stroke="#3a4a58"/>
  <text x="525" y="88" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">o que a urina acrescenta</text>
  <text x="406" y="114" font-size="11" fill="#e7eef4">• a Cr/eGFR dá o NÍVEL da função</text>
  <text x="406" y="138" font-size="11" fill="#e7eef4">• a urina dá o MECANISMO (pré/intr/pós)</text>
  <text x="406" y="162" font-size="11" fill="#e7eef4">• FE_Na/FE_ureia separam pré-renal × NTA</text>
  <text x="406" y="186" font-size="11" fill="#e7eef4">• sedimento aponta o local da lesão</text>
  <text x="406" y="214" font-size="10" fill="#e8a13a">na LRA aguda, a Cr ainda nem subiu — a urina já fala</text>

  <text x="340" y="270" text-anchor="middle" font-size="11" fill="#9fb1c0">cinética: na LRA aguda a creatinina ATRASA; a oligúria e a urina chegam antes</text>
  <text x="340" y="290" text-anchor="middle" font-size="9" fill="#9fb1c0">por isso os critérios de LRA (KDIGO, M4/M16) usam débito urinário além da Cr</text>
</svg>

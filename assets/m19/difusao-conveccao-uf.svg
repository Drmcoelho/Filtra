<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs>
    <marker id="g1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#39c0c8"/></marker>
    <marker id="g2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52c08a"/></marker>
    <marker id="g3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3a7bd5"/></marker>
  </defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Difusão × convecção × ultrafiltração — o que move o quê</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">três forças, três alvos: gradiente move soluto pequeno; arraste move médio; pressão move água</text>

  <!-- difusão -->
  <rect x="24" y="64" width="208" height="200" rx="8" fill="#0c2330" stroke="#39c0c8"/>
  <text x="128" y="86" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">DIFUSÃO</text>
  <text x="128" y="106" text-anchor="middle" font-size="9" fill="#9fb1c0">gradiente de concentração</text>
  <circle cx="70" cy="150" r="5" fill="#39c0c8"/><line x1="84" y1="150" x2="190" y2="150" stroke="#39c0c8" stroke-width="2" marker-end="url(#g1)"/>
  <text x="128" y="196" text-anchor="middle" font-size="10" fill="#e7eef4">remove PEQUENAS</text>
  <text x="128" y="214" text-anchor="middle" font-size="9" fill="#cdd9e3">ureia, K⁺, creatinina</text>
  <text x="128" y="238" text-anchor="middle" font-size="9" fill="#e8a13a">base da HEMODIÁLISE</text>

  <!-- convecção -->
  <rect x="236" y="64" width="208" height="200" rx="8" fill="#102a18" stroke="#52c08a"/>
  <text x="340" y="86" text-anchor="middle" font-size="11" fill="#9fe3ec" font-weight="bold">CONVECÇÃO</text>
  <text x="340" y="106" text-anchor="middle" font-size="9" fill="#9fb1c0">arraste por solvente</text>
  <circle cx="282" cy="150" r="8" fill="#e8a13a"/><line x1="296" y1="150" x2="402" y2="150" stroke="#52c08a" stroke-width="3" marker-end="url(#g2)"/>
  <text x="340" y="196" text-anchor="middle" font-size="10" fill="#e7eef4">remove MÉDIAS</text>
  <text x="340" y="214" text-anchor="middle" font-size="9" fill="#cdd9e3">β2-microglobulina</text>
  <text x="340" y="238" text-anchor="middle" font-size="9" fill="#e8a13a">base da HEMOFILTRAÇÃO</text>

  <!-- UF -->
  <rect x="448" y="64" width="208" height="200" rx="8" fill="#10202c" stroke="#3a7bd5"/>
  <text x="552" y="86" text-anchor="middle" font-size="11" fill="#9bbef0" font-weight="bold">ULTRAFILTRAÇÃO</text>
  <text x="552" y="106" text-anchor="middle" font-size="9" fill="#9fb1c0">pressão (TMP)</text>
  <line x1="494" y1="150" x2="610" y2="150" stroke="#3a7bd5" stroke-width="4" marker-end="url(#g3)"/>
  <text x="552" y="196" text-anchor="middle" font-size="10" fill="#e7eef4">remove ÁGUA (volume)</text>
  <text x="552" y="214" text-anchor="middle" font-size="9" fill="#cdd9e3">Jv = Kuf · TMP</text>
  <text x="552" y="238" text-anchor="middle" font-size="9" fill="#e8a13a">controla o BALANÇO</text>

  <text x="340" y="284" text-anchor="middle" font-size="9" fill="#9fb1c0">a HDF e a TRRC combinam difusão + convecção; a UF isolada só tira volume</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui,Segoe UI,sans-serif">
  <rect width="640" height="320" fill="#0f161d"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">AEIOU — o mapa de indicação de TRS</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#9fb1c0">cada letra é um gatilho REFRATÁRIO — qualquer um basta (OR, não soma)</text>
  <g font-size="13">
    <g><rect x="40" y="70" width="560" height="40" rx="6" fill="#1b242d" stroke="#e0556b"/>
      <circle cx="62" cy="90" r="13" fill="#e0556b"/><text x="62" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f161d">A</text>
      <text x="86" y="86" fill="#e7eef4" font-weight="bold">Acidose</text><text x="86" y="103" fill="#9fb1c0" font-size="11">metabólica grave refratária — pH baixo, HCO₃⁻ baixo</text></g>
    <g><rect x="40" y="118" width="560" height="40" rx="6" fill="#1b242d" stroke="#e8a13a"/>
      <circle cx="62" cy="138" r="13" fill="#e8a13a"/><text x="62" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f161d">E</text>
      <text x="86" y="134" fill="#e7eef4" font-weight="bold">Eletrólitos</text><text x="86" y="151" fill="#9fb1c0" font-size="11">hipercalemia refratária COM alteração de ECG</text></g>
    <g><rect x="40" y="166" width="560" height="40" rx="6" fill="#1b242d" stroke="#39c0c8"/>
      <circle cx="62" cy="186" r="13" fill="#39c0c8"/><text x="62" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f161d">I</text>
      <text x="86" y="182" fill="#e7eef4" font-weight="bold">Intoxicação</text><text x="86" y="199" fill="#9fb1c0" font-size="11">toxina DIALISÁVEL (lítio, salicilato, metanol, etilenoglicol)</text></g>
    <g><rect x="40" y="214" width="560" height="40" rx="6" fill="#1b242d" stroke="#52c08a"/>
      <circle cx="62" cy="234" r="13" fill="#52c08a"/><text x="62" y="239" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f161d">O</text>
      <text x="86" y="230" fill="#e7eef4" font-weight="bold">Overload (sobrecarga)</text><text x="86" y="247" fill="#9fb1c0" font-size="11">volume refratário ao diurético — edema pulmonar</text></g>
    <g><rect x="40" y="262" width="560" height="40" rx="6" fill="#1b242d" stroke="#c879e0"/>
      <circle cx="62" cy="282" r="13" fill="#c879e0"/><text x="62" y="287" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f161d">U</text>
      <text x="86" y="278" fill="#e7eef4" font-weight="bold">Uremia sintomática</text><text x="86" y="295" fill="#9fb1c0" font-size="11">pericardite, encefalopatia — não o NÚMERO da ureia</text></g>
  </g>
</svg>

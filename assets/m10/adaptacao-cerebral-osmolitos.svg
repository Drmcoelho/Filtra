<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">Adaptação cerebral — o neurônio se defende com osmólitos</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">na hiponatremia CRÔNICA a célula extrui osmólitos para não inchar — e isso muda a regra da correção</text>

  <!-- t0 agudo: incha -->
  <text x="120" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#e0556b">① agudo (horas)</text>
  <circle cx="120" cy="150" r="56" fill="#1a1410" stroke="#e0556b" stroke-width="2"/>
  <circle cx="120" cy="150" r="44" fill="#e0556b" fill-opacity="0.18" stroke="#e0556b" stroke-dasharray="3 3"/>
  <text x="120" y="150" text-anchor="middle" font-size="10" fill="#e0556b">água ENTRA</text>
  <text x="120" y="166" text-anchor="middle" font-size="10" fill="#e0556b">→ INCHA</text>
  <text x="120" y="224" text-anchor="middle" font-size="9.5" fill="#9fb1c0">plasma hipotônico → água entra na célula → EDEMA</text>

  <!-- t1 cronico: extrui osmolitos, volta ao tamanho -->
  <text x="320" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#52c08a">② crônico (&gt;48h): ADAPTADO</text>
  <circle cx="320" cy="150" r="46" fill="#102a2c" stroke="#52c08a" stroke-width="2"/>
  <text x="320" y="146" text-anchor="middle" font-size="10" fill="#52c08a">tamanho normal</text>
  <text x="320" y="162" text-anchor="middle" font-size="10" fill="#cfdbe6">mas POBRE em osmólitos</text>
  <!-- osmolitos saindo -->
  <line x1="360" y1="124" x2="392" y2="110" stroke="#39c0c8" stroke-width="2" marker-end="url(#b)"/>
  <line x1="364" y1="150" x2="398" y2="150" stroke="#39c0c8" stroke-width="2" marker-end="url(#b)"/>
  <line x1="360" y1="176" x2="392" y2="190" stroke="#39c0c8" stroke-width="2" marker-end="url(#b)"/>
  <text x="430" y="150" text-anchor="middle" font-size="9.5" fill="#39c0c8">osmólitos orgânicos</text>
  <text x="430" y="164" text-anchor="middle" font-size="9.5" fill="#39c0c8">(idiogênicos) SAEM</text>
  <text x="320" y="224" text-anchor="middle" font-size="9.5" fill="#9fb1c0">extrudou solutos para parar de inchar → voltou ao tamanho</text>

  <!-- o perigo da correção -->
  <rect x="34" y="244" width="572" height="74" rx="8" fill="#141b22" stroke="#e0556b"/>
  <text x="50" y="266" font-size="12" font-weight="700" fill="#e0556b">③ por isso a correção RÁPIDA é perigosa na crônica</text>
  <text x="50" y="285" font-size="10.5" fill="#cfdbe6">o plasma volta a ficar tônico depressa, mas a célula está SEM osmólitos para reter sua água</text>
  <text x="50" y="301" font-size="10.5" fill="#cfdbe6">→ a água sai brutalmente → o neurônio MURCHA e desmieliniza (mielinólise). Reverter leva dias.</text>
  <text x="50" y="315" font-size="10.5" fill="#52c08a">limite seguro ≈ 6–8 mEq/L por 24 h enquanto o cérebro "rebusca" osmólitos</text>

  <text x="320" y="350" text-anchor="middle" font-size="9" fill="#5b6b78">FILTRA · M10 — a cronicidade adapta o cérebro e por isso dita a velocidade segura</text>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#39c0c8"/></marker>
  </defs>
</svg>

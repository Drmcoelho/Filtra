<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">Mielinólise pontina — corrigir RÁPIDO a hipoNa crônica</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">esquema didático (não é RM real): o neurônio adaptado MURCHA e desmieliniza quando o Na sobe depressa</text>

  <!-- tronco cerebral esquematico -->
  <rect x="232" y="64" width="176" height="150" rx="40" fill="#101d22" stroke="#9fb1c0" stroke-width="2"/>
  <text x="320" y="84" text-anchor="middle" font-size="10" fill="#9fb1c0">tronco encefálico (ponte)</text>
  <!-- lesao central -->
  <ellipse cx="320" cy="150" rx="42" ry="36" fill="#e0556b" fill-opacity="0.25" stroke="#e0556b" stroke-width="2"/>
  <text x="320" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#e0556b">desmielinização</text>
  <text x="320" y="164" text-anchor="middle" font-size="10" fill="#e0556b">CENTRAL (simétrica)</text>

  <!-- mecanismo: agua sai do neuronio -->
  <text x="120" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#39c0c8">o neurônio adaptado</text>
  <circle cx="120" cy="160" r="44" fill="#102a2c" stroke="#52c08a" stroke-width="2"/>
  <line x1="120" y1="160" x2="120" y2="160"/>
  <line x1="84" y1="140" x2="52" y2="126" stroke="#e0556b" stroke-width="2" marker-end="url(#d)"/>
  <line x1="80" y1="178" x2="48" y2="192" stroke="#e0556b" stroke-width="2" marker-end="url(#d)"/>
  <text x="120" y="156" text-anchor="middle" font-size="9.5" fill="#cfdbe6">pobre em</text>
  <text x="120" y="170" text-anchor="middle" font-size="9.5" fill="#cfdbe6">osmólitos</text>
  <text x="60" y="225" text-anchor="middle" font-size="9.5" fill="#e0556b">água SAI brusca → murcha</text>

  <text x="520" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#e8a13a">plasma re-tônico</text>
  <line x1="520" y1="116" x2="520" y2="150" stroke="#e8a13a" stroke-width="2" marker-end="url(#e)"/>
  <text x="520" y="172" text-anchor="middle" font-size="9.5" fill="#cfdbe6">Na subiu rápido</text>
  <text x="520" y="186" text-anchor="middle" font-size="9.5" fill="#cfdbe6">demais (&gt;8/24h)</text>

  <rect x="34" y="244" width="572" height="74" rx="8" fill="#141b22" stroke="#e0556b"/>
  <text x="50" y="266" font-size="12" font-weight="700" fill="#e0556b">por que acontece</text>
  <text x="50" y="285" font-size="10.5" fill="#cfdbe6">crônica (cérebro já extruiu osmólitos) + correção veloz → gradiente puxa a água PARA FORA do neurônio</text>
  <text x="50" y="301" font-size="10.5" fill="#cfdbe6">→ desmielinização da ponte (e extrapontina). Quadro tardio (dias): disartria, disfagia, tetraparesia, "locked-in".</text>
  <text x="50" y="315" font-size="10.5" fill="#52c08a">prevenção: respeitar o teto de 6–8 mEq/L/24h e, se ultrapassar, RE-baixar o Na com água/dDAVP</text>
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e0556b"/></marker>
    <marker id="e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e8a13a"/></marker>
  </defs>
</svg>

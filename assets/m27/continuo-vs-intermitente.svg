<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="system-ui,Segoe UI,Arial" role="img">
  <rect width="520" height="300" fill="#0a1016"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Contínuo × intermitente — clearance no tempo</text>
  <!-- eixos -->
  <line x1="60" y1="220" x2="490" y2="220" stroke="#3a4a58"/>
  <line x1="60" y1="60" x2="60" y2="220" stroke="#3a4a58"/>
  <text x="275" y="245" text-anchor="middle" font-size="10" fill="#9fb1c0">tempo (24 h)</text>
  <text x="20" y="140" font-size="10" fill="#9fb1c0" transform="rotate(-90 20 140)">clearance/hora</text>
  <!-- HDI: pico alto e curto -->
  <rect x="80" y="80" width="60" height="140" fill="#52c08a" fill-opacity="0.5" stroke="#52c08a"/>
  <text x="110" y="74" text-anchor="middle" font-size="9" fill="#52c08a">HDI 4 h</text>
  <!-- TRRC: faixa baixa e longa -->
  <rect x="160" y="190" width="320" height="30" fill="#e8a13a" fill-opacity="0.5" stroke="#e8a13a"/>
  <text x="320" y="184" text-anchor="middle" font-size="9" fill="#e8a13a">TRRC 24 h (baixa, contínua)</text>
  <text x="40" y="270" font-size="11" fill="#9fb1c0">① HDI: pico ALTO de clearance/hora, mas curto. ② TRRC: clearance/hora BAIXO, porém 24 h.</text>
  <text x="40" y="288" font-size="11" fill="#9fb1c0">③ A ÁREA (dose/24 h) se equipara; o instável tolera a TRRC porque a remoção é lenta.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <rect width="640" height="360" fill="#0f1620"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#e7eef4">O balanço de Na e o tamanho da ECF</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">no equilíbrio, a excreção de Na iguala a ingesta — o resto vira EDEMA</text>

  <!-- ingesta -->
  <rect x="36" y="78" width="150" height="64" rx="8" fill="#141b22" stroke="#e8a13a"/>
  <text x="111" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#e8a13a">① ingesta de Na</text>
  <text x="111" y="120" text-anchor="middle" font-size="10" fill="#cfdbe6">o que entra (dieta, soro)</text>
  <text x="111" y="134" text-anchor="middle" font-size="9.5" fill="#9fb1c0">~150 mEq/dia</text>

  <!-- rim -->
  <ellipse cx="320" cy="110" rx="74" ry="46" fill="#102a2c" stroke="#39c0c8" stroke-width="2"/>
  <text x="320" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#39c0c8">② RIM</text>
  <text x="320" y="122" text-anchor="middle" font-size="9.5" fill="#cfdbe6">FE_Na ajusta a excreção</text>
  <text x="320" y="136" text-anchor="middle" font-size="9" fill="#9fb1c0">conforme a leitura do VCE</text>
  <line x1="186" y1="110" x2="244" y2="110" stroke="#e8a13a" stroke-width="2" marker-end="url(#a)"/>

  <!-- excreção -->
  <rect x="454" y="78" width="150" height="64" rx="8" fill="#141b22" stroke="#52c08a"/>
  <text x="529" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#52c08a">③ excreção de Na</text>
  <text x="529" y="120" text-anchor="middle" font-size="10" fill="#cfdbe6">o que sai na urina</text>
  <text x="529" y="134" text-anchor="middle" font-size="9.5" fill="#9fb1c0">U_Na × débito urinário</text>
  <line x1="394" y1="110" x2="452" y2="110" stroke="#52c08a" stroke-width="2" marker-end="url(#b)"/>

  <!-- a balança -->
  <text x="320" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#e7eef4">balanço = ingesta − excreção</text>
  <rect x="120" y="214" width="180" height="56" rx="8" fill="#101d22" stroke="#52c08a"/>
  <text x="210" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#52c08a">balanço = 0 → estável</text>
  <text x="210" y="254" text-anchor="middle" font-size="9.5" fill="#cfdbe6">excreta tudo que come; ECF fixa</text>
  <rect x="340" y="214" width="180" height="56" rx="8" fill="#1a1410" stroke="#e0556b"/>
  <text x="430" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#e0556b">balanço &gt; 0 → retém</text>
  <text x="430" y="254" text-anchor="middle" font-size="9.5" fill="#cfdbe6">ECF expande → ④ edema</text>

  <rect x="120" y="288" width="400" height="40" rx="8" fill="#141b22" stroke="#283642"/>
  <text x="320" y="312" text-anchor="middle" font-size="10.5" fill="#cfdbe6">o Na CORPORAL TOTAL retido = o tamanho da ECF. "Onde está o sal, está a água."</text>

  <text x="320" y="352" text-anchor="middle" font-size="9" fill="#5b6b78">FILTRA · M9 — o rim titula a excreção de Na conforme percebe o volume efetivo</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e8a13a"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52c08a"/></marker>
  </defs>
</svg>

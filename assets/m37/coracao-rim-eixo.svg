<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Arial,sans-serif">
  <rect width="640" height="360" fill="#0d141b"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#e7eef4">Eixo cardiorrenal — falham JUNTOS, o volume é a ponte</text>
  <!-- coração -->
  <g>
    <path d="M150 120 q-40 -45 -75 -10 q-30 30 75 95 q105 -65 75 -95 q-35 -35 -75 10 z" fill="#e0556b" fill-opacity="0.30" stroke="#e0556b" stroke-width="2"/>
    <text x="150" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#e0556b">CORAÇÃO</text>
    <text x="150" y="254" text-anchor="middle" font-size="11" fill="#9fb1c0">① DC ↓ (anterógrado)</text>
    <text x="150" y="272" text-anchor="middle" font-size="11" fill="#9fb1c0">② PVC ↑ (congestão)</text>
  </g>
  <!-- rim -->
  <g>
    <path d="M490 110 q60 0 60 70 q0 70 -60 70 q-32 0 -32 -30 q14 -8 14 -40 q0 -32 -14 -40 q0 -30 32 -30 z" fill="#39c0c8" fill-opacity="0.22" stroke="#39c0c8" stroke-width="2"/>
    <text x="500" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#39c0c8">RIM</text>
    <text x="500" y="259" text-anchor="middle" font-size="11" fill="#9fb1c0">TFG ↓ → retém volume</text>
  </g>
  <!-- setas do ciclo vicioso -->
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#e8a13a"/></marker>
  </defs>
  <path d="M225 130 q90 -35 195 0" fill="none" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#e8a13a">perfusão renal efetiva ≈ PAM − PVC</text>
  <path d="M420 215 q-90 40 -195 0" fill="none" stroke="#e8a13a" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="320" y="250" text-anchor="middle" font-size="11" fill="#e8a13a">retenção de volume → piora o coração</text>
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="#52c08a">Descongestionar (PVC↓) quebra o ciclo e melhora a TFG.</text>
  <text x="320" y="345" text-anchor="middle" font-size="10" fill="#5f7384">FILTRA · DIALISA · M37 — ponte com CHOCA (PAM = DC × RVS)</text>
</svg>

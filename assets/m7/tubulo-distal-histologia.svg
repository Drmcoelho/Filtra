  <circle cx="318" cy="240" r="22" fill="#2a3c48"/>
  <text x="318" y="244" text-anchor="middle" font-size="9" fill="#9fb1c0">núcleo</text>
  <g fill="#e8a13a" opacity="0.55">
    <ellipse cx="280" cy="200" rx="13" ry="6"/><ellipse cx="360" cy="210" rx="13" ry="6"/>
    <ellipse cx="280" cy="290" rx="13" ry="6"/><ellipse cx="360" cy="295" rx="13" ry="6"/>

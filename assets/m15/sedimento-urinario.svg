<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="320" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="316" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O sedimento urinário — cada achado aponta um mecanismo</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o que se vê ao microscópio liga a síndrome ao local da lesão</text>

  <g font-size="11">
    <rect x="24" y="60" width="632" height="30" fill="#0c2330" stroke="#39c0c8"/>
    <text x="40" y="80" fill="#9fe3ec" font-weight="bold">cilindros hialinos / sedimento limpo</text><text x="430" y="80" fill="#e7eef4">→ pré-renal</text>
    <rect x="24" y="90" width="632" height="30" fill="#10202c" stroke="#e8a13a"/>
    <text x="40" y="110" fill="#f0c078" font-weight="bold">cilindros granulosos pigmentados (muddy brown)</text><text x="430" y="110" fill="#e7eef4">→ NTA</text>
    <rect x="24" y="120" width="632" height="30" fill="#10202c" stroke="#e0556b"/>
    <text x="40" y="140" fill="#e08a96" font-weight="bold">cilindros hemáticos + dismorfismo</text><text x="430" y="140" fill="#e7eef4">→ glomerulonefrite</text>
    <rect x="24" y="150" width="632" height="30" fill="#10202c" stroke="#3a7bd5"/>
    <text x="40" y="170" fill="#9bbef0" font-weight="bold">cilindros leucocitários / eosinófilos</text><text x="430" y="170" fill="#e7eef4">→ nefrite intersticial (NIA)</text>
    <rect x="24" y="180" width="632" height="30" fill="#10202c" stroke="#52c08a"/>
    <text x="40" y="200" fill="#9fe3ec" font-weight="bold">cilindros largos / céreos</text><text x="430" y="200" fill="#e7eef4">→ DRC avançada</text>
  </g>

  <!-- mini-desenhos -->
  <g>
    <rect x="60" y="226" width="120" height="60" rx="8" fill="#0a1016" stroke="#283642"/>
    <rect x="78" y="244" width="84" height="20" rx="9" fill="none" stroke="#9fe3ec"/><text x="120" y="300" text-anchor="middle" font-size="9" fill="#9fb1c0">hialino (translúcido)</text>
    <rect x="280" y="226" width="120" height="60" rx="8" fill="#0a1016" stroke="#283642"/>
    <rect x="298" y="244" width="84" height="20" rx="5" fill="#7a5a30" stroke="#e8a13a"/><text x="340" y="300" text-anchor="middle" font-size="9" fill="#9fb1c0">granuloso (muddy brown)</text>
    <rect x="500" y="226" width="120" height="60" rx="8" fill="#0a1016" stroke="#283642"/>
    <rect x="518" y="244" width="84" height="20" rx="5" fill="none" stroke="#e0556b"/><circle cx="540" cy="254" r="4" fill="#e0556b"/><circle cx="560" cy="254" r="4" fill="#e0556b"/><circle cx="580" cy="254" r="4" fill="#e0556b"/><text x="560" y="300" text-anchor="middle" font-size="9" fill="#9fb1c0">hemático (hemácias)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Síndrome de Gitelman — um "tiazídico crônico" genético</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">mutação que inativa o NCC → mesmo padrão de um tiazídico tomado para sempre</text>

  <rect x="40" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#39c0c8"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">NCC inativo (genético)</text>
  <text x="60" y="122" font-size="11" fill="#e7eef4">• hipocalemia + alcalose metabólica</text>
  <text x="60" y="148" font-size="11" fill="#e7eef4">• hipoMAGNESEMIA (marca de Gitelman)</text>
  <text x="60" y="174" font-size="11" fill="#e7eef4">• HIPOcalciúria (retém Ca, como o tiazídico)</text>
  <text x="60" y="200" font-size="11" fill="#e7eef4">• PA normal/baixa</text>
  <text x="60" y="226" font-size="10" fill="#9fb1c0">tipicamente em adulto jovem, leve</text>

  <rect x="350" y="70" width="290" height="170" rx="8" fill="#10202c" stroke="#e8a13a"/>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#f0c078" font-weight="bold">Compare: Bartter (alça)</text>
  <text x="370" y="122" font-size="11" fill="#e7eef4">• perda do NKCC2 (≈ diurético de alça)</text>
  <text x="370" y="148" font-size="11" fill="#e7eef4">• hipocalemia + alcalose</text>
  <text x="370" y="174" font-size="11" fill="#e7eef4">• HIPERcalciúria (perde Ca, como a alça)</text>
  <text x="370" y="200" font-size="11" fill="#e7eef4">• mais grave, na infância</text>
  <text x="370" y="226" font-size="10" fill="#9fb1c0">o Ca urinário separa Gitelman de Bartter</text>
</svg>

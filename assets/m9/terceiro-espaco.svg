<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">O "terceiro espaço" — líquido preso fora do leito útil</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">ascite, derrames, edema intestinal: ECF total alto, mas VCE baixo (sequestro)</text>

  <!-- compartimentos -->
  <rect x="60" y="80" width="120" height="150" rx="8" fill="#1d4e74" fill-opacity="0.5" stroke="#3a7bd5"/><text x="120" y="245" text-anchor="middle" font-size="10" fill="#9bbef0">intravascular (VCE)</text>
  <rect x="200" y="80" width="120" height="150" rx="8" fill="#0f3a40" fill-opacity="0.5" stroke="#39c0c8"/><text x="260" y="245" text-anchor="middle" font-size="10" fill="#9fe3ec">interstício</text>
  <rect x="340" y="80" width="160" height="150" rx="8" fill="#3a214a" fill-opacity="0.5" stroke="#a06ad0"/><text x="420" y="245" text-anchor="middle" font-size="10" fill="#c9a0e0">TERCEIRO espaço</text>
  <text x="420" y="155" text-anchor="middle" font-size="10" fill="#d7baf0">ascite, derrame,</text>
  <text x="420" y="170" text-anchor="middle" font-size="10" fill="#d7baf0">edema, íleo</text>

  <rect x="520" y="80" width="120" height="150" rx="8" fill="#10202c" stroke="#3a4a58"/>
  <text x="580" y="104" text-anchor="middle" font-size="10" fill="#e7eef4" font-weight="bold">consequência</text>
  <text x="536" y="130" font-size="10" fill="#cdd9e3">VCE ↓ apesar</text>
  <text x="536" y="146" font-size="10" fill="#cdd9e3">do ECF total ↑</text>
  <text x="536" y="172" font-size="10" fill="#f0c078">→ rim retém Na</text>
  <text x="536" y="188" font-size="10" fill="#f0c078">→ taquicardia, hipotensão</text>
  <text x="536" y="210" font-size="9" fill="#9fb1c0">repor volume é difícil:</text>
  <text x="536" y="224" font-size="9" fill="#9fb1c0">vaza para o 3º espaço</text>

  <text x="340" y="276" text-anchor="middle" font-size="10" fill="#9fb1c0">o mesmo princípio do subenchimento: o que importa é o VCE, não o total</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">A fisiopatologia do edema — Starling + retenção renal de Na</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">o líquido vaza para o interstício (Starling), e o rim retém Na para "reencher" → mais edema</text>

  <g font-size="11" fill="#e7eef4">
    <rect x="40" y="70" width="600" height="36" rx="6" fill="#10202c" stroke="#3a7bd5"/><text x="56" y="93">↑ pressão hidrostática capilar (ICC, obstrução venosa)</text>
    <rect x="40" y="112" width="600" height="36" rx="6" fill="#10202c" stroke="#e8a13a"/><text x="56" y="135">↓ pressão oncótica (hipoalbuminemia: nefrótica, cirrose, desnutrição)</text>
    <rect x="40" y="154" width="600" height="36" rx="6" fill="#10202c" stroke="#e0556b"/><text x="56" y="177">↑ permeabilidade capilar (inflamação, sepse) ou ↓ drenagem linfática</text>
  </g>

  <rect x="120" y="206" width="440" height="64" rx="8" fill="#10202c" stroke="#52c08a"/>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#e7eef4">o líquido que vai ao interstício BAIXA o VCE → o rim retém Na (FENa baixa)</text>
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#e8a13a">EDEMA = RETENÇÃO RENAL DE Na — por isso o tratamento inclui restringir sal e diurético</text>
  <text x="340" y="266" text-anchor="middle" font-size="9" fill="#9fb1c0">a causa do vazamento (Starling) e a retenção (rim) andam juntas</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Georgia,serif">
  <rect width="640" height="320" fill="#0d1b16" rx="6"/>
  <rect x="2" y="2" width="636" height="316" rx="5" fill="none" stroke="#2a7a4a" stroke-width="2"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#bfe9cf">Citrato regional — quelação do Ca²⁺ só no circuito</text>
  <!-- paciente -->
  <ellipse cx="78" cy="170" rx="48" ry="62" fill="#3a2230" stroke="#e0556b" stroke-width="2"/>
  <text x="78" y="166" text-anchor="middle" font-size="13" fill="#f0c5cf">paciente</text>
  <text x="78" y="186" text-anchor="middle" font-size="11" fill="#f0c5cf">Ca²⁺ 1,15</text>
  <!-- linha saída -->
  <line x1="126" y1="150" x2="240" y2="150" stroke="#7fb0c8" stroke-width="6"/>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#9fc8d8">sangue sai (Qb)</text>
  <!-- ponto de infusão de citrato (pré-filtro) -->
  <circle cx="240" cy="150" r="8" fill="#e8a13a"/>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="#e8a13a">citrato ↓ (pré-filtro)</text>
  <text x="240" y="106" text-anchor="middle" font-size="10" fill="#e8a13a">quela o Ca²⁺</text>
  <!-- filtro -->
  <rect x="280" y="110" width="80" height="80" rx="8" fill="#15302a" stroke="#39c08a" stroke-width="2"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#9fe0c0">FILTRO</text>
  <text x="320" y="167" text-anchor="middle" font-size="10" fill="#9fe0c0">Ca²⁺ 0,30</text>
  <text x="320" y="205" text-anchor="middle" font-size="10" fill="#52c08a">sem Ca²⁺ → não coagula</text>
  <!-- ponto de reposição de cálcio (pós-filtro) -->
  <line x1="360" y1="150" x2="500" y2="150" stroke="#7fb0c8" stroke-width="6"/>
  <circle cx="450" cy="150" r="8" fill="#52c08a"/>
  <text x="450" y="120" text-anchor="middle" font-size="11" fill="#52c08a">cálcio ↑ (pós-filtro)</text>
  <text x="450" y="106" text-anchor="middle" font-size="10" fill="#52c08a">repõe Ca²⁺</text>
  <!-- retorno -->
  <line x1="500" y1="150" x2="500" y2="250" stroke="#7fb0c8" stroke-width="6"/>
  <line x1="500" y1="250" x2="126" y2="250" stroke="#7fb0c8" stroke-width="6"/>
  <line x1="126" y1="250" x2="126" y2="210" stroke="#7fb0c8" stroke-width="6"/>
  <text x="300" y="245" text-anchor="middle" font-size="11" fill="#9fc8d8">retorno: Ca²⁺ 1,2 (normal) — paciente NÃO anticoagulado</text>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="#6fae8a">FILTRA · DIALISA — CRM-SP 151.318 · Dr. Matheus M. Coelho · Limeira</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui,Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52c08a"/></marker></defs>
  <rect width="680" height="300" rx="8" fill="#0f1720"/>
  <rect x="2" y="2" width="676" height="296" rx="7" fill="none" stroke="#283642"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c0c8">Insulina e β-agonista ativam a Na⁺/K⁺-ATPase → K⁺ para dentro</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#9fb1c0">a mesma bomba que cria o gradiente é o alvo da terapia de shift na hipercalemia</text>

  <rect x="250" y="80" width="180" height="150" rx="10" fill="#0c2330" stroke="#39c0c8" stroke-width="2"/>
  <text x="340" y="104" text-anchor="middle" font-size="12" fill="#9fe3ec" font-weight="bold">Na⁺/K⁺-ATPase</text>
  <text x="340" y="124" text-anchor="middle" font-size="10" fill="#cdd9e3">3 Na⁺ out · 2 K⁺ in</text>
  <line x1="430" y1="150" x2="360" y2="150" stroke="#52c08a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="470" y="154" font-size="11" fill="#52c08a">K⁺ entra</text>
  <line x1="250" y1="190" x2="320" y2="190" stroke="#e8a13a" stroke-width="2"/>
  <text x="150" y="194" font-size="11" fill="#f0c078">3 Na⁺ saem</text>

  <g font-size="11" fill="#e7eef4">
    <rect x="60" y="245" width="250" height="40" rx="6" fill="#10202c" stroke="#52c08a"/>
    <text x="76" y="262">insulina → ativa a bomba</text>
    <text x="76" y="278" fill="#9fb1c0" font-size="9">(co-administrar glicose: evita hipoglicemia)</text>
    <rect x="370" y="245" width="250" height="40" rx="6" fill="#10202c" stroke="#3a7bd5"/>
    <text x="386" y="262" fill="#9bbef0">β₂-agonista (salbutamol) → ativa a bomba</text>
    <text x="386" y="278" fill="#9fb1c0" font-size="9">efeito aditivo ao da insulina</text>
  </g>
  <text x="340" y="70" text-anchor="middle" font-size="10" fill="#e8a13a">baixa a caliemia sem remover K do corpo (efeito temporário)</text>
</svg>
